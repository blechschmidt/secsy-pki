name: Enterprise CI (SoftHSM)

# Runs the HSM-backed enterprise integration suite against a real PKCS#11
# token (SoftHSM) on every push to the enterprise branch, and on pull requests
# that target it. The suite drives the full product flow:
#
#   initialize token -> generate HSM CA key -> issue root + intermediate + leaf
#   -> verify the chain -> revoke a cert and validate CRL/OCSP
#   -> password encrypt/decrypt round-trips.
#
# The job reuses the same repeatable, idempotent scripts developers run locally
# (scripts/setup-softhsm.sh and scripts/integration-test.sh) so CI and local
# runs cannot drift. Any test failure fails the build.

on:
  push:
    branches: [enterprise]
  pull_request:
    branches: [enterprise]
  # Nightly full run. Every push gets the REQUIRED gates; the four advisory
  # (continue-on-error) suites — chaos, -race, interop and the benchmark diff —
  # run here instead. They cannot fail a build by construction, but together
  # they are the most expensive half of this workflow, so paying for them once a
  # day rather than on every push is what keeps the suite affordable on a
  # private repository's runner-minute allowance. See
  # docs/development/ci.md#runner-minutes.
  schedule:
    - cron: "17 3 * * *"
  # How release.yaml gates a release on this suite. A version tag does not match
  # the `push` filter above — that is branches only — so without this the tag
  # would publish an image and a set of binaries that nothing had tested, on the
  # strength of the branch having been green at some earlier commit.
  #
  # No inputs: a release wants this suite exactly as it runs on the branch. The
  # two `workflow_dispatch` inputs below are baseline-refresh escape hatches for
  # a human at the Actions tab, and every use of them is already gated on
  # `github.event_name == 'workflow_dispatch'`, so they stay inert here — a
  # called run reports the *caller's* event, which for a release is `push`.
  # That same rule is what skips the four advisory suites: they ask for
  # `schedule` or `workflow_dispatch`, so a release runs the nine required
  # gates and does not pay for the nightly-only half.
  workflow_call:

  # Allow manual runs from the Actions tab for debugging / re-runs.
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: "Benchmark gate: regenerate bench/baseline.txt on the runner and upload it as an artifact (skips the comparison)"
        type: boolean
        default: false
      refresh_coverage_baseline:
        description: "Coverage gate: regenerate coverage/baseline.txt on the runner and upload it as an artifact (skips the ratchet)"
        type: boolean
        default: false

# Cancel superseded runs on the same ref to save runner minutes.
#
# `github.workflow` is in the key because this workflow is also *called* — by
# release.yaml — and a called run reports the caller's context. Without it, a
# release dry run dispatched from `enterprise` computes the same group as the
# ordinary push run on that branch, and `cancel-in-progress` has one kill the
# other; a cancelled `ci` job then fails the release. With it, the release's
# copy is `enterprise-ci-release-…` and the branch's is `enterprise-ci-Enterprise
# CI (SoftHSM)-…`, so the two coexist and each still supersedes itself.
concurrency:
  group: enterprise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  softhsm-integration:
    name: SoftHSM integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Deterministic, self-contained SoftHSM location for this run. Kept in
      # sync with the defaults in scripts/setup-softhsm.sh.
      SOFTHSM2_CONF: /tmp/softhsm2.conf
      SOFTHSM_TOKEN_DIR: /tmp/softhsm/tokens
      # go.mod pins go1.25.7; system Go bootstraps it via GOTOOLCHAIN=auto.
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-go installs the exact toolchain pinned in go.mod and caches the
      # module download cache + build cache keyed on server/go.sum.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install SoftHSM and OpenSC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc

      # Idempotent token provisioning. Re-runnable without duplicating tokens;
      # SOFTHSM_REINIT=1 guarantees a clean token even on a warm/cached runner.
      - name: Provision SoftHSM token
        env:
          SOFTHSM_REINIT: "1"
        run: ./scripts/setup-softhsm.sh

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # Build every binary (both with and without the sqlite tag) before tests
      # so a compile break fails fast and independently of the test run.
      - name: Build all targets
        working-directory: server
        run: |
          go build -tags sqlite -o /dev/null ./cmd/server
          for cmd in server verify secsy-ca secsy-secret secsy-ssh; do
            echo "==> building ./cmd/$cmd"
            go build -o /dev/null "./cmd/$cmd"
          done

      # Runs setup-softhsm.sh (idempotent), loads the SECSY_* PKCS#11 env, and
      # executes the end-to-end suite serialized with -p 1 (a single SoftHSM
      # token is not safe for concurrent access). Non-zero exit fails the build.
      - name: Run integration test suite
        run: ./scripts/integration-test.sh

  fuzz-smoke:
    name: Fuzz smoke (parsers & crypto boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The fuzz targets exercise untrusted-input parsing surfaces (CSR/DER,
    # ACME JOSE/JWS, the secret envelope decrypt/unwrap path, and OCSP/cert
    # parsing). Every target runs entirely in software — the secret decrypt
    # path uses an in-memory RSA wrapper — so this job needs no SoftHSM and
    # runs independently of the integration suite.
    env:
      GOTOOLCHAIN: auto
      # Bounded per-target budget for CI. This is a smoke run to catch panics,
      # unbounded allocations, and nil-derefs on the seed corpora and quick
      # mutations — not an exhaustive campaign. Run longer locally with
      # `FUZZTIME=10m server/scripts/fuzz.sh`.
      FUZZTIME: 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # First run the fuzz seed corpora as ordinary unit tests (no -fuzz): fast,
      # deterministic, and it fails the build if any committed regression seed
      # reproduces. Then run each target's bounded mutation smoke pass.
      - name: Run fuzz seed corpora
        working-directory: server
        run: go test ./internal/pki/ ./internal/ca/ ./internal/acme/ ./internal/secret/

      - name: Fuzz smoke run
        working-directory: server
        run: ./scripts/fuzz.sh

  fips:
    name: FIPS 140-3 (GOFIPS140 build + fips140=on tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Task 65: build the FIPS variant on the Go Cryptographic Module and prove
    # the suite holds with the module active. `make build-fips` fails unless
    # the produced binaries report fips140=on at startup; the test runs then
    # execute with GOFIPS140 selecting the module at build time and
    # GODEBUG=fips140=on at runtime — first the full non-HSM unit suite, then a
    # SoftHSM smoke pass over the e2e flow and the OAEP-sensitive packages.
    # (fips140=on activates the module for approved algorithms; the fail-closed
    # rejection of non-approved ones is secsy-pki's own security.fips policy,
    # which the unit suite exercises.)
    env:
      SOFTHSM2_CONF: /tmp/softhsm2.conf
      SOFTHSM_TOKEN_DIR: /tmp/softhsm/tokens
      GOTOOLCHAIN: auto
      GOFIPS140: latest
      GODEBUG: fips140=on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Build FIPS binaries and verify they report fips140=on
        run: make build-fips

      - name: Unit suite under fips140=on (no HSM)
        working-directory: server
        run: go test -tags sqlite ./...

      - name: Install SoftHSM and OpenSC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc

      - name: Provision SoftHSM token
        env:
          SOFTHSM_REINIT: "1"
        run: ./scripts/setup-softhsm.sh

      # Smoke, not the full HSM matrix: the end-to-end flow plus the packages
      # where FIPS mode interacts with the token (secret-layer OAEP
      # negotiation, doctor posture checks). Serialized with -p 1 — one SoftHSM
      # token is not safe for concurrent package access.
      - name: SoftHSM smoke under fips140=on
        run: |
          eval "$(./scripts/setup-softhsm.sh --export-env)"
          cd server
          go test -tags sqlite -p 1 -count=1 ./internal/e2e/ ./internal/secret/ ./internal/doctor/

  dr-store-integrity:
    name: DR store integrity (Postgres, no HSM)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The non-HSM subset of the full-stack disaster-recovery drill
    # (scripts/dr-drill-full.sh). It exercises the pluggable persistence backend
    # end-to-end against a real PostgreSQL service — schema creation/migration,
    # the cross-backend `db migrate` copier, and the post-restore integrity
    # invariants (audit-chain continuity, serial/CRL monotonicity, revocation
    # consistency) that gate every restore in the drill — all in software so it
    # needs no SoftHSM. Its purpose is to catch schema/migration regressions and
    # integrity-check regressions on every push, without the cost of the full
    # HSM + container drill.
    env:
      GOTOOLCHAIN: auto
      # Point the database tests at the Postgres service so both the SQLite and
      # PostgreSQL backend paths run (they skip Postgres when this is unset).
      SECSY_TEST_PG_DSN: postgres://secsy:secsy@localhost:5432/secsy_pki?sslmode=disable

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secsy
          POSTGRES_PASSWORD: secsy
          POSTGRES_DB: secsy_pki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secsy -d secsy_pki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # The whole database package against both backends: store-integrity checks
      # (integrity_test.go), the migration copier (migrate_copy_test.go), and the
      # concurrent counter-monotonicity invariants. -p 1 keeps the shared Postgres
      # database from being raced across packages. The sqlite build tag pulls in
      # the SQLite driver so the SQLite path runs alongside Postgres. The leader
      # package rides along for its advisory-lock election tests (exactly one
      # leader, failover on session kill), which need the same real Postgres.
      - name: Run store-integrity & migration tests (SQLite + Postgres)
        working-directory: server
        run: go test -tags sqlite -p 1 -count=1 ./internal/database/... ./internal/leader/...

      # Static-check the DR drill script so a syntax error can't ship unnoticed.
      - name: Shellcheck the DR drill scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning scripts/dr-drill-full.sh scripts/dr-drill.sh || true
          bash -n scripts/dr-drill-full.sh

  docs:
    name: Documentation structure (links & indexes, no HSM)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The guides in docs/ are grouped into topic sections, each with its own
    # index. This gate keeps that layout true: every relative link and #anchor
    # must resolve, every page under docs/<section>/ must be reachable from an
    # index, and every `docs/<page>.md` path quoted in a Go comment, config.yaml,
    # the Helm chart or an alert annotation must still point somewhere. Needs
    # only a checkout — no Go build, no SoftHSM, no database.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation structure
        run: ./scripts/check-docs.sh

  openapi:
    name: OpenAPI spec & generated client SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Verifies the OpenAPI 3.1 spec is valid and that the committed Go client
    # SDK (server/pkg/client) is in sync with it. The generator (oapi-codegen)
    # is pinned as a `tool` dependency in server/go.mod and runs via `go tool`,
    # so this needs no SoftHSM and no extra install step. It regenerates the
    # client and fails on any drift.
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Check spec and generated client are in sync
        working-directory: server
        run: ./scripts/openapi-check.sh

  static-analysis:
    name: Static analysis (go vet + golangci-lint, no HSM)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Task 85: HSM-free quality gate. Runs `go vet ./...` and `golangci-lint
    # run` (config server/.golangci.yml) with the sqlite build tag so the SQLite
    # persistence driver and its dependents type-check without a token. It runs
    # the same `make vet` / `make lint` targets developers use locally, and
    # golangci-lint is pinned to the Makefile's GOLANGCI_LINT_VERSION so CI and
    # local runs cannot drift. Kept green on the enterprise branch and PRs.
    env:
      GOTOOLCHAIN: auto
      # Keep in lockstep with GOLANGCI_LINT_VERSION in the root Makefile.
      GOLANGCI_LINT_VERSION: v2.11.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # go vet is fast and catches a compiler-adjacent class of issues distinct
      # from golangci-lint; run it first (also proves the `make vet` target).
      - name: go vet (make vet)
        run: make vet

      # Install the pinned golangci-lint to GOPATH/bin via the official script
      # (deterministic, no action-version coupling), then expose it on PATH so
      # `make lint` picks up the binary instead of the go-run fallback.
      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint (make lint)
        run: make lint

      # The release guard's own test suite: it drives scripts/release-guard.sh
      # against deliberately broken changelogs (undated sections, a version that
      # is not the newest, sections that do not descend, 1.10.0 against 1.9.0).
      # It lives on a per-push job rather than in release.yaml because a guard
      # only exercised by the release it guards is not a guard — the point is to
      # catch a regression in it now, not at the moment a tag needs it. Needs no
      # HSM, no database and no Go build; it is a second or two.
      - name: Release-guard rules (make release-guard-test)
        run: make release-guard-test

  chaos-resilience:
    name: Chaos / fault-injection resilience suite
    # Advisory suite: runs on the nightly schedule and on manual dispatch, not on
    # every push (see the schedule trigger above). continue-on-error already means
    # it can never block a merge, so per-push execution bought signal nobody gates
    # on at the highest runner-minute cost in this workflow.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Non-required (advisory) gate. The chaos suite deliberately degrades the
    # HSM (Task 44 failover / Task 20 session pool), the persistence backend
    # (Task 38 serial/CRL contention + audit-chain continuity under connection
    # drops), and the rate-limit / HSM concurrency guard (Task 25), asserting
    # fail-closed and graceful-degradation invariants. It exercises real
    # dependencies (SoftHSM + an ephemeral PostgreSQL) and some scenarios inject
    # timing-sensitive faults, so it is marked continue-on-error: a red run is a
    # signal to investigate, not a merge blocker. Promote it to required once it
    # has proven stable on the runners.
    continue-on-error: true

    env:
      SOFTHSM2_CONF: /tmp/softhsm2.conf
      SOFTHSM_TOKEN_DIR: /tmp/softhsm/tokens
      GOTOOLCHAIN: auto
      # Point the connection-drop scenario at the Postgres service; without it
      # those subtests skip and only the SoftHSM/in-memory scenarios run.
      SECSY_TEST_PG_DSN: postgres://secsy:secsy@localhost:5432/secsy_pki?sslmode=disable

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secsy
          POSTGRES_PASSWORD: secsy
          POSTGRES_DB: secsy_pki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secsy -d secsy_pki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install SoftHSM and OpenSC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # The runner drives the same one-command script developers use locally.
      # SECSY_TEST_PG_DSN is already set to the service, so the script reuses it
      # instead of starting its own container. Any invariant violation fails the
      # job (which is advisory via continue-on-error).
      - name: Run chaos / fault-injection resilience suite
        env:
          SOFTHSM_REINIT: "1"
        run: ./scripts/chaos-test.sh -v

  race-detector:
    name: Data-race detector (-race)
    # Advisory suite: runs on the nightly schedule and on manual dispatch, not on
    # every push (see the schedule trigger above). continue-on-error already means
    # it can never block a merge, so per-push execution bought signal nobody gates
    # on at the highest runner-minute cost in this workflow.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Task 109. Non-required (advisory) gate, modeled on the chaos job. Runs the
    # whole test suite under Go's -race detector via the same `make test-race`
    # target developers use locally: the HSM-free packages in parallel, and the
    # SoftHSM/PostgreSQL-backed packages (plus the end-to-end HTTP handlers)
    # serialized with -p 1 so cross-package contention on the single token / shared
    # database cannot flake the run. It stresses the system's concurrency hot spots
    # against real dependencies — the bounded PKCS#11 session pool and HSM-HA
    # failover health tracking, the rate-limit token buckets, leader-elected
    # background jobs, the SSE audit-event fan-out, and the OCSP/CRL/metrics caches.
    # A red run is a real data race to fix; continue-on-error keeps it advisory
    # until it has proven stable on the runners, exactly like the chaos and interop
    # jobs. The committed baseline is clean.
    continue-on-error: true

    env:
      SOFTHSM2_CONF: /tmp/softhsm2.conf
      SOFTHSM_TOKEN_DIR: /tmp/softhsm/tokens
      GOTOOLCHAIN: auto
      # Point the leader-election / store-integrity / connection-drop scenarios at
      # the service Postgres so they run (rather than skip) under -race; the
      # PG-backed packages are all in the -p 1 serial set, so this adds no
      # cross-package database contention.
      SECSY_TEST_PG_DSN: postgres://secsy:secsy@localhost:5432/secsy_pki?sslmode=disable

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secsy
          POSTGRES_PASSWORD: secsy
          POSTGRES_DB: secsy_pki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secsy -d secsy_pki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install SoftHSM and OpenSC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Provision SoftHSM token
        env:
          SOFTHSM_REINIT: "1"
        run: ./scripts/setup-softhsm.sh

      # Load the SECSY_* PKCS#11 env (module path, token label, PINs) so the
      # SoftHSM-backed packages run rather than skip, then drive the same
      # `make test-race` target developers use locally. `make` inherits the
      # exported env, so its -p 1 serial recipe sees the token and the DSN. Any
      # race the detector reports fails this step (advisory via continue-on-error).
      - name: Run the suite under the -race detector
        run: |
          eval "$(./scripts/setup-softhsm.sh --export-env)"
          make test-race

  interop-conformance:
    name: External-client interop / conformance suite
    # Advisory suite: runs on the nightly schedule and on manual dispatch, not on
    # every push (see the schedule trigger above). continue-on-error already means
    # it can never block a merge, so per-push execution bought signal nobody gates
    # on at the highest runner-minute cost in this workflow.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Non-required (advisory) gate, modeled on the chaos job. It stands up a live
    # SoftHSM-backed server and drives it with real third-party clients — acme.sh
    # (http-01 / tls-alpn-01 / dns-01 / EAB / ARI / IP identifiers), openssl cmp,
    # a curl+openssl EST client, openssl ocsp, openssl crl (base + delta), and
    # openssl ts — to catch protocol regressions that our own Go test client can
    # miss. It depends on external tooling (a pinned acme.sh checkout from GitHub,
    # socat, the host openssl's cmp/ts support), so a red run is a signal to
    # investigate rather than a merge blocker: continue-on-error keeps it advisory
    # until it has proven stable on the runners. It uses SQLite (no Postgres
    # service needed) and only non-privileged ports.
    continue-on-error: true

    env:
      SOFTHSM2_CONF: /tmp/softhsm2.conf
      SOFTHSM_TOKEN_DIR: /tmp/softhsm/tokens
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # softhsm2 + opensc for the token; socat is required by acme.sh's
      # standalone/alpn challenge responders; openssl (with cmp/ts) and curl are
      # preinstalled on the runner.
      - name: Install SoftHSM, OpenSC and socat
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc socat

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # Drives the same one-command script developers run locally. It provisions
      # a fresh token, builds the server + CLI + interop helpers, brings up a live
      # server, runs every external client, records the tool versions used, and
      # exits non-zero on any conformance failure (advisory via continue-on-error).
      - name: Run external-client interop / conformance suite
        env:
          SOFTHSM_REINIT: "1"
        run: ./scripts/interop-test.sh

  benchmark-regression:
    name: Benchmark regression gate (no HSM)
    # Advisory suite: runs on the nightly schedule and on manual dispatch, not on
    # every push (see the schedule trigger above). continue-on-error already means
    # it can never block a merge, so per-push execution bought signal nobody gates
    # on at the highest runner-minute cost in this workflow.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Task 115. Non-required (advisory) gate, modeled on the chaos/race jobs. It
    # runs the HSM-FREE benchmark set — the `…Software…` benchmarks over the
    # on-disk software key provider (signing, end-to-end issuance, OCSP, CRL, and
    # envelope seal/open), which are CPU-bound and deterministic with no token in
    # the loop — and diffs it against the committed baseline (bench/baseline.txt)
    # with benchstat via `make bench-compare`. benchstat only reports a signed
    # delta when the change is statistically significant (p < alpha), so runner
    # noise shows as "~" rather than a false regression; the gate fails only on a
    # significant slowdown / allocation increase >= BENCH_REGRESS_PCT (10%). The
    # full benchstat table is written to the job step summary for at-a-glance
    # review on the PR. Needs no SoftHSM.
    #
    # Absolute ns/op is machine-dependent, so an apples-to-apples baseline must be
    # generated on THIS runner class: dispatch the workflow with
    # refresh_baseline=true to regenerate it and upload it as an artifact to
    # download and commit (see docs/development/benchmarks.md#benchmark-regression-gate).
    # continue-on-error keeps the gate advisory until it has proven stable on the
    # hosted runners (which are noisier than a dedicated box).
    continue-on-error: true

    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # Manual refresh path: regenerate the baseline on this runner class and
      # upload it as an artifact to download and commit. Does not compare.
      - name: Regenerate baseline (manual refresh)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_baseline
        run: make bench-baseline

      - name: Upload refreshed baseline artifact
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_baseline
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench/baseline.txt

      # Default path (push / PR / plain dispatch): run the HSM-free benchmarks and
      # diff against the committed baseline. Exits non-zero on a significant
      # regression (advisory via continue-on-error); the step summary carries the
      # benchstat table either way.
      - name: Compare against committed baseline (make bench-compare)
        if: github.event_name != 'workflow_dispatch' || !inputs.refresh_baseline
        run: make bench-compare

  coverage-gate:
    name: Test-coverage ratchet gate (no HSM)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Task 119. A REQUIRED, HSM-free quality gate — the coverage analogue of the
    # static-analysis job. `make cover-check` runs the -tags sqlite test subset
    # WITHOUT a token (HSM-backed tests skip cleanly, contributing only their
    # HSM-free reachable coverage) with -coverprofile, aggregates total and
    # per-package statement coverage from the profile, and ratchets it against the
    # committed baseline (coverage/baseline.txt): total and per-package coverage
    # may only RISE. A real drop fails the build and prints which packages
    # regressed; the full ratchet table is written to the job step summary. Unlike
    # the benchmark gate (whose ns/op is genuinely machine-noise-sensitive, hence
    # advisory), statement coverage is deterministic — the total is stable
    # run-to-run and the sub-1pp jitter of a few timing-sensitive packages stays
    # under COVER_TOLERANCE (1.0pp) — so this gate blocks merges. This job runs no
    # Postgres service and installs no SoftHSM, matching exactly the environment in
    # which the committed baseline was generated (scripts/cover-baseline.sh).
    #
    # If the baseline was generated on a different machine class and the runner's
    # numbers diverge, refresh it authoritatively on THIS runner: dispatch the
    # workflow with refresh_coverage_baseline=true to regenerate coverage/baseline.txt
    # and upload it as an artifact to download and commit
    # (see TESTING.md#test-coverage-gate and docs/development/coverage.md).
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # Manual refresh path: regenerate the baseline on this runner class and
      # upload it as an artifact to download and commit. Does not ratchet.
      - name: Regenerate baseline (manual refresh)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_coverage_baseline
        run: make cover-baseline

      - name: Upload refreshed baseline artifact
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_coverage_baseline
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: coverage/baseline.txt

      # Default path (push / PR / plain dispatch): run the HSM-free coverage set and
      # ratchet against the committed baseline. Exits non-zero on a regression; the
      # step summary carries the per-package ratchet table either way.
      - name: Ratchet coverage against committed baseline (make cover-check)
        if: github.event_name != 'workflow_dispatch' || !inputs.refresh_coverage_baseline
        run: make cover-check

      # Always publish the browsable HTML report + per-package summary so a drop
      # (or an intended improvement) can be inspected line-by-line from the run,
      # even when the ratchet step failed.
      - name: Upload coverage report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            dist/coverage.html
            dist/coverage-summary.txt
          if-no-files-found: ignore
