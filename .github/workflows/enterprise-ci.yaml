name: Enterprise CI (SoftHSM)

# Runs the HSM-backed enterprise integration suite against a real PKCS#11
# token (SoftHSM) on every push to the enterprise branch, and on pull requests
# that target it. The suite drives the full product flow:
#
#   initialize token -> generate HSM CA key -> issue root + intermediate + leaf
#   -> verify the chain -> revoke a cert and validate CRL/OCSP
#   -> password encrypt/decrypt round-trips.
#
# The job reuses the same repeatable, idempotent scripts developers run locally
# (scripts/setup-softhsm.sh and scripts/integration-test.sh) so CI and local
# runs cannot drift. Any test failure fails the build.

on:
  push:
    branches: [enterprise]
  pull_request:
    branches: [enterprise]
  # Allow manual runs from the Actions tab for debugging / re-runs.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: enterprise-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  softhsm-integration:
    name: SoftHSM integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Deterministic, self-contained SoftHSM location for this run. Kept in
      # sync with the defaults in scripts/setup-softhsm.sh.
      SOFTHSM2_CONF: /tmp/softhsm2.conf
      SOFTHSM_TOKEN_DIR: /tmp/softhsm/tokens
      # go.mod pins go1.25.7; system Go bootstraps it via GOTOOLCHAIN=auto.
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-go installs the exact toolchain pinned in go.mod and caches the
      # module download cache + build cache keyed on server/go.sum.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install SoftHSM and OpenSC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc

      # Idempotent token provisioning. Re-runnable without duplicating tokens;
      # SOFTHSM_REINIT=1 guarantees a clean token even on a warm/cached runner.
      - name: Provision SoftHSM token
        env:
          SOFTHSM_REINIT: "1"
        run: ./scripts/setup-softhsm.sh

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # Build every binary (both with and without the sqlite tag) before tests
      # so a compile break fails fast and independently of the test run.
      - name: Build all targets
        working-directory: server
        run: |
          go build -tags sqlite -o /dev/null ./cmd/server
          for cmd in server verify secsy-ca secsy-secret secsy-ssh; do
            echo "==> building ./cmd/$cmd"
            go build -o /dev/null "./cmd/$cmd"
          done

      # Runs setup-softhsm.sh (idempotent), loads the SECSY_* PKCS#11 env, and
      # executes the end-to-end suite serialized with -p 1 (a single SoftHSM
      # token is not safe for concurrent access). Non-zero exit fails the build.
      - name: Run integration test suite
        run: ./scripts/integration-test.sh

  fuzz-smoke:
    name: Fuzz smoke (parsers & crypto boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The fuzz targets exercise untrusted-input parsing surfaces (CSR/DER,
    # ACME JOSE/JWS, the secret envelope decrypt/unwrap path, and OCSP/cert
    # parsing). Every target runs entirely in software — the secret decrypt
    # path uses an in-memory RSA wrapper — so this job needs no SoftHSM and
    # runs independently of the integration suite.
    env:
      GOTOOLCHAIN: auto
      # Bounded per-target budget for CI. This is a smoke run to catch panics,
      # unbounded allocations, and nil-derefs on the seed corpora and quick
      # mutations — not an exhaustive campaign. Run longer locally with
      # `FUZZTIME=10m server/scripts/fuzz.sh`.
      FUZZTIME: 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # First run the fuzz seed corpora as ordinary unit tests (no -fuzz): fast,
      # deterministic, and it fails the build if any committed regression seed
      # reproduces. Then run each target's bounded mutation smoke pass.
      - name: Run fuzz seed corpora
        working-directory: server
        run: go test ./internal/pki/ ./internal/ca/ ./internal/acme/ ./internal/secret/

      - name: Fuzz smoke run
        working-directory: server
        run: ./scripts/fuzz.sh

  fips:
    name: FIPS 140-3 (GOFIPS140 build + fips140=on tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Task 65: build the FIPS variant on the Go Cryptographic Module and prove
    # the suite holds with the module active. `make build-fips` fails unless
    # the produced binaries report fips140=on at startup; the test runs then
    # execute with GOFIPS140 selecting the module at build time and
    # GODEBUG=fips140=on at runtime — first the full non-HSM unit suite, then a
    # SoftHSM smoke pass over the e2e flow and the OAEP-sensitive packages.
    # (fips140=on activates the module for approved algorithms; the fail-closed
    # rejection of non-approved ones is secsy-pki's own security.fips policy,
    # which the unit suite exercises.)
    env:
      SOFTHSM2_CONF: /tmp/softhsm2.conf
      SOFTHSM_TOKEN_DIR: /tmp/softhsm/tokens
      GOTOOLCHAIN: auto
      GOFIPS140: latest
      GODEBUG: fips140=on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Build FIPS binaries and verify they report fips140=on
        run: make build-fips

      - name: Unit suite under fips140=on (no HSM)
        working-directory: server
        run: go test -tags sqlite ./...

      - name: Install SoftHSM and OpenSC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc

      - name: Provision SoftHSM token
        env:
          SOFTHSM_REINIT: "1"
        run: ./scripts/setup-softhsm.sh

      # Smoke, not the full HSM matrix: the end-to-end flow plus the packages
      # where FIPS mode interacts with the token (secret-layer OAEP
      # negotiation, doctor posture checks). Serialized with -p 1 — one SoftHSM
      # token is not safe for concurrent package access.
      - name: SoftHSM smoke under fips140=on
        run: |
          eval "$(./scripts/setup-softhsm.sh --export-env)"
          cd server
          go test -tags sqlite -p 1 -count=1 ./internal/e2e/ ./internal/secret/ ./internal/doctor/

  dr-store-integrity:
    name: DR store integrity (Postgres, no HSM)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The non-HSM subset of the full-stack disaster-recovery drill
    # (scripts/dr-drill-full.sh). It exercises the pluggable persistence backend
    # end-to-end against a real PostgreSQL service — schema creation/migration,
    # the cross-backend `db migrate` copier, and the post-restore integrity
    # invariants (audit-chain continuity, serial/CRL monotonicity, revocation
    # consistency) that gate every restore in the drill — all in software so it
    # needs no SoftHSM. Its purpose is to catch schema/migration regressions and
    # integrity-check regressions on every push, without the cost of the full
    # HSM + container drill.
    env:
      GOTOOLCHAIN: auto
      # Point the database tests at the Postgres service so both the SQLite and
      # PostgreSQL backend paths run (they skip Postgres when this is unset).
      SECSY_TEST_PG_DSN: postgres://secsy:secsy@localhost:5432/secsy_pki?sslmode=disable

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secsy
          POSTGRES_PASSWORD: secsy
          POSTGRES_DB: secsy_pki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secsy -d secsy_pki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # The whole database package against both backends: store-integrity checks
      # (integrity_test.go), the migration copier (migrate_copy_test.go), and the
      # concurrent counter-monotonicity invariants. -p 1 keeps the shared Postgres
      # database from being raced across packages. The sqlite build tag pulls in
      # the SQLite driver so the SQLite path runs alongside Postgres. The leader
      # package rides along for its advisory-lock election tests (exactly one
      # leader, failover on session kill), which need the same real Postgres.
      - name: Run store-integrity & migration tests (SQLite + Postgres)
        working-directory: server
        run: go test -tags sqlite -p 1 -count=1 ./internal/database/... ./internal/leader/...

      # Static-check the DR drill script so a syntax error can't ship unnoticed.
      - name: Shellcheck the DR drill scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning scripts/dr-drill-full.sh scripts/dr-drill.sh || true
          bash -n scripts/dr-drill-full.sh

  openapi:
    name: OpenAPI spec & generated client SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Verifies the OpenAPI 3.1 spec is valid and that the committed Go client
    # SDK (server/pkg/client) is in sync with it. The generator (oapi-codegen)
    # is pinned as a `tool` dependency in server/go.mod and runs via `go tool`,
    # so this needs no SoftHSM and no extra install step. It regenerates the
    # client and fails on any drift.
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Check spec and generated client are in sync
        working-directory: server
        run: ./scripts/openapi-check.sh

  chaos-resilience:
    name: Chaos / fault-injection resilience suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Non-required (advisory) gate. The chaos suite deliberately degrades the
    # HSM (Task 44 failover / Task 20 session pool), the persistence backend
    # (Task 38 serial/CRL contention + audit-chain continuity under connection
    # drops), and the rate-limit / HSM concurrency guard (Task 25), asserting
    # fail-closed and graceful-degradation invariants. It exercises real
    # dependencies (SoftHSM + an ephemeral PostgreSQL) and some scenarios inject
    # timing-sensitive faults, so it is marked continue-on-error: a red run is a
    # signal to investigate, not a merge blocker. Promote it to required once it
    # has proven stable on the runners.
    continue-on-error: true

    env:
      SOFTHSM2_CONF: /tmp/softhsm2.conf
      SOFTHSM_TOKEN_DIR: /tmp/softhsm/tokens
      GOTOOLCHAIN: auto
      # Point the connection-drop scenario at the Postgres service; without it
      # those subtests skip and only the SoftHSM/in-memory scenarios run.
      SECSY_TEST_PG_DSN: postgres://secsy:secsy@localhost:5432/secsy_pki?sslmode=disable

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secsy
          POSTGRES_PASSWORD: secsy
          POSTGRES_DB: secsy_pki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secsy -d secsy_pki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install SoftHSM and OpenSC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc

      - name: Download Go modules
        working-directory: server
        run: go mod download

      # The runner drives the same one-command script developers use locally.
      # SECSY_TEST_PG_DSN is already set to the service, so the script reuses it
      # instead of starting its own container. Any invariant violation fails the
      # job (which is advisory via continue-on-error).
      - name: Run chaos / fault-injection resilience suite
        env:
          SOFTHSM_REINIT: "1"
        run: ./scripts/chaos-test.sh -v
