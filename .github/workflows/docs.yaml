name: Documentation site (GitHub Pages)

# Publishes the documentation tree to https://blechschmidt.github.io/secsy-pki/
#
# The site is not a second copy of the docs: scripts/build-docs.py stages this
# repository's own Markdown (docs/, README.md, ARCHITECTURE.md, TESTING.md,
# examples/) mirroring the repository layout so the ~900 relative links between
# pages survive, derives the navigation from the section indexes that
# scripts/check-docs.sh already enforces, and Material for MkDocs renders it.
#
# Both jobs run the same `make docs-site` developers run locally, so CI and
# local builds cannot drift. That build is --strict, which makes this workflow a
# gate as well as a publisher: a relative link that does not resolve in the
# rendered site, a dead #heading-anchor, or a page missing from the navigation
# fails it. Pull requests build but do not deploy, so breakage is caught in
# review rather than on the live site.
#
# Publishing needs GitHub Pages enabled with the "GitHub Actions" source. The
# deploy job turns that on itself via actions/configure-pages, but two things
# are outside a workflow's control (see docs/development/documentation-site.md):
#
#   * GitHub Pages is unavailable for *private* repositories on the Free plan —
#     the API answers "Your current plan does not support GitHub Pages for this
#     repository". secsy-pki is private today, so publishing starts working when
#     the repository is made public or the plan is upgraded; nothing here needs
#     to change.
#   * If the `github-pages` environment restricts deployments to protected
#     branches, `enterprise` has to be allowed.
#
# Rather than fail the run over either, the deploy job treats "Pages is not
# available" as a skip with an explanatory notice: the strict build still gates
# the change, and the rendered site is still attached to the run as the
# `github-pages` artifact. A genuine deployment failure — Pages available but
# the upload rejected — still fails the job.
# No secrets are needed: deployment authenticates with the run's OIDC token.

on:
  # Kept in sync between push and pull_request by hand: GitHub Actions does not
  # support YAML anchors in workflow files.
  push:
    branches: [enterprise]
    paths:
      - "docs/**"
      - "examples/**"
      - "website/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "TESTING.md"
      - "scripts/build-docs.py"
      - "scripts/check-docs.sh"
      - "Makefile"
      - ".github/workflows/docs.yaml"
  pull_request:
    branches: [enterprise]
    paths:
      - "docs/**"
      - "examples/**"
      - "website/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "TESTING.md"
      - "scripts/build-docs.py"
      - "scripts/check-docs.sh"
      - "Makefile"
      - ".github/workflows/docs.yaml"
  # Manual re-publish, e.g. after enabling Pages or changing branch policy.
  workflow_dispatch:

# Never cancel an in-flight deployment: a half-published site is worse than a
# slightly stale one. Superseded *builds* are cheap enough to let finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site toolchain is pure Python and pinned in
      # website/requirements.txt; no Go, HSM or database is involved.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      # Structural gate first: it names the offending file and target directly
      # ("<page> is not listed in <section>/README.md"), which is a far better
      # error than the same problem surfacing as a missing nav entry later.
      - name: Documentation structure check
        run: make docs-check

      # Stages the tree, generates the nav, renders with --strict. Creates its
      # own venv under dist/ from the pinned requirements, populated from the
      # pip cache above.
      - name: Build the site
        run: make docs-site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs-site

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests validate the build above; only the branch publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write        # deploy to the Pages site
      id-token: write     # OIDC token deploy-pages authenticates with

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Enables Pages with the "GitHub Actions" source if it is not enabled
      # yet, so the repository publishes without a manual settings visit. This
      # is also the availability probe: it is the step that fails when the plan
      # does not offer Pages for a private repository.
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4

      # Green, but loud: the site was built and uploaded, and this says exactly
      # what is standing between it and a URL.
      - name: Report that Pages is unavailable
        if: steps.configure.outcome != 'success'
        run: |
          echo "::notice title=Documentation site not published::GitHub Pages is not \
          available for this repository, so the built site was not deployed. It is \
          attached to this run as the 'github-pages' artifact. GitHub Pages requires \
          a public repository (or a paid plan for private ones), and the Pages source \
          set to 'GitHub Actions'. See docs/development/documentation-site.md."
