{{- $tlsSecret := include "secsy-pki.tlsSecretName" . -}}
{{- $softhsm := eq .Values.hsm.module.mode "softhsm" -}}
{{- /* Multi-replica preconditions (Task 68). The server coordinates its
singleton background jobs via PostgreSQL advisory-lock leader election, so
replicas > 1 is only sound when every replica shares one PostgreSQL and one
real HSM. Fail the render early on the two silently-corrupting combinations. */}}
{{- if gt (int .Values.replicaCount) 1 }}
{{- $driver := ternary .Values.externalDatabase.driver .Values.config.database.driver .Values.externalDatabase.enabled }}
{{- if has $driver (list "sqlite" "sqlite3") }}
{{- fail "replicaCount > 1 requires a shared PostgreSQL store: enable externalDatabase (recommended) or set config.database.driver=postgres. SQLite is single-node by construction. See docs/deployment/high-availability.md." }}
{{- end }}
{{- if $softhsm }}
{{- fail "replicaCount > 1 is not supported with hsm.module.mode=softhsm: each pod provisions its own token, so replicas would hold different CA keys. Use a shared/network HSM (hsm.module.mode=hostPath or image). See docs/deployment/high-availability.md." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secsy-pki.fullname" . }}
  labels:
    {{- include "secsy-pki.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if gt (int .Values.replicaCount) 1 }}
  # Multi-replica HA: roll pods gradually. Followers keep serving during the
  # roll, and background-job leadership hands over via the advisory lock the
  # moment the leader pod stops.
  strategy:
    type: RollingUpdate
  {{- else }}
  # SQLite state is single-writer; avoid rolling two writers onto one RWO volume.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "secsy-pki.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when the rendered config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "secsy-pki.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "secsy-pki.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if $softhsm }}
      initContainers:
        # Provision a SoftHSM token into a shared volume so the PKCS#11 readiness
        # probe succeeds. Idempotent: re-running leaves an existing token intact.
        - name: softhsm-init
          image: {{ include "secsy-pki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-euc"]
          args:
            - |
              LABEL="{{ .Values.hsm.token.label }}"
              if softhsm2-util --show-slots | grep -q "Label:[[:space:]]*$LABEL"; then
                echo "SoftHSM token '$LABEL' already initialized; skipping."
                exit 0
              fi
              echo "Initializing SoftHSM token '$LABEL'..."
              softhsm2-util --init-token --free \
                --label "$LABEL" \
                --so-pin "{{ .Values.hsm.softhsm.soPin }}" \
                --pin "$SECSY_USER_PIN"
              softhsm2-util --show-slots
          env:
            - name: SECSY_USER_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "secsy-pki.secretName" . }}
                  key: {{ .Values.secrets.pinKey }}
          volumeMounts:
            - name: softhsm-tokens
              mountPath: /var/lib/softhsm/tokens
      {{- end }}
      containers:
        - name: secsy-pki
          image: {{ include "secsy-pki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - "-config"
            - "/etc/secsy/config.yaml"
          ports:
            - name: http
              containerPort: {{ int .Values.config.server.port }}
              protocol: TCP
            {{- if and .Values.config.acme.enabled (gt (int .Values.config.acme.http01Port) 0) }}
            - name: acme-http01
              containerPort: {{ int .Values.config.acme.http01Port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.config.grpc.enabled }}
            # gRPC API surface (Task 56): the PKIService (issue/renew/revoke/
            # status + CRL/OCSP metadata) served over its own port with the same
            # TLS certificate and operator authentication as the REST listener.
            - name: grpc
              containerPort: {{ int .Values.config.grpc.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: SECSY_USER_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "secsy-pki.secretName" . }}
                  key: {{ .Values.secrets.pinKey }}
            - name: SECSY_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "secsy-pki.secretName" . }}
                  key: {{ .Values.secrets.rootPasswordKey }}
            {{- if .Values.externalDatabase.enabled }}
            # External (PostgreSQL) backend for multi-replica HA. The DSN carries
            # credentials, so it is injected from a Secret as an env var and never
            # written to the ConfigMap. SECSY_DATABASE_* overrides the rendered
            # config at startup (see applyEnvOverrides).
            - name: SECSY_DATABASE_DRIVER
              value: {{ .Values.externalDatabase.driver | quote }}
            - name: SECSY_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.dsnSecret.name | default (include "secsy-pki.secretName" .) }}
                  key: {{ .Values.externalDatabase.dsnSecret.key }}
            {{- with .Values.externalDatabase.maxOpenConns }}
            - name: SECSY_DATABASE_MAX_OPEN_CONNS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.externalDatabase.maxIdleConns }}
            - name: SECSY_DATABASE_MAX_IDLE_CONNS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.tls.allowInsecureHTTP }}
            - name: SECSY_ALLOW_INSECURE_HTTP
              value: "1"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
              scheme: {{ include "secsy-pki.scheme" . }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
              scheme: {{ include "secsy-pki.scheme" . }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
              scheme: {{ include "secsy-pki.scheme" . }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/secsy
              readOnly: true
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- if $softhsm }}
            - name: softhsm-tokens
              mountPath: /var/lib/softhsm/tokens
            {{- end }}
            {{- if eq .Values.hsm.module.mode "hostPath" }}
            - name: pkcs11-module
              mountPath: {{ .Values.hsm.module.hostPath.path }}
              readOnly: true
            {{- end }}
            {{- if $tlsSecret }}
            - name: tls
              mountPath: /etc/secsy/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "secsy-pki.fullname" . }}
        - name: tmp
          emptyDir: {}
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "secsy-pki.fullname" .) }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- if $softhsm }}
        - name: softhsm-tokens
          emptyDir: {}
        {{- end }}
        {{- if eq .Values.hsm.module.mode "hostPath" }}
        - name: pkcs11-module
          hostPath:
            path: {{ .Values.hsm.module.hostPath.path }}
            type: {{ .Values.hsm.module.hostPath.type }}
        {{- end }}
        {{- if $tlsSecret }}
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
