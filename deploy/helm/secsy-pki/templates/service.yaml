apiVersion: v1
kind: Service
metadata:
  name: {{ include "secsy-pki.fullname" . }}
  labels:
    {{- include "secsy-pki.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.config.grpc.enabled }}
    # gRPC API surface (Task 56). Exposed on a dedicated port; reach it from
    # outside the cluster with a gRPC-aware ingress/gateway (HTTP/2, TLS
    # passthrough or re-encryption).
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
  selector:
    {{- include "secsy-pki.selectorLabels" . | nindent 4 }}
