{{- if .Values.certManager.clusterIssuer.enabled }}
{{- $ci := .Values.certManager.clusterIssuer -}}
# cert-manager ACME ClusterIssuer pointing at this secsy-pki server's ACME
# directory. Workloads then request HSM-backed certificates with a standard
# cert-manager Certificate object referencing this issuer. Requires config.acme
# to be enabled on the server, cert-manager installed in the cluster, and an
# ACME-enabled issuing CA to exist (see docs/acme.md and docs/kubernetes.md).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $ci.name }}
  labels:
    {{- include "secsy-pki.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ include "secsy-pki.acmeDirectoryURL" . | quote }}
    email: {{ $ci.email | quote }}
    privateKeySecretRef:
      name: {{ $ci.privateKeySecretName }}
    {{- if $ci.skipTLSVerify }}
    skipTLSVerify: true
    {{- end }}
    {{- with $ci.caBundle }}
    caBundle: {{ . | quote }}
    {{- end }}
    {{- if $ci.solvers }}
    solvers:
      {{- toYaml $ci.solvers | nindent 6 }}
    {{- else }}
    solvers:
      # Default: HTTP-01 solved via an ingress. Adjust ingress.class to match
      # your cluster, or override certManager.clusterIssuer.solvers for dns-01.
      - http01:
          ingress:
            {{- with .Values.ingress.className }}
            ingressClassName: {{ . }}
            {{- end }}
    {{- end }}
{{- end }}
