{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secsy-pki.fullname" . }}
  labels:
    {{- include "secsy-pki.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.pinKey }}: {{ required "secrets.userPin is required when secrets.create=true" .Values.secrets.userPin | quote }}
  {{ .Values.secrets.rootPasswordKey }}: {{ required "secrets.rootPassword is required when secrets.create=true" .Values.secrets.rootPassword | quote }}
  {{- if and .Values.externalDatabase.enabled .Values.externalDatabase.dsn }}
  {{ .Values.externalDatabase.dsnSecret.key }}: {{ .Values.externalDatabase.dsn | quote }}
  {{- end }}
{{- end }}
