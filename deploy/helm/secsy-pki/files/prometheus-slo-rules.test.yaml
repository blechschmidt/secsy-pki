# promtool unit tests for the SLO recording rules and multi-window burn-rate
# alerts (Task 139). Run from this directory:
#
#   promtool test rules prometheus-slo-rules.test.yaml
#
# Each test feeds a synthetic counter/histogram at a fixed rate that produces a
# known error-budget burn rate, then asserts the right alert fires (fast/page vs
# slow/ticket) — or does not — at a time past both the 6h window and the alert's
# `for`. All series carry job="secsy-ca" so the job-level recording rules and the
# `{{ $labels.job }}` annotations render deterministically.
rule_files:
  - prometheus-slo-rules.yaml

evaluation_interval: 1m

tests:
  # 1. Issuance at a 10% error rate (burn ~20x on the 0.005 budget): both the
  #    fast (1h+5m, 14.4x) and slow (6h+30m, 6x) burn alerts fire.
  - interval: 1m
    input_series:
      - series: 'secsy_certificates_total{job="secsy-ca", operation="issue", result="success"}'
        values: '0+90x440'
      - series: 'secsy_certificates_total{job="secsy-ca", operation="issue", result="error"}'
        values: '0+10x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKIIssuanceErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              service: secsy-pki
              slo: issuance-availability
              job: secsy-ca
            exp_annotations:
              summary: "Issuance error-budget burning fast (secsy-ca)"
              description: "Certificate issuance is burning the 99.5% availability SLO error budget at >14.4x over the 1h and 5m windows (recording rule job:slo_issuance_errors:ratio_rate1h). A 30-day budget is gone in ~2 days at this rate. Investigate HSM signing failures, CAA/lint rejections, or store errors."
              runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/main/docs/operations/runbook.md#slo-error-budget-burn"
      - eval_time: 420m
        alertname: SecsyPKIIssuanceErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              service: secsy-pki
              slo: issuance-availability
              job: secsy-ca
            exp_annotations:
              summary: "Issuance error-budget burning (secsy-ca)"
              description: "Certificate issuance is burning the 99.5% availability SLO error budget at >6x over the 6h and 30m windows (recording rule job:slo_issuance_errors:ratio_rate6h). Open a ticket and investigate before the fast burn pages."
              runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/main/docs/operations/runbook.md#slo-error-budget-burn"

  # 2. Issuance at a 4% error rate (burn ~8x): over the slow threshold (6x) but
  #    under the fast one (14.4x) — only the slow ticket fires, the fast stays quiet.
  - interval: 1m
    input_series:
      - series: 'secsy_certificates_total{job="secsy-ca", operation="issue", result="success"}'
        values: '0+96x440'
      - series: 'secsy_certificates_total{job="secsy-ca", operation="issue", result="error"}'
        values: '0+4x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKIIssuanceErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 420m
        alertname: SecsyPKIIssuanceErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              service: secsy-pki
              slo: issuance-availability
              job: secsy-ca
            exp_annotations:
              summary: "Issuance error-budget burning (secsy-ca)"
              description: "Certificate issuance is burning the 99.5% availability SLO error budget at >6x over the 6h and 30m windows (recording rule job:slo_issuance_errors:ratio_rate6h). Open a ticket and investigate before the fast burn pages."
              runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/main/docs/operations/runbook.md#slo-error-budget-burn"

  # 3. Issuance at a 0.1% error rate (burn 0.2x, well inside budget): nothing fires.
  - interval: 1m
    input_series:
      - series: 'secsy_certificates_total{job="secsy-ca", operation="issue", result="success"}'
        values: '0+999x440'
      - series: 'secsy_certificates_total{job="secsy-ca", operation="issue", result="error"}'
        values: '0+1x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKIIssuanceErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 420m
        alertname: SecsyPKIIssuanceErrorBudgetBurnSlow
        exp_alerts: []

  # 4. OCSP at a 2% error rate (burn 20x on the 0.001 budget): fast burn fires.
  - interval: 1m
    input_series:
      - series: 'secsy_ocsp_requests_total{job="secsy-ca", result="success"}'
        values: '0+98x440'
      - series: 'secsy_ocsp_requests_total{job="secsy-ca", result="error"}'
        values: '0+2x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKIOCSPErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              service: secsy-pki
              slo: ocsp-availability
              job: secsy-ca
            exp_annotations:
              summary: "OCSP error-budget burning fast (secsy-ca)"
              description: "The OCSP responder is burning the 99.9% availability SLO error budget at >14.4x over the 1h and 5m windows (recording rule job:slo_ocsp_errors:ratio_rate1h). Relying parties may fail validation. Check HSM signing and the responder path."
              runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/main/docs/operations/runbook.md#slo-error-budget-burn"

  # 5. CRL at a 2% error rate (burn 20x on the 0.001 budget): fast burn fires.
  - interval: 1m
    input_series:
      - series: 'secsy_crl_requests_total{job="secsy-ca", result="success"}'
        values: '0+98x440'
      - series: 'secsy_crl_requests_total{job="secsy-ca", result="error"}'
        values: '0+2x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKICRLErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              service: secsy-pki
              slo: crl-availability
              job: secsy-ca
            exp_annotations:
              summary: "CRL error-budget burning fast (secsy-ca)"
              description: "CRL distribution is burning the 99.9% availability SLO error budget at >14.4x over the 1h and 5m windows (recording rule job:slo_crl_errors:ratio_rate1h). Clients may fall back to a stale cached CRL. Check signing and the store."
              runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/main/docs/operations/runbook.md#slo-error-budget-burn"

  # 6. ACME order-finalize latency: 20% of finalizes slower than 2.5s (burn 20x
  #    on the 0.01 budget). The le="2.5" bucket must be present for the
  #    (total - fast) numerator to resolve. Fast latency burn fires.
  - interval: 1m
    input_series:
      - series: 'secsy_http_request_duration_seconds_count{job="secsy-ca", method="POST", route="POST /acme/order/{id}/finalize"}'
        values: '0+100x440'
      - series: 'secsy_http_request_duration_seconds_bucket{job="secsy-ca", method="POST", route="POST /acme/order/{id}/finalize", le="2.5"}'
        values: '0+80x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKIACMEFinalizeLatencyBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              service: secsy-pki
              slo: acme-finalize-latency
              job: secsy-ca
            exp_annotations:
              summary: "ACME finalize latency budget burning fast (secsy-ca)"
              description: "More than 14.4x the latency budget for the 99%-within-2.5s ACME order-finalize SLO is burning over the 1h and 5m windows (recording rule job:slo_acme_finalize_latency:ratio_rate1h). Finalize is the client-visible issuance step. Check HSM sign latency, CT log submission, and session-pool saturation."
              runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/main/docs/operations/runbook.md#slo-error-budget-burn"

  # 7. ACME order-finalize latency all within budget (bucket == count, 0% slow):
  #    neither the fast nor the slow latency alert fires.
  - interval: 1m
    input_series:
      - series: 'secsy_http_request_duration_seconds_count{job="secsy-ca", method="POST", route="POST /acme/order/{id}/finalize"}'
        values: '0+100x440'
      - series: 'secsy_http_request_duration_seconds_bucket{job="secsy-ca", method="POST", route="POST /acme/order/{id}/finalize", le="2.5"}'
        values: '0+100x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKIACMEFinalizeLatencyBudgetBurnFast
        exp_alerts: []
      - eval_time: 420m
        alertname: SecsyPKIACMEFinalizeLatencyBudgetBurnSlow
        exp_alerts: []

  # 8. HSM signing latency: 20% of sign ops slower than 1s (burn 20x). Fast fires.
  - interval: 1m
    input_series:
      - series: 'secsy_hsm_operation_duration_seconds_count{job="secsy-ca", operation="sign"}'
        values: '0+100x440'
      - series: 'secsy_hsm_operation_duration_seconds_bucket{job="secsy-ca", operation="sign", le="1"}'
        values: '0+80x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKIHSMSignLatencyBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              service: secsy-pki
              slo: hsm-sign-latency
              job: secsy-ca
            exp_annotations:
              summary: "HSM sign latency budget burning fast (secsy-ca)"
              description: "More than 14.4x the latency budget for the 99%-within-1s HSM signing SLO is burning over the 1h and 5m windows (recording rule job:slo_hsm_sign_latency:ratio_rate1h). Every signing path (issuance, CRL, OCSP, TSA) slows down. Check HSM health, the network to a network-HSM, and session-pool sizing."
              runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/main/docs/operations/runbook.md#slo-error-budget-burn"

  # 9. HSM signing availability: 2% of sign ops error (burn 20x on the 0.001
  #    budget). Fast sign-error burn fires.
  - interval: 1m
    input_series:
      - series: 'secsy_hsm_operations_total{job="secsy-ca", operation="sign", result="success"}'
        values: '0+98x440'
      - series: 'secsy_hsm_operations_total{job="secsy-ca", operation="sign", result="error"}'
        values: '0+2x440'
    alert_rule_test:
      - eval_time: 420m
        alertname: SecsyPKIHSMSignErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              service: secsy-pki
              slo: hsm-sign-availability
              job: secsy-ca
            exp_annotations:
              summary: "HSM sign error-budget burning fast (secsy-ca)"
              description: "HSM sign operations are burning the 99.9% availability SLO error budget at >14.4x over the 1h and 5m windows (recording rule job:slo_hsm_sign_errors:ratio_rate1h). Signing is failing (HSM down, wrong PIN, or session exhaustion) — check /readyz and the key-provider logs."
              runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/main/docs/operations/runbook.md#slo-error-budget-burn"

  # 10. Recording-rule arithmetic (exact): a total issuance outage (every op
  #     errors) makes the error ratio exactly 1.0 over every window.
  - interval: 1m
    input_series:
      - series: 'secsy_certificates_total{job="secsy-ca", operation="issue", result="error"}'
        values: '0+10x440'
    promql_expr_test:
      - eval_time: 420m
        expr: job:slo_issuance_errors:ratio_rate1h
        exp_samples:
          - labels: 'job:slo_issuance_errors:ratio_rate1h{job="secsy-ca"}'
            value: 1
      - eval_time: 420m
        expr: job:slo_issuance_errors:ratio_rate6h
        exp_samples:
          - labels: 'job:slo_issuance_errors:ratio_rate6h{job="secsy-ca"}'
            value: 1

  # 11. Recording-rule arithmetic (exact) for the latency SLI: when every sign
  #     op is slower than 1s (the le="1" bucket stays flat at 0), the bad-latency
  #     ratio is exactly 1.0.
  - interval: 1m
    input_series:
      - series: 'secsy_hsm_operation_duration_seconds_count{job="secsy-ca", operation="sign"}'
        values: '0+100x440'
      - series: 'secsy_hsm_operation_duration_seconds_bucket{job="secsy-ca", operation="sign", le="1"}'
        values: '0+0x440'
    promql_expr_test:
      - eval_time: 420m
        expr: job:slo_hsm_sign_latency:ratio_rate1h
        exp_samples:
          - labels: 'job:slo_hsm_sign_latency:ratio_rate1h{job="secsy-ca"}'
            value: 1
