groups:
  # --- Scrape / availability -------------------------------------------------
  - name: secsy-pki.availability
    rules:
      - alert: SecsyPKITargetDown
        # The Prometheus scrape target is unreachable. This is the umbrella
        # signal — most other alerts go stale when the target is down, so page
        # on this rather than on the derived ones.
        expr: up{job=~".*secsy.*"} == 0
        for: 3m
        labels:
          severity: critical
          service: secsy-pki
        annotations:
          summary: "secsy-pki target down ({{ $labels.instance }})"
          description: "Prometheus has failed to scrape {{ $labels.job }}/{{ $labels.instance }} for >3m. Check the pod/readiness probe."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#observability-alert-response"

  # --- HSM / key provider ----------------------------------------------------
  - name: secsy-pki.hsm
    rules:
      - alert: SecsyPKIHSMProbeDown
        # The readiness probe cannot reach the HSM/key provider. All signing is
        # blocked; the server will fail /readyz and be pulled from the Service.
        expr: min by (job, instance) (secsy_component_up{component="hsm"}) == 0
        for: 2m
        labels:
          severity: critical
          service: secsy-pki
        annotations:
          summary: "HSM/key-provider probe down ({{ $labels.instance }})"
          description: "secsy_component_up{component=hsm}=0 for >2m. The HSM/PKCS#11 token is unreachable — no certificates, CRLs, OCSP, or TSA tokens can be signed."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#hsm-probe-down"

      - alert: SecsyPKIHSMPoolExhausted
        # Requests are waiting for an HSM concurrency-guard slot: the session
        # pool is the bottleneck. Sustained queueing precedes 503 shedding.
        expr: sum by (job, instance) (secsy_hsm_guard_queue_depth) > 0
        for: 10m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "HSM session pool saturated ({{ $labels.instance }})"
          description: "Requests have been queued for an HSM slot for >10m (queue_depth>0). Raise rateLimit.hsmConcurrency / session-pool size, or investigate slow signing. See docs/rate-limiting.md and docs/benchmarks.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#hsm-pool-exhaustion"

      - alert: SecsyPKIHSMGuardShedding
        # The guard is actively rejecting HSM-bound requests (HTTP 503). This is
        # load-shedding — clients are being turned away before the pool.
        expr: sum by (job, instance) (rate(secsy_hsm_guard_rejected_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          service: secsy-pki
        annotations:
          summary: "HSM guard shedding load ({{ $labels.instance }})"
          description: "The HSM concurrency guard is rejecting >0.1 req/s (503) over 5m. The pool is saturated and clients are being shed. Scale replicas or the pool; check for a stalled HSM."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#hsm-pool-exhaustion"

      - alert: SecsyPKIHSMSignLatencyHigh
        # p99 HSM sign latency is elevated — throughput ceiling and a leading
        # indicator of pool saturation.
        expr: histogram_quantile(0.99, sum by (le, job) (rate(secsy_hsm_operation_duration_seconds_bucket{operation="sign"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "HSM sign latency p99 high ({{ $labels.job }})"
          description: "p99 HSM sign latency has exceeded 2s for >10m. Expect issuance/CRL/OCSP slowdowns. Check HSM health, network to a network-HSM, and session-pool sizing."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#hsm-pool-exhaustion"

      - alert: SecsyPKIHSMTokenDown
        # A token in a multi-token HA set is unhealthy and has been failed over
        # away from. Signing continues on the remaining replicas, but redundancy
        # is reduced — page-worthy only if it persists.
        expr: max by (job, token) (secsy_hsm_token_up) == 0
        for: 5m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "HSM token {{ $labels.token }} down ({{ $labels.job }})"
          description: "secsy_hsm_token_up{token={{ $labels.token }}}=0 for >5m. This HSM token has been taken out of rotation; the set is running on fewer replicas. Check the device/partition and see docs/hsm-ha.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#hsm-probe-down"

      - alert: SecsyPKIHSMTokenFlapping
        # A token is repeatedly failing over — a flaky device/network to a network
        # HSM. Sustained failover activity means requests keep hitting a bad token.
        expr: sum by (job, token) (rate(secsy_hsm_token_failovers_total[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "HSM token {{ $labels.token }} flapping ({{ $labels.job }})"
          description: "Token {{ $labels.token }} has been failing over at >0.1/s for >15m. The device or its network path is unstable. Investigate the HSM; consider raising pkcs11.failure_threshold. See docs/hsm-ha.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#hsm-probe-down"

  # --- Error-budget SLOs -----------------------------------------------------
  # The Google-SRE-style multi-window multi-burn-rate alerts and their SLI
  # recording rules (issuance/OCSP/CRL availability, ACME-finalize + HSM-sign
  # latency, HSM-sign availability) live in the companion single-source file
  # files/prometheus-slo-rules.yaml so the error-budget concern stays separable
  # from these operational/threshold alerts. See docs/observability.md#slos-and-error-budgets.

  # --- Certificate expiry / renewal ------------------------------------------
  - name: secsy-pki.expiry
    rules:
      - alert: SecsyPKICertificatesExpired
        # Monitored certificates have already passed their notAfter and were not
        # renewed. Any nonzero value is an outage waiting to happen.
        expr: max by (job) (secsy_certificates_expiring{severity="expired"}) > 0
        for: 15m
        labels:
          severity: critical
          service: secsy-pki
        annotations:
          summary: "Expired certificates present ({{ $labels.job }})"
          description: "{{ $value }} monitored certificate(s) are expired as of the last scan. Auto-renewal did not keep up — check the monitor and renewal profiles."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#certificate-expiry-backlog"

      - alert: SecsyPKIExpiryBacklog
        # A growing count of certificates in the critical window signals the
        # renewal pipeline is falling behind.
        expr: max by (job) (secsy_certificates_expiring{severity="critical"}) > 25
        for: 1h
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Certificate expiry backlog ({{ $labels.job }})"
          description: "{{ $value }} certificate(s) are in the critical expiry window (default <7d). Verify auto-renewal is enabled and succeeding, or renew manually. Tune the threshold to your fleet size."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#certificate-expiry-backlog"

      - alert: SecsyPKIMonitorStalled
        # The expiry monitor has not completed a scan in far longer than its
        # interval, so expiry gauges are stale and auto-renew is not running.
        expr: (time() - max by (job) (secsy_certificate_monitor_last_scan_timestamp_seconds)) > 129600
        for: 15m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Expiry monitor stalled ({{ $labels.job }})"
          description: "No completed monitor scan in >36h (2.5x the 12h default interval). Expiry metrics and auto-renewal are not updating. Adjust the threshold if monitor.intervalHours differs."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#monitor-and-audit-health"

      - alert: SecsyPKIAutoRenewFailing
        # Auto-renewal attempts are erroring — the safety net is broken even if
        # nothing has expired yet.
        expr: sum by (job) (rate(secsy_certificate_auto_renewals_total{result="error"}[30m])) > 0
        for: 30m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Auto-renewal failing ({{ $labels.job }})"
          description: "The expiry monitor's auto-renewal has been erroring for >30m. Certificates will expire if not renewed manually. Check signing, profiles, and RBAC."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#certificate-expiry-backlog"

  # --- Revocation (OCSP / CRL) -----------------------------------------------
  - name: secsy-pki.revocation
    rules:
      - alert: SecsyPKIOCSPErrorRateHigh
        # The OCSP responder is returning errors to relying parties.
        expr: |
          sum by (job) (rate(secsy_ocsp_requests_total{result="error"}[5m]))
            / clamp_min(sum by (job) (rate(secsy_ocsp_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "OCSP error rate high ({{ $labels.job }})"
          description: ">5% of OCSP responses are errors over 10m. Relying parties may fail validation. Check HSM signing and the responder. See RUNBOOK 'OCSP / CRL outage'."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#ocsp--crl-outage"

      - alert: SecsyPKICRLServingErrors
        # CRL distribution is erroring, so clients cannot fetch fresh revocation.
        expr: sum by (job) (rate(secsy_crl_requests_total{result="error"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "CRL serving errors ({{ $labels.job }})"
          description: "The CRL endpoint has been returning errors for >10m. Clients may fall back to a stale/cached CRL. Check signing and the store. See RUNBOOK 'OCSP / CRL outage'."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#ocsp--crl-outage"

      - alert: SecsyPKICRLNotRegenerating
        # Best-effort CRL/delta staleness: no fresh CRL has been signed on the
        # HSM within a full base-CRL lifetime while CRLs are actively served.
        # A base CRL is re-signed each interval; a long gap means regeneration
        # has stalled and served CRLs are approaching nextUpdate. For an
        # authoritative freshness check, additionally blackbox-probe the CDP and
        # alert on the CRL's nextUpdate (see RUNBOOK).
        expr: |
          (sum by (job) (increase(secsy_crl_generated_total{kind="base"}[25h])) == 0)
          and
          (sum by (job) (rate(secsy_crl_requests_total[1h])) > 0)
        for: 30m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "CRL not regenerating ({{ $labels.job }})"
          description: "No base CRL has been signed on the HSM in >25h while CRLs are still being requested. Served CRLs may go stale past nextUpdate. Tune the window to your crl.baseValidityHours; verify HSM signing and the CRL scheduler."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#crldelta-staleness"

      - alert: SecsyPKIOCSPPresignStale
        # The pre-signed OCSP response set is aging with no fresh batch behind
        # it. Once responses pass their NextUpdate (presign.validity_minutes,
        # default 24h) the responder falls back to on-HSM signing — or, during
        # an HSM outage, to tryLater. The 12h threshold assumes the default
        # 24h validity; tune to ~validity/2. Fires only where pre-signing has
        # run at least once (the gauge is absent otherwise).
        expr: max by (job) (secsy_ocsp_presign_staleness_seconds) > 43200
        for: 15m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "OCSP pre-signing stale ({{ $labels.job }})"
          description: "The last successful OCSP pre-signing batch was {{ $value | humanizeDuration }} ago (>12h). Pre-signed responses are aging toward their NextUpdate; check HSM availability and the presign loop logs. See docs/ocsp-presign-publish.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#ocsp--crl-outage"

      - alert: SecsyPKIPublishStale
        # The static artifact snapshot (CDN origin) has not been republished.
        # A CDN keeps serving the old snapshot, whose OCSP responses expire at
        # presign.validity — republish must land well before that.
        expr: max by (job) (secsy_publish_staleness_seconds) > 43200
        for: 15m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Static artifact publishing stale ({{ $labels.job }})"
          description: "The last successful artifact publish was {{ $value | humanizeDuration }} ago (>12h). CDN-served revocation data is aging toward expiry (see manifest.json earliest_expiry). Check the publish loop and backend (dir/S3) reachability. See docs/ocsp-presign-publish.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#ocsp--crl-outage"

  # --- Rate limiting ---------------------------------------------------------
  - name: secsy-pki.ratelimit
    rules:
      - alert: SecsyPKIRateLimitThrottleSpike
        # A large fraction of public-endpoint traffic is being rejected (429):
        # either an abuse event or an over-tight limit blocking legitimate load.
        expr: |
          sum by (job) (rate(secsy_ratelimit_throttled_total[5m]))
            / clamp_min(
                sum by (job) (rate(secsy_ratelimit_throttled_total[5m]))
                + sum by (job) (rate(secsy_ratelimit_admitted_total[5m])),
                1e-9) > 0.3
        for: 10m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Rate-limit rejections spiking ({{ $labels.job }})"
          description: ">30% of public-endpoint requests have been throttled (429) over 10m. Investigate a possible abuse source, or relax the tier in rate_limit config. See docs/rate-limiting.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#rate-limit-guard-rejections-spiking"

  # --- Audit-log SIEM export health ------------------------------------------
  - name: secsy-pki.audit
    rules:
      - alert: SecsyPKIAuditExportLagHigh
        # Sealed audit events are piling up undelivered — a sink is down or
        # backpressured, risking a compliance gap.
        expr: max by (job, sink) (secsy_audit_export_lag_events) > 5000
        for: 15m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Audit export lagging (sink {{ $labels.sink }})"
          description: "{{ $value }} audit events are undelivered to SIEM sink '{{ $labels.sink }}' for >15m. Check the sink's reachability. See docs/audit-siem-export.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#monitor-and-audit-health"

      - alert: SecsyPKIAuditExportStalled
        # The sink has a backlog but has not acknowledged a batch in a while:
        # delivery is stuck (distinct from merely lagging behind a burst).
        expr: |
          (time() - max by (job, sink) (secsy_audit_export_last_success_timestamp_seconds) > 1800)
          and (max by (job, sink) (secsy_audit_export_lag_events) > 0)
        for: 10m
        labels:
          severity: critical
          service: secsy-pki
        annotations:
          summary: "Audit export stalled (sink {{ $labels.sink }})"
          description: "SIEM sink '{{ $labels.sink }}' has a backlog but has not acknowledged a batch in >30m. Delivery is stuck — audit events are not reaching the SIEM. See docs/audit-siem-export.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#monitor-and-audit-health"

      - alert: SecsyPKIAuditAnchorStale
        # The audit chain has unattested events but has not been re-anchored in
        # >2x the default daily cadence: the anchor job is dead or its TSA is
        # unreachable, and the window an undetected truncation could cover is
        # growing. Pending > 1 excludes the idle steady state (the last anchor's
        # own audit record), so a quiet deployment never pages.
        expr: |
          (max by (job, instance) (secsy_audit_anchor_age_seconds) > 172800)
          and (max by (job, instance) (secsy_audit_anchor_pending_events) > 1)
        for: 30m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Audit-chain anchor stale ({{ $labels.instance }})"
          description: "The newest audit-chain anchor is older than 48h while unanchored events exist. The anchor job is not running or its TSA is failing; events since the last anchor lack external truncation evidence. Run 'secsy-ca audit anchor' and check the TSA."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#audit-chain-anchoring"

      - alert: SecsyPKIAuditAnchorFailures
        # Anchoring attempts are erroring (TSA down/rejecting, or the anchor
        # insert failing). One-off blips retry on the next tick; repeated
        # failures warrant a look before the staleness alert fires.
        expr: sum by (job, instance) (increase(secsy_audit_anchors_total{result="error"}[6h])) > 1
        for: 30m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Audit-chain anchoring failing ({{ $labels.instance }})"
          description: "More than one audit-anchor attempt failed in the last 6h. Check the TSA (internal /tsa health, or the external audit.anchor.tsa_url) and the audit.anchor error events in the log."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#audit-chain-anchoring"

  # --- Multi-replica coordination -------------------------------------------
  - name: secsy-pki.coordination
    rules:
      - alert: SecsyPKINoJobLeader
        # No replica holds the background-job leadership: the singleton jobs
        # (expiry monitor/auto-renewal, CA rotation, OCSP pre-signing, CRL
        # publishing, audit anchoring, SIEM export) are all paused. This
        # usually means every replica is failing to reach PostgreSQL for the
        # advisory-lock election, or a dead leader's session has not yet been
        # reaped. API traffic is unaffected, so this fires before the derived
        # staleness alerts (presign/publish/anchor/export) start to.
        expr: max by (job) (secsy_leader_is_leader) == 0
        for: 10m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "No background-job leader elected ({{ $labels.job }})"
          description: "secsy_leader_is_leader is 0 on every replica for >10m: no instance is running the singleton background jobs. Check replica connectivity to PostgreSQL, and pg_locks for an orphaned advisory-lock session."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#observability-alert-response"

      - alert: SecsyPKILeadershipFlapping
        # Leadership keeps changing hands: a leader that repeatedly fails lease
        # renewal (struggling database, saturated pool, flaky network) forces
        # constant job restarts. Handovers are idempotent, so this degrades job
        # cadence rather than correctness — but the election store is unhealthy.
        expr: sum by (job) (increase(secsy_leader_transitions_total[30m])) > 6
        for: 15m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Background-job leadership flapping ({{ $labels.job }})"
          description: "More than 6 leadership transitions across the fleet in 30m. The leader cannot hold its advisory-lock lease — check PostgreSQL health/latency and the 'leader:' lines in the server logs."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#observability-alert-response"

  - name: secsy-pki.canary
    rules:
      - alert: SecsyPKICanaryFailing
        # The synthetic issuance canary (Task 71) walks a real certificate
        # through the full lifecycle per probed CA: HSM-signed issuance from
        # the lint-enforced canary profile, chain verification, an OCSP "good"
        # answer, CRL freshness, revocation, and "revoked" propagation. A
        # failing probe means real issuance or revocation is broken (or about
        # to be) for that CA — treat it as an issuance-path outage, not a
        # monitoring hiccup. The stage label pinpoints where it broke.
        expr: sum by (job, ca, stage) (increase(secsy_canary_failures_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
          service: secsy-pki
        annotations:
          summary: "Issuance canary failing on {{ $labels.ca }} at {{ $labels.stage }} ({{ $labels.job }})"
          description: "Synthetic issuance probes against CA {{ $labels.ca }} keep failing at the {{ $labels.stage }} stage. Real clients hit the same path. Run `secsy-ca doctor` (canary.last_probe surfaces the last outcome), inspect the canary.probe audit events, and check HSM, OCSP, and CRL health for the failing stage."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#observability-alert-response"

      - alert: SecsyPKICanaryStalled
        # The canary has succeeded before (the gauge exists) but no probe has
        # completed successfully in over an hour — 4x the default 15-minute
        # interval. Either every probe is failing (SecsyPKICanaryFailing will
        # also fire), the canary job is not running anywhere (no leader — see
        # SecsyPKINoJobLeader), or canary.interval_minutes was raised without
        # adjusting this threshold.
        expr: (time() - max by (job, ca) (secsy_canary_last_success_timestamp_seconds)) > 3600
        for: 15m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Issuance canary stalled for {{ $labels.ca }} ({{ $labels.job }})"
          description: "No fully successful canary probe for CA {{ $labels.ca }} in >1h (4x the 15m default interval). The issuance path has stopped being continuously proven healthy. Check the canary job (leader election, server logs) and `secsy-ca doctor`; adjust the threshold if canary.interval_minutes differs."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#observability-alert-response"

  # --- Backup & restore-verification -----------------------------------------
  - name: secsy-pki.backup
    rules:
      - alert: SecsyPKIBackupStale
        # The scheduled encrypted backup (Task 89) has not succeeded in over 2
        # days — 2x the default 24h interval. Either every run is failing or the
        # backup job is not running anywhere (no leader — see SecsyPKINoJobLeader).
        # Fires only where a backup has succeeded before (the gauge is absent
        # otherwise); tune the threshold if backup.schedule.interval_hours differs.
        expr: max by (job) (secsy_backup_staleness_seconds) > 172800
        for: 30m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Scheduled backup stale ({{ $labels.job }})"
          description: "The last successful scheduled backup was {{ $value | humanizeDuration }} ago (>2d). The off-box DR copy is aging; check the backup job (leader election, destination reachability) and `secsy-ca doctor` (backup.freshness). See docs/backup.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#observability-alert-response"

      - alert: SecsyPKIBackupRestoreVerificationFailing
        # A restore-verification drill (Task 94) failed: the newest published
        # backup could not be decrypted, restored, integrity-checked, or its
        # audit-head fingerprint did not match the manifest. An untested backup is
        # not a backup — this means disaster recovery would silently fail. The 26h
        # window spans one default (24h) verify interval so a daily failure keeps
        # firing until the next drill succeeds.
        expr: sum by (job) (increase(secsy_backup_verify_total{result="error"}[26h])) > 0
        for: 10m
        labels:
          severity: critical
          service: secsy-pki
        annotations:
          summary: "Backup restore-verification failing ({{ $labels.job }})"
          description: "A backup restore-verification drill failed — the newest backup could not be proven restorable, so recovery would fail when it is needed. Run `secsy-ca backup verify-restore`, inspect the backup.verify audit events (they name the failing stage), and check the backup destination and KEK. See docs/backup.md."
          runbook_url: "https://github.com/blechschmidt/secsy-pki/blob/enterprise/docs/RUNBOOK.md#observability-alert-response"

      - alert: SecsyPKIBackupRestoreVerificationStale
        # Restore-verification has succeeded before (the gauge exists) but has not
        # proven a backup restorable in over 2 days (2x the default cadence). The
        # backups may be fine but are no longer continuously proven recoverable —
        # either the verify job is not running (no leader) or every drill errors
        # (SecsyPKIBackupRestoreVerificationFailing will also fire).
        expr: max by (job) (secsy_backup_restore_verified_staleness_seconds) > 172800
        for: 30m
        labels:
          severity: warning
          service: secsy-pki
        annotations:
          summary: "Backup restore-verification stalled ({{ $labels.job }})"
          description: "No backup has been proven restorable in {{ $value | humanizeDuration }} (>2d). Backups are no longer continuously verified. Check the backup-verify job (leader election, server logs) and `secsy-ca doctor` (backup.restore-verified); adjust the threshold if backup.verify.interval_hours differs. See docs/backup.md."
