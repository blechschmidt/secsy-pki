// secsy-pki gRPC API surface (Task 56).
//
// This service exposes the core PKI operations — issue, renew, revoke, and
// status/metadata lookups — alongside the existing REST API. It is a thin
// transport over the same ca.Manager / RBAC / audit / rate-limit / tracing
// plumbing that backs REST, so both protocols enforce identical authorization,
// tenant scoping, and audit semantics.
//
// Authentication mirrors REST: an `authorization` request-metadata header
// (Basic root credentials or a Bearer OIDC token) and/or a mutual-TLS client
// certificate bound to an operator principal. Errors map to canonical gRPC
// status codes (see the service comments). Request IDs and W3C trace context
// propagate through call metadata.
syntax = "proto3";

package secsy.pki.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/blechschmidt/secsy-pki/server/internal/grpcapi/pkiv1;pkiv1";

// PKIService is the certificate-lifecycle gRPC surface. Every RPC authorizes the
// caller against the acting CA's tenant using the same RBAC checks as REST and
// appends a tamper-evident audit event for state-changing operations.
service PKIService {
  // IssueCertificate signs a PKCS#10 CSR into an end-entity certificate under a
  // CA and profile using the CA's HSM-held key. Requires the issue capability on
  // the CA's tenant (or a per-CA SIGN_CERTIFICATE grant).
  //
  // Errors: PERMISSION_DENIED (no issue capability), INVALID_ARGUMENT (missing
  // or malformed CSR / bad profile), NOT_FOUND (unknown CA), INTERNAL (signing
  // failure).
  rpc IssueCertificate(IssueCertificateRequest) returns (CertificateResponse);

  // PreviewCertificate validates a would-be issuance through the full fail-closed
  // pre-issuance gate stack (certlint, CAA, name constraints, certificate policy,
  // S/MIME policy, validity caps, attestation posture, and the manual-approval
  // would-park signal) WITHOUT calling the HSM to sign, allocating a durable
  // serial, persisting anything, appending an audit event, or taking a rate-limit
  // slot. It returns the resolved leaf extensions plus each gate's verdict so an
  // operator or CI can validate a request before a real, HSM-consuming issuance.
  // Requires the same issue capability as IssueCertificate.
  rpc PreviewCertificate(PreviewCertificateRequest) returns (PreviewCertificateResponse);

  // ValidateChain builds and validates a supplied leaf certificate (and optional
  // intermediates) against a CA's configured trust anchors and returns a
  // structured verdict: whether a path was built (with the resolved chain), the
  // validity window, per-certificate live revocation status (CRL + OCSP store,
  // including the reversible on-hold state), name-constraint and certificate-
  // policy conformance, weak-key/weak-signature flags, and an overall pass/fail
  // with human-readable reasons. It is a pure read: no HSM is touched, nothing is
  // signed, no serial is allocated, and no audit event is recorded. Requires the
  // same tenant-scoped read standing as GetCertificate on the CA.
  //
  // Errors: PERMISSION_DENIED (no read role), NOT_FOUND (unknown CA / not a
  // tenant member), INVALID_ARGUMENT (missing or malformed certificate input).
  rpc ValidateChain(ValidateChainRequest) returns (ValidateChainResponse);

  // RenewCertificate reissues a previously issued certificate with a fresh
  // serial and validity window, optionally rekeying from a supplied CSR.
  rpc RenewCertificate(RenewCertificateRequest) returns (CertificateResponse);

  // RevokeCertificate records a revocation for a serial and invalidates any
  // cached OCSP "good" response so the new status is served immediately.
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse);

  // SuspendCertificate places a certificate on hold (RFC 5280 certificateHold) —
  // a reversible revocation. While held the serial is reported revoked by OCSP
  // and listed on the base CRL. Requires the same issue capability as revocation.
  //
  // Errors: PERMISSION_DENIED, INVALID_ARGUMENT (bad serial / already permanently
  // revoked), NOT_FOUND (unknown CA).
  rpc SuspendCertificate(SuspendCertificateRequest) returns (SuspendCertificateResponse);

  // ReleaseCertificate removes a certificate hold, returning the certificate to
  // service: OCSP reports it good, the next base CRL omits it, and the next delta
  // CRL carries removeFromCRL. It succeeds only for a certificate on hold; a
  // permanent revocation cannot be released.
  //
  // Errors: PERMISSION_DENIED, FAILED_PRECONDITION (not on hold / not revoked),
  // NOT_FOUND (unknown CA).
  rpc ReleaseCertificate(ReleaseCertificateRequest) returns (ReleaseCertificateResponse);

  // GetCertificate returns the authority's stored copy of a certificate it
  // issued, including its current status. Requires read standing in the CA's
  // tenant.
  rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse);

  // GetCertificateStatus returns only the lightweight status (valid / expired /
  // revoked / unknown) for a serial.
  rpc GetCertificateStatus(GetCertificateStatusRequest) returns (GetCertificateStatusResponse);

  // ListCertificates lists the certificates a CA has issued.
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse);

  // GetCRLMetadata returns distribution metadata for a CA's CRL (number, this/
  // next update, and the public base/delta URLs). It regenerates the CRL on the
  // HSM only when the published copy is stale.
  rpc GetCRLMetadata(GetCRLMetadataRequest) returns (GetCRLMetadataResponse);

  // GetOCSPMetadata returns the OCSP responder endpoint(s) for a CA plus the
  // responder-hardening options in effect (nonce echoing, delegated signer).
  rpc GetOCSPMetadata(GetOCSPMetadataRequest) returns (GetOCSPMetadataResponse);
}

// CertificateStatus is the coarse lifecycle state of an issued certificate.
enum CertificateStatus {
  CERTIFICATE_STATUS_UNSPECIFIED = 0;
  CERTIFICATE_STATUS_VALID = 1;
  CERTIFICATE_STATUS_EXPIRED = 2;
  CERTIFICATE_STATUS_REVOKED = 3;
  // The authority has no record of this serial under the named CA.
  CERTIFICATE_STATUS_UNKNOWN = 4;
}

// CTLogOutcome reports the per-log result of a Certificate Transparency
// submission for an issuance.
message CTLogOutcome {
  string log = 1;
  bool ok = 2;
  string error = 3;
}

// CTInfo summarizes Certificate Transparency handling for an issuance. Present
// only when the profile requested CT.
message CTInfo {
  bool enabled = 1;
  bool embedded = 2;
  int32 sct_count = 3;
  string status = 4;
  repeated CTLogOutcome logs = 5;
}

// PSD2QCStatement is the ETSI TS 119 495 PSD2 authorization carried in the eIDAS
// QCStatements extension (id-pe-qcStatements, ETSI EN 319 412-5): the payment
// service provider's roles and its National Competent Authority (NCA). It is
// honored only under a QC-enabled profile that permits per-request PSD2 overrides
// (qcstatements.allow_psd2_override).
message PSD2QCStatement {
  // roles are the PSP roles: PSP_AS, PSP_PI, PSP_AI, PSP_IC.
  repeated string roles = 1;
  // nca_name is the competent authority's human-readable name.
  string nca_name = 2;
  // nca_id is the NCA identifier (e.g. GB-FCA).
  string nca_id = 3;
}

message IssueCertificateRequest {
  // ca_id identifies the issuing CA. It must be an X.509 issuer.
  string ca_id = 1;
  // csr_pem is a PEM-encoded PKCS#10 certificate signing request.
  string csr_pem = 2;
  // profile is the certificate profile name; empty selects the default profile.
  string profile = 3;
  // validity_days overrides the profile default. Non-positive uses the default;
  // it is always clamped to the profile maximum, the CA expiry, and any global
  // policy cap.
  int32 validity_days = 4;
  // must_staple optionally overrides the profile's RFC 7633 OCSP Must-Staple
  // default for this certificate (true stamps id-pe-tlsfeature: status_request;
  // false suppresses it). Honored only when the profile permits per-request
  // overrides (allow_must_staple_override); omitted uses the profile default.
  optional bool must_staple = 5;
  // upns are Microsoft/Kerberos User Principal Names ("user@REALM") to emit as
  // id-ms-UPN otherName SANs for smartcard-logon / PKINIT (Task 122). They are
  // honored only under a UPN-enabled profile (smartcard-logon / pkinit-client / a
  // custom UPN profile) and are validated and realm-allowlist-checked before signing.
  repeated string upns = 6;
  // psd2 optionally supplies the ETSI TS 119 495 PSD2 authorization for the eIDAS
  // QCStatements extension (Task 128). Honored only under a QC-enabled profile
  // that permits per-request PSD2 overrides.
  PSD2QCStatement psd2 = 7;
}

message RenewCertificateRequest {
  string ca_id = 1;
  // serial is the decimal serial of the certificate to renew.
  string serial = 2;
  // csr_pem optionally rekeys the certificate; empty reuses the original key.
  string csr_pem = 3;
  int32 validity_days = 4;
}

// CertificateResponse is a freshly issued or renewed end-entity certificate.
message CertificateResponse {
  string certificate_pem = 1;
  string chain_pem = 2;
  string serial = 3;
  string profile = 4;
  google.protobuf.Timestamp not_before = 5;
  google.protobuf.Timestamp not_after = 6;
  CTInfo ct = 7;
}

// PreviewCertificateRequest validates a would-be issuance without signing.
// Supply either csr_pem (its subject/public key/SANs are previewed exactly as
// issuance would take them) or the explicit-identity fields (a throwaway subject
// key is synthesized only to resolve the extension layout).
message PreviewCertificateRequest {
  string ca_id = 1;
  // csr_pem is a PEM PKCS#10 CSR (optional).
  string csr_pem = 2;
  // profile is the certificate profile name; empty selects the default profile.
  string profile = 3;
  // validity_days is the requested validity (non-positive uses the profile
  // default). The validity gate reports a request exceeding the profile maximum.
  int32 validity_days = 4;
  // must_staple optionally overrides the profile's RFC 7633 default, honored only
  // where the profile permits per-request overrides.
  optional bool must_staple = 5;
  // The explicit-identity fields are used only when csr_pem is empty.
  string common_name = 6;
  repeated string dns_names = 7;
  repeated string ip_addresses = 8;
  repeated string email_addresses = 9;
  repeated string uris = 10;
  // upns are Microsoft/Kerberos User Principal Name otherName SANs (Task 122),
  // previewed through the same UPN gate the issuance path enforces. When csr_pem
  // is supplied, any UPN in its SAN is previewed in addition to these.
  repeated string upns = 11;
  // psd2 optionally supplies the ETSI TS 119 495 PSD2 authorization for the eIDAS
  // QCStatements extension (Task 128), previewed through the same QC resolution
  // the issuance path enforces.
  PSD2QCStatement psd2 = 12;
}

// PreviewGate is one pre-issuance gate's verdict in a preview.
message PreviewGate {
  // name is the gate identifier (smime, certificate_policy, must_staple, lint,
  // caa, name_constraints, validity, approval, attestation).
  string name = 1;
  // status is "pass", "fail", "warn", or "skipped".
  string status = 2;
  // reason is a human-readable explanation of the disposition.
  string reason = 3;
  // findings carries per-check detail (individual lint codes, name-constraint
  // violations, …) when the gate produced several.
  repeated string findings = 4;
}

// PreviewExtension describes one resolved leaf extension the certificate would
// carry, read back from a faithful throwaway-signed synthesis of the leaf.
message PreviewExtension {
  string oid = 1;
  string name = 2;
  bool critical = 3;
}

// PreviewCertificateResponse is the outcome of a non-mutating issuance preview.
message PreviewCertificateResponse {
  string ca_id = 1;
  string ca_label = 2;
  string profile = 3;
  // decision is "accept", "park" (held for four-eyes approval), or "reject".
  string decision = 4;
  // would_issue is true when no gate would reject the request.
  bool would_issue = 5;
  // would_park is true when a real operator/API issuance would be held for
  // manual approval instead of issued immediately.
  bool would_park = 6;
  bool requires_approval = 7;
  string subject = 8;
  repeated string sans = 9;
  repeated string key_usages = 10;
  repeated string ext_key_usages = 11;
  google.protobuf.Timestamp not_before = 12;
  google.protobuf.Timestamp not_after = 13;
  int32 validity_days = 14;
  int32 requested_validity_days = 15;
  int32 max_validity_days = 16;
  string subject_key_id = 17;
  string authority_key_id = 18;
  // subject_key_provided reports whether a real subject key was supplied (via a
  // CSR). When false the subject_key_id is derived from a throwaway key and is
  // indicative rather than the value a real certificate would carry.
  bool subject_key_provided = 19;
  bool must_staple = 20;
  repeated PreviewExtension extensions = 21;
  repeated PreviewGate gates = 22;
}

// ValidateChainRequest asks the authority to validate a supplied certificate
// path against a CA's configured trust anchors. Nothing is signed.
message ValidateChainRequest {
  // ca_id is the CA whose configured trust anchors the path is validated against.
  string ca_id = 1;
  // leaf_pem is the leaf certificate to validate, PEM-encoded. A PEM bundle whose
  // first certificate is the leaf and remainder are intermediates is accepted.
  string leaf_pem = 2;
  // intermediates_pem are additional intermediate CA certificates (PEM), each a
  // single certificate or a bundle, used to bridge the path.
  repeated string intermediates_pem = 3;
  // skip_revocation disables the live per-certificate revocation lookups.
  bool skip_revocation = 4;
}

// ValidationRevocation is one certificate's live revocation status.
message ValidationRevocation {
  // state is "good", "revoked", "held" (reversible certificateHold), or "unknown".
  string state = 1;
  google.protobuf.Timestamp revoked_at = 2;
  int32 reason = 3;
  string reason_text = 4;
  string source = 5;
}

// ValidatedCertificate is the analyzed view of one certificate in the path.
message ValidatedCertificate {
  int32 position = 1; // 0 = leaf; increases toward the anchor
  string subject = 2;
  string issuer = 3;
  string serial_number = 4;
  google.protobuf.Timestamp not_before = 5;
  google.protobuf.Timestamp not_after = 6;
  bool is_ca = 7;
  bool is_trust_anchor = 8;
  bool self_signed = 9;
  string key_algorithm = 10;
  int32 key_size = 11;
  string signature_algorithm = 12;
  string fingerprint = 13;
  string subject_key_id = 14;
  string authority_key_id = 15;
  repeated string key_usage = 16;
  repeated string ext_key_usage = 17;
  repeated string policies = 18;
  bool expired = 19;
  bool not_yet_valid = 20;
  bool weak_key = 21;
  bool weak_signature = 22;
  repeated string weak_key_reasons = 23;
  ValidationRevocation revocation = 24;
}

// ValidationCheck is one validation dimension's verdict.
message ValidationCheck {
  // name is the dimension (chain, validity, revocation, name_constraints,
  // certificate_policy, key_usage, weak_key, weak_signature).
  string name = 1;
  // status is "pass", "fail", "warn", or "skipped".
  string status = 2;
  string detail = 3;
  repeated string findings = 4;
}

// ValidateChainResponse is the structured chain-validation verdict.
message ValidateChainResponse {
  string ca_id = 1;
  string ca_label = 2;
  string trust_anchor = 3;
  // chain_built reports whether a path to a configured trust anchor was found.
  bool chain_built = 4;
  // valid is the overall verdict: true only when no dimension failed.
  bool valid = 5;
  // decision is "valid" or "invalid".
  string decision = 6;
  google.protobuf.Timestamp evaluated_at = 7;
  google.protobuf.Timestamp valid_from = 8;
  google.protobuf.Timestamp valid_until = 9;
  repeated ValidatedCertificate chain = 10;
  repeated ValidationCheck checks = 11;
  repeated string reasons = 12;
  repeated string warnings = 13;
}

message RevokeCertificateRequest {
  string ca_id = 1;
  string serial = 2;
  // reason is an RFC 5280 CRL reason name (e.g. "keyCompromise",
  // "cessationOfOperation"); empty defaults to "unspecified".
  string reason = 3;
}

message RevokeCertificateResponse {
  string serial = 1;
  // status is "revoked" for a newly applied revocation or "already-revoked"
  // when the serial was already revoked (idempotent).
  string status = 2;
}

message SuspendCertificateRequest {
  string ca_id = 1;
  string serial = 2;
}

message SuspendCertificateResponse {
  string serial = 1;
  // status is "held" for a newly applied hold or "already-held" when the serial
  // was already on hold (idempotent).
  string status = 2;
}

message ReleaseCertificateRequest {
  string ca_id = 1;
  string serial = 2;
}

message ReleaseCertificateResponse {
  string serial = 1;
  // status is "released".
  string status = 2;
}

// CertificateInfo is the authority's stored view of a certificate it issued.
message CertificateInfo {
  string ca_id = 1;
  string serial = 2;
  string subject = 3;
  string common_name = 4;
  repeated string sans = 5;
  string profile = 6;
  string certificate_pem = 7;
  google.protobuf.Timestamp not_before = 8;
  google.protobuf.Timestamp not_after = 9;
  CertificateStatus status = 10;
  google.protobuf.Timestamp revoked_at = 11;
  int32 revocation_reason = 12;
  string requested_by = 13;
  google.protobuf.Timestamp created_at = 14;
}

message GetCertificateRequest {
  string ca_id = 1;
  string serial = 2;
}

message GetCertificateResponse {
  CertificateInfo certificate = 1;
}

message GetCertificateStatusRequest {
  string ca_id = 1;
  string serial = 2;
}

message GetCertificateStatusResponse {
  CertificateStatus status = 1;
  google.protobuf.Timestamp revoked_at = 2;
  int32 revocation_reason = 3;
}

message ListCertificatesRequest {
  string ca_id = 1;
  // Pagination and filtering (Task 83). The response returns one keyset page,
  // newest first; pass next_cursor back in cursor to fetch the following page.
  // limit defaults to the server default and is capped at the server maximum.
  int32 limit = 2;
  string cursor = 3;
  // status filters by lifecycle state (valid, revoked, held, expired).
  string status = 4;
  // profile filters by issuing profile name.
  string profile = 5;
  // query is a case-insensitive substring matched against subject/CN/SANs.
  string query = 6;
  // serial_prefix restricts to serials beginning with this decimal string.
  string serial_prefix = 7;
  // expires_before restricts to certificates whose NotAfter is before this
  // instant.
  google.protobuf.Timestamp expires_before = 8;
}

message ListCertificatesResponse {
  repeated CertificateInfo certificates = 1;
  // next_cursor continues the listing; empty when this is the last page.
  string next_cursor = 2;
  // total is the number of certificates matching the filter across all pages.
  int32 total = 3;
  // has_more is true when further pages remain past this one.
  bool has_more = 4;
}

message GetCRLMetadataRequest {
  string ca_id = 1;
  // shard, when set, selects a CRL partition (0..shard_count-1). When unset the
  // full (unsharded) CRL is described. Sharding must be enabled to name a shard.
  optional int32 shard = 2;
}

message GetCRLMetadataResponse {
  // scope is "full" for the unsharded CRL or "partition:N" for a shard.
  string scope = 1;
  int64 crl_number = 2;
  google.protobuf.Timestamp this_update = 3;
  google.protobuf.Timestamp next_update = 4;
  string crl_url = 5;
  string delta_crl_url = 6;
  // delta_available is true when a delta CRL has been published for this scope.
  bool delta_available = 7;
  int64 delta_crl_number = 8;
  google.protobuf.Timestamp delta_this_update = 9;
  google.protobuf.Timestamp delta_next_update = 10;
  // shard_count is the configured number of CRL partitions (0/1 = unsharded).
  int32 shard_count = 11;
}

message GetOCSPMetadataRequest {
  string ca_id = 1;
}

message GetOCSPMetadataResponse {
  // ocsp_urls are the responder endpoint(s) for this CA. Empty when no public
  // base URL is configured (crl.base_url / acme.base_url).
  repeated string ocsp_urls = 1;
  // nonce_supported reports whether the responder echoes RFC 8954 nonces.
  bool nonce_supported = 2;
  // delegated_responder reports whether responses are signed by a short-lived
  // delegated OCSP-signing certificate rather than the CA key.
  bool delegated_responder = 3;
}
