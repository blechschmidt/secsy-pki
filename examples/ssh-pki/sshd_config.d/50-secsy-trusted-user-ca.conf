# Secsy PKI — trust the ops SSH CA for USER logins.
# Install as /etc/ssh/sshd_config.d/50-secsy-trusted-user-ca.conf, then
# `systemctl reload sshd`. (Requires `Include /etc/ssh/sshd_config.d/*.conf` in
# the main sshd_config — present by default on modern OpenSSH.)

# Accept any user certificate signed by this CA. Fetch the file from
#   GET https://pki.example.com/api/ssh/cas/<ca-id>/public
TrustedUserCAKeys /etc/ssh/ops-ssh-ca.pub

# Honor revocations. The KRL is refreshed on a timer (see systemd/); sshd
# rejects a certificate whose serial or key ID appears here. Fetch it from
#   GET https://pki.example.com/api/ssh/cas/<ca-id>/krl
RevokedKeys /etc/ssh/ops-ssh-ca.krl

# The certificate's principals decide which local accounts it may log in as
# (an OpenSSH cert principal must match the target Unix username, or an
# AuthorizedPrincipalsFile mapping). Nothing is written to authorized_keys.
