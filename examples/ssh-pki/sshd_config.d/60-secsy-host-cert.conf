# Secsy PKI — present this host's HOST certificate to connecting clients.
# Install as /etc/ssh/sshd_config.d/60-secsy-host-cert.conf, then
# `systemctl reload sshd`.
#
# The certificate is signed from the host's existing host key
# (/etc/ssh/ssh_host_ed25519_key.pub) — see scripts/enroll-host.sh — and lives
# beside it as *-cert.pub. Clients that pin the CA with `@cert-authority` in
# known_hosts (see ssh_known_hosts.example) then verify this host with NO
# trust-on-first-use prompt.

HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub

# The matching host private key must already be configured (default on modern
# OpenSSH). Uncomment if your host disabled it:
# HostKey /etc/ssh/ssh_host_ed25519_key
