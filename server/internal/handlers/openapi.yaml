  /api/events/export:
    get:
      operationId: exportEventLog
      tags: [Audit]
      summary: Export the audit event log in a SIEM wire format
      description: >-
        Streams audit events as newline-delimited records in the requested
        format — the REST counterpart of `secsy-ca audit export`. Requires a
        platform-wide audit:read role (the export is a cross-tenant feed).
      parameters:
        - name: format
          in: query
          description: Record format; defaults to json (NDJSON).
          schema: { type: string, enum: [json, cef, rfc5424], default: json }
        - name: from
          in: query
          description: Start of the range (RFC 3339, inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End of the range (RFC 3339, exclusive).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Newline-delimited audit records.
          content:
            application/x-ndjson:
              schema: { type: string }
            text/plain:
              schema: { type: string }
