openapi: "3.1.0"
info:
  title: Secsy PKI
  description: >-
    HSM-backed enterprise PKI and secret-encryption platform. Exposes X.509
    certificate-authority management (root/intermediate setup, issuance, renewal,
    revocation with CRL/OCSP), SSH certificate signing, HSM-backed envelope
    encryption for secrets, certificate-expiry monitoring, RBAC/audit
    administration, ACME (RFC 8555) directory, and operational endpoints. Every
    private-key operation runs inside the configured key provider (PKCS#11 HSM /
    YubiHSM); key material never leaves the token.


    Protocol parity: the core certificate-lifecycle operations documented here —
    issue (from CSR/template), renew, revoke, get certificate/status, list, and
    CRL/OCSP metadata — are additionally exposed over a gRPC API (PKIService,
    proto/pki/v1/pki.proto) with server reflection, enforcing the same operator
    authentication (Bearer OIDC / Basic root / mutual-TLS), RBAC, tenant scoping,
    and tamper-evident audit as these REST endpoints. See docs/grpc-api.md.
  version: "2.0.0"
  license:
    name: MIT
  contact:
    name: Secsy PKI
    url: https://github.com/blechschmidt/secsy-pki

servers:
  - url: /
    description: The Secsy PKI server root (all paths are absolute).

security:
  - basicAuth: []
  - bearerAuth: []

tags:
  - name: Meta
    description: Health, auth discovery, and current-user endpoints.
  - name: Tenants
    description: Multi-tenant isolation boundaries (platform administration).
  - name: API Tokens
    description: >-
      Native scoped API tokens / service accounts for machine-to-machine auth:
      revocable long-lived credentials bound to RBAC roles and a tenant scope.
      Create returns the opaque secret exactly once.
  - name: Certificate Authorities
    description: HSM-backed CA key management and root/intermediate setup.
  - name: Certificate Lifecycle
    description: End-entity issuance, renewal, and revocation (X.509 and SSH).
  - name: Revocation
    description: Public CRL and OCSP distribution points.
  - name: Monitoring
    description: Certificate-expiry reporting and on-demand scans.
  - name: Discovery
    description: External TLS certificate discovery/scanning and rogue-cert inventory.
  - name: SSH CA
    description: >-
      HSM-backed OpenSSH certificate authority: user/host certificate signing
      under profiles, revocation, and public KRL distribution.
  - name: Artifact Signing
    description: >-
      HSM-backed code/artifact signing: CMS (PKCS#7, RFC 5652) detached
      signatures over release artifacts with CA-issued code-signing
      certificates, optional embedded RFC 3161 timestamp countersignatures,
      and verification against the PKI's trust anchors.
  - name: RBAC
    description: Groups, memberships, and per-CA permission grants.
  - name: Restrictions
    description: SSH/X.509 signing restriction sets.
  - name: Audit
    description: Access log, sign-audit log, and the tamper-evident event log.
  - name: Approvals
    description: >-
      Four-eyes / maker-checker approval workflow for high-risk administrative
      operations: list the queue, and approve or reject pending requests.
  - name: Secrets
    description: HSM-backed envelope encryption for passwords and small secrets.
  - name: HSM
    description: HSM device information and audit-log management.
  - name: ACME
    description: ACME (RFC 8555) directory and operator visibility.
  - name: Operations
    description: Prometheus metrics, liveness/readiness probes, and API docs.

paths:
  # ---------------------------------------------------------------------------
  # Meta
  # ---------------------------------------------------------------------------
  /api/health:
    get:
      operationId: getHealth
      tags: [Meta]
      summary: Health check
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/auth/config:
    get:
      operationId: getAuthConfig
      tags: [Meta]
      summary: Public authentication configuration
      description: Reports whether OIDC login is enabled and, if so, its issuer and client id.
      security: []
      responses:
        "200":
          description: Authentication discovery document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }

  /api/me:
    get:
      operationId: getCurrentUser
      tags: [Meta]
      summary: Current authenticated user
      responses:
        "200":
          description: The authenticated principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------------------
  # Certificate Authorities
  # ---------------------------------------------------------------------------
  /api/keys:
    get:
      operationId: listCAs
      tags: [Certificate Authorities]
      summary: List certificate authorities / signing keys
      responses:
        "200":
          description: All CAs and signing keys visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CA" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCA
      tags: [Certificate Authorities]
      summary: Register a signing key / CA (generic)
      description: >-
        Creates a signing key in the key provider (or references an existing one
        via pkcs11_uri / public_key). For full X.509 root/intermediate setup use
        the dedicated init-root and issue-intermediate operations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCARequest" }
      responses:
        "201":
          description: The created CA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tenants:
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: List tenants (platform admin only)
      description: >-
        Returns every tenant. Restricted to platform operators (the root user or
        a platform-wide admin role); a tenant-scoped admin governs resources
        within its own tenant but cannot enumerate other tenants.
      responses:
        "200":
          description: All tenants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Provision a tenant (platform admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: The created tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /api/tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Tenant id.
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: Get a tenant by id
      description: Readable by platform operators and by members of the tenant.
      responses:
        "200":
          description: The requested tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateTenant
      tags: [Tenants]
      summary: Update a tenant's name, KEK label, or quotas (platform admin only)
      description: >-
        Partial update; absent fields are unchanged. Quota changes take effect
        on the next issuance/secret operation — enforcement is fail-closed on
        the issuance (REST/ACME/SCEP/EST/CMP/gRPC/SSH) and secret paths, where
        exhaustion answers 429 with code quota_exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTenantRequest" }
      responses:
        "200":
          description: The updated tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTenant
      tags: [Tenants]
      summary: Delete an empty tenant (platform admin only)
      description: >-
        Refused for the default tenant and for any tenant that still owns CAs.
      responses:
        "200":
          description: The tenant was deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /api/tenants/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Tenant id.
    put:
      operationId: setTenantStatus
      tags: [Tenants]
      summary: Activate or suspend a tenant (platform admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantStatusRequest" }
      responses:
        "200":
          description: The updated status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tenants/{id}/usage:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Tenant id.
      - name: days
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
        description: Size of the rolling usage window in UTC days.
    get:
      operationId: getTenantUsage
      tags: [Tenants]
      summary: Per-tenant usage report
      description: >-
        Live inventory counts (active/total/revoked certificates, CAs) plus a
        rolling window of daily usage accounting (certificates issued/revoked,
        secret operations). Readable by platform operators and by members of
        the tenant; other tenants receive 404.
      responses:
        "200":
          description: The usage report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantUsageReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tokens:
    get:
      operationId: listTokens
      tags: [API Tokens]
      summary: List API tokens / service accounts
      description: >-
        Lists the tokens the caller may manage. A platform administrator sees
        all tokens (optionally filtered by ?tenant=); a tenant admin sees only
        the tokens of tenants it administers. Secrets and at-rest hashes are
        never included.
      parameters:
        - name: tenant
          in: query
          required: false
          schema: { type: string }
          description: Restrict the listing to a single tenant id.
      responses:
        "200":
          description: The tokens the caller may manage.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createToken
      tags: [API Tokens]
      summary: Mint an API token (returns the secret once)
      description: >-
        Creates a scoped API token bound to a set of RBAC roles and a tenant
        scope. Managing tokens is an administrative capability (token:manage,
        admin-only): tenant admins may mint tenant-scoped tokens within their
        tenant, while platform-scoped (cross-tenant) tokens require a platform
        administrator. When the four-eyes gate is enabled, a sensitive grant (a
        privileged role or platform scope) is held for approval and answered
        with 202; re-run the identical request once approved. The response
        carries the opaque secret exactly once — it is stored only as a one-way
        hash and cannot be recovered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTokenRequest" }
      responses:
        "201":
          description: The created token, including its one-time secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APITokenWithSecret" }
        "202":
          description: >-
            The grant is sensitive and is held for four-eyes approval. Re-run the
            identical request once the approver threshold is met.
          headers:
            X-Secsy-Approval-Id:
              schema: { type: string }
              description: Id of the pending approval request.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Token id.
    delete:
      operationId: revokeToken
      tags: [API Tokens]
      summary: Revoke an API token
      description: >-
        Revokes a token by id (fail-closed on every subsequent use). Revocation
        is not four-eyes gated — it removes access and must stay fast for
        incident response.
      responses:
        "200":
          description: The token was revoked (or was already revoked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/keys/{id}:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: getCA
      tags: [Certificate Authorities]
      summary: Get a CA by id
      responses:
        "200":
          description: The requested CA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCA
      tags: [Certificate Authorities]
      summary: Delete a CA
      responses:
        "200":
          description: The CA was deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/keys/{id}/children:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: listCAChildren
      tags: [Certificate Authorities]
      summary: List a CA's direct children
      responses:
        "200":
          description: Child CAs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CA" }

  /api/keys/{id}/public-key:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - name: format
        in: query
        description: Output encoding.
        schema:
          type: string
          enum: [pem, ssh]
          default: pem
    get:
      operationId: getCAPublicKey
      tags: [Certificate Authorities]
      summary: Get a CA public key (PEM or OpenSSH)
      responses:
        "200":
          description: The public key.
          content:
            application/x-pem-file:
              schema: { type: string }
            text/plain:
              schema: { type: string }

  /api/ca/init-root:
    post:
      operationId: initRootCA
      tags: [Certificate Authorities]
      summary: Initialize a self-signed root CA
      description: Generates the root key inside the HSM and self-signs the root certificate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAInitRootRequest" }
      responses:
        "201":
          description: The initialized root CA (with certificate populated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/issue-intermediate:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: issueIntermediateCA
      tags: [Certificate Authorities]
      summary: Issue an intermediate CA
      description: Generates a new key in the HSM and signs an intermediate CA certificate with the parent identified by the path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAIssueIntermediateRequest" }
      responses:
        "201":
          description: The issued intermediate CA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/csr:
    post:
      operationId: createExternalCACSR
      tags: [Certificate Authorities]
      summary: Prepare an externally-signed subordinate CA (key + CSR)
      description: >
        Generates a subordinate-CA key inside the HSM and returns a PKCS#10 CSR
        carrying CA basicConstraints/keyUsage attributes, for signature by an
        external parent (an offline corporate root or a third-party bridge CA).
        The CA is persisted in the "pending" state and cannot issue anything
        until the signed certificate is installed via import-cert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAExternalCSRRequest" }
      responses:
        "201":
          description: The pending CA record and its PKCS#10 CSR.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAExternalCSRResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/csr:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: getExternalCACSR
      tags: [Certificate Authorities]
      summary: Re-download an externally-signed CA's PKCS#10 CSR
      description: >
        Returns the stored CSR of a CA created for external signing — while the
        out-of-band signing ceremony is in flight, or later to have the external
        parent re-certify the same key (renewal).
      responses:
        "200":
          description: The PKCS#10 CSR (PEM).
          content:
            application/x-pem-file:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ca/{id}/import-cert:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: importExternalCACert
      tags: [Certificate Authorities]
      summary: Install the externally signed certificate for a pending CA
      description: >
        Validates and installs the certificate an external parent issued for the
        CA's HSM-backed key. Fail-closed checks: the public key must match the
        key held by the provider, basicConstraints must assert cA=TRUE, keyUsage
        (when present) must include keyCertSign, the certificate must be
        currently valid and not self-signed, and — when a chain is supplied —
        it must verify against the external chain. The verified external chain
        is then served via the CA's chain endpoint. Non-fatal findings (missing
        cRLSign, rewritten DN, changed path length) are returned as warnings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAImportCertRequest" }
      responses:
        "200":
          description: The activated CA, validation warnings, and the served chain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAImportCertResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ca/{id}/cross-signs:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: createCrossSign
      tags: [Certificate Authorities]
      summary: Cross-sign a subject key under this CA
      description: >
        Uses the issuer CA identified by the path to cross-sign a subject public
        key: the issuer's HSM-backed key signs a CA certificate carrying the
        subject's exact distinguished name and public key, producing an alternate
        trust chain for bridge-CA and root-transition topologies. The subject may
        be another CA in this deployment (subject_ca_id), an externally supplied
        certificate (certificate_pem), or a CSR (csr_pem) — exactly one. The
        subject's private key is never involved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CACrossSignRequest" }
      responses:
        "201":
          description: The cross-sign relationship, cross-certificate, and alternate chain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrossSignResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      operationId: listCrossSigns
      tags: [Certificate Authorities]
      summary: List a CA's cross-sign relationships
      description: Returns the cross-signs a CA has issued and those certifying its key.
      responses:
        "200":
          description: Cross-sign relationships related to the CA.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cross_signs:
                    type: array
                    items: { $ref: "#/components/schemas/CrossSign" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/chains:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: getAlternateChains
      tags: [Certificate Authorities]
      summary: List a subject CA's publishable alternate chains
      description: >
        Returns every publishable trust path for a subject CA: its native
        parent-lineage chain plus one chain per active cross-sign of its key. A
        relying party can select whichever chain terminates at a trust anchor it
        holds. Public, like the combined issuer chain endpoint.
      security: []
      responses:
        "200":
          description: The alternate chains available for the CA.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chains:
                    type: array
                    items: { $ref: "#/components/schemas/AlternateChain" }

  /api/ca/{id}/cross-signs/{csid}/chain:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - name: csid
        in: path
        required: true
        description: Cross-sign relationship id.
        schema: { type: string }
    get:
      operationId: getCrossSignChain
      tags: [Certificate Authorities]
      summary: Download a cross-sign's alternate chain (PEM)
      description: >
        Returns the alternate chain for a single cross-sign as a PEM bundle: the
        cross-certificate followed by the issuer's chain to its trust anchor.
        Public, like the CRL/OCSP/chain endpoints.
      security: []
      responses:
        "200":
          description: PEM bundle of the cross-sign's alternate chain.
          content:
            application/x-pem-file:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/rotations:
    get:
      operationId: listRotations
      tags: [Certificate Authorities]
      summary: List CAs in a key-rotation lineage
      description: >-
        Returns every visible CA that participates in a signing-key rollover
        (superseded, retired, or linked to a predecessor/successor), with each
        one's outstanding-leaf count and retirement readiness.
      responses:
        "200":
          description: Rotation lineage entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rotations:
                    type: array
                    items: { $ref: "#/components/schemas/RotationStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/rotation:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: getRotationStatus
      tags: [Certificate Authorities]
      summary: Report a CA's key-rollover state
      description: >-
        Returns the CA's rotation lineage (predecessor/successor), the number of
        not-yet-expired leaves signed by its key, and whether a superseded key
        can be retired now.
      responses:
        "200":
          description: The rotation status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ca/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: rotateIntermediateCA
      tags: [Certificate Authorities]
      summary: Rotate an intermediate CA's signing key
      description: >-
        Performs an HSM-backed key rollover: a fresh key is generated inside the
        provider and certified under the same parent with the same subject DN.
        The old CA is marked superseded and keeps validating its issued leaves
        through the overlap window, during which the combined chain bundles both
        intermediates. Requires ca:manage; step-up gated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateCARequest" }
      responses:
        "201":
          description: The rotation outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotateCAResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/retire:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: retireIntermediateCA
      tags: [Certificate Authorities]
      summary: Retire a superseded intermediate key
      description: >-
        Decommissions a superseded intermediate after the overlap window has
        drained: its certificate is revoked under the parent and the parent CRL
        is refreshed. Refused while leaves signed by the old key are still
        valid unless force is set (emergency key-compromise response). Requires
        ca:manage; step-up gated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetireCARequest" }
      responses:
        "200":
          description: The retirement outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetireCAResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------
  # Certificate Lifecycle
  # ---------------------------------------------------------------------------
  /api/profiles:
    get:
      operationId: listProfiles
      tags: [Certificate Lifecycle]
      summary: List certificate profiles
      responses:
        "200":
          description: Available issuance profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Profile" }

  /api/ca/{id}/issue:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: issueCertificate
      tags: [Certificate Lifecycle]
      summary: Issue an end-entity certificate from a CSR
      description: >-
        Signs a CSR into an end-entity certificate under a profile. When the
        selected profile sets require_approval and the four-eyes approval gate is
        enabled with the cert.issue class guarded (Task 84), the certificate is
        NOT issued: the request is held for manual approval and a 202 is returned
        carrying the pending-approval id. Once the approver threshold is met,
        fetch the certificate from /api/approvals/{id}/certificate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCertRequest" }
      responses:
        "201":
          description: The issued certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueCertResponse" }
        "202":
          description: >-
            Issuance was held for four-eyes approval (the profile requires it).
            No certificate was issued; poll /api/approvals/{id}/certificate once
            the request is approved. The pending-approval id is also returned in
            the X-Secsy-Approval-Id header.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingIssuanceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/pkcs12:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: exportCertificatePKCS12
      tags: [Certificate Lifecycle]
      summary: Generate a subject key, issue a leaf, and export a PKCS#12 bundle
      description: >
        Generates a subject keypair server-side, issues a leaf under the named
        profile, and returns a password-protected PKCS#12 (.p12/.pfx) bundle
        containing the subject key, the leaf, and the full issuer chain — for
        S/MIME and device-enrollment key delivery. The CA signing key never
        leaves the HSM; only the freshly-generated subject key is bundled. When
        escrow is requested the subject key is additionally escrowed under the
        configured M-of-N recovery policy and the escrow envelope is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportPKCS12Request" }
      responses:
        "201":
          description: The PKCS#12 bundle (base64 DER) and issuance metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPKCS12Response" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/renew:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: renewCertificate
      tags: [Certificate Lifecycle]
      summary: Renew a certificate by serial (optionally rekey)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewCertRequest" }
      responses:
        "201":
          description: The renewed certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueCertResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: revokeCertificate
      tags: [Certificate Lifecycle]
      summary: Revoke a certificate by serial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeCertRequest" }
      responses:
        "200":
          description: Revocation outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/certificates/{serial}:suspend:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - $ref: "#/components/parameters/CertSerial"
    post:
      operationId: suspendCertificate
      tags: [Certificate Lifecycle]
      summary: Suspend a certificate (place on hold)
      description: >
        Place a certificate on hold (RFC 5280 certificateHold) — a reversible
        revocation, distinct from the permanent revocation of /revoke. While
        held the certificate is reported revoked by OCSP (reason
        certificateHold) and listed on the base CRL; a release restores it to
        service. Gated by the same SIGN_CERTIFICATE / tenant authorization as
        single revocation. Suspending a certificate already permanently revoked
        is refused.
      responses:
        "200":
          description: Suspension outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/certificates/{serial}:release:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - $ref: "#/components/parameters/CertSerial"
    post:
      operationId: releaseCertificate
      tags: [Certificate Lifecycle]
      summary: Release a certificate hold
      description: >
        Remove a certificate hold, returning the certificate to service: OCSP
        reports it good again, the next base CRL omits it, and the next delta
        CRL carries a removeFromCRL entry (RFC 5280 §5.2.4). Succeeds only for a
        certificate that is on hold; a permanently revoked certificate cannot be
        released and is refused with 409.
      responses:
        "200":
          description: Release outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            The certificate is not on hold (it is permanently revoked, or not
            revoked at all); nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/ca/{id}/revocations:bulk:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: bulkRevokeCertificates
      tags: [Certificate Lifecycle]
      summary: Mass-revoke certificates (incident response)
      description: >
        Bulk revocation for compromise scenarios (CA/B Forum 24-hour
        key-compromise obligation). Certificates are selected by filters
        (profile, CN/SAN glob, issuance window, explicit serial list — serials
        unknown to the inventory are revoked as bare CRL entries) and revoked
        in batches; the base and delta CRLs are regenerated once at the end
        and cached OCSP responses are invalidated. A dry_run request returns
        the plan (counts and a sample) without changing anything; a real run
        must echo the dry-run total in confirm_count and is refused with 409
        when the live selection has drifted. Re-running an interrupted
        operation resumes it (already-revoked certificates are never
        re-selected). Requires the ca:manage capability in the CA's tenant and
        is step-up eligible; it is never rate-limited or quota-gated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRevokeRequest" }
      responses:
        "200":
          description: The dry-run plan, or the executed operation's result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BulkRevokePlan"
                  - $ref: "#/components/schemas/BulkRevokeResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            confirm_count no longer matches the live selection (certificates
            were issued or revoked since the dry run). Nothing was revoked;
            re-run the dry run and confirm the fresh count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkRevokeConflict" }

  /api/ca/{id}/certificates:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: listIssuedCertificates
      tags: [Certificate Lifecycle]
      summary: List certificates issued by a CA
      description: >-
        Returns one keyset page of the CA's issued certificates, newest first.
        Pass the returned next_cursor back in ?cursor to fetch the following
        page. The page size defaults to 100 and is capped at 500.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CertStatusFilter"
        - $ref: "#/components/parameters/CertProfileFilter"
        - $ref: "#/components/parameters/CertSearch"
        - $ref: "#/components/parameters/CertSerialPrefix"
        - $ref: "#/components/parameters/CertExpiresBefore"
      responses:
        "200":
          description: One page of issued certificates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCertificatePage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/ca/{id}/revoked:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: listRevokedCertificates
      tags: [Certificate Lifecycle]
      summary: List revoked serials for a CA
      description: >-
        Returns one keyset page of the CA's revocation records, newest
        revocation first. Pass the returned next_cursor back in ?cursor to fetch
        the following page.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CertSerialPrefix"
      responses:
        "200":
          description: One page of revocation records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedCertificatePage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/keys/{id}/sign:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: signSSHCertificate
      tags: [Certificate Lifecycle]
      summary: Sign an OpenSSH certificate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignRequest" }
      responses:
        "200":
          description: The signed SSH certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/keys/{id}/sign-x509:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: signX509Certificate
      tags: [Certificate Lifecycle]
      summary: Sign an X.509 certificate from a CSR (low-level)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/X509SignRequest" }
      responses:
        "200":
          description: The signed X.509 certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/X509SignResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/parse-csr:
    post:
      operationId: parseCSR
      tags: [Certificate Lifecycle]
      summary: Parse and validate a PEM PKCS#10 CSR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParseCSRRequest" }
      responses:
        "200":
          description: Decoded CSR fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParsedCSR" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/keys/{id}/my-restrictions:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - name: format
        in: query
        schema:
          type: string
          enum: [ssh, x509]
          default: ssh
    get:
      operationId: getMyRestrictions
      tags: [Restrictions]
      summary: Effective restriction set for the caller on a CA
      responses:
        "200":
          description: The effective restriction set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestrictionSet" }

  # ---------------------------------------------------------------------------
  # Revocation (public)
  # ---------------------------------------------------------------------------
  /api/ca/{id}/crl:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - name: format
        in: query
        schema:
          type: string
          enum: [der, pem]
          default: der
    get:
      operationId: getCRL
      tags: [Revocation]
      summary: Download a CA's complete (base) CRL
      description: >
        The complete CRL covering all of the CA's certificates. It is served from
        the published store and re-signed on the HSM only when stale, so it stays
        a consistent pair with the delta CRL that references it (RFC 5280).
      security: []
      responses:
        "200":
          description: The CRL.
          content:
            application/pkix-crl:
              schema: { type: string, format: binary }
            application/x-pem-file:
              schema: { type: string }

  /api/ca/{id}/crl/delta:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - name: format
        in: query
        schema:
          type: string
          enum: [der, pem]
          default: der
    get:
      operationId: getDeltaCRL
      tags: [Revocation]
      summary: Download a CA's delta CRL
      description: >
        The delta CRL for the complete scope, carrying the Delta CRL Indicator
        (2.5.29.27) referencing the base CRL at /api/ca/{id}/crl and listing only
        the certificates revoked since that base was cut (RFC 5280 §5.2.4).
      security: []
      responses:
        "200":
          description: The delta CRL.
          content:
            application/pkix-crl:
              schema: { type: string, format: binary }
            application/x-pem-file:
              schema: { type: string }

  /api/ca/{id}/crl/partition/{shard}:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - name: shard
        in: path
        required: true
        description: CRL partition index (0-based, less than the configured shard count).
        schema: { type: integer, minimum: 0 }
      - name: format
        in: query
        schema:
          type: string
          enum: [der, pem]
          default: der
    get:
      operationId: getShardCRL
      tags: [Revocation]
      summary: Download a partition's base CRL
      description: >
        The base CRL for one CRL partition (shard). It carries an Issuing
        Distribution Point (2.5.29.28) matching the CRLDistributionPoints stamped
        into the certificates whose serials hash to this shard. Available only
        when CRL partitioning is enabled (crl.shards >= 2).
      security: []
      responses:
        "200":
          description: The partition base CRL.
          content:
            application/pkix-crl:
              schema: { type: string, format: binary }
            application/x-pem-file:
              schema: { type: string }

  /api/ca/{id}/crl/partition/{shard}/delta:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - name: shard
        in: path
        required: true
        description: CRL partition index (0-based, less than the configured shard count).
        schema: { type: integer, minimum: 0 }
      - name: format
        in: query
        schema:
          type: string
          enum: [der, pem]
          default: der
    get:
      operationId: getShardDeltaCRL
      tags: [Revocation]
      summary: Download a partition's delta CRL
      description: >
        The delta CRL for one CRL partition (shard), relative to that partition's
        base CRL. Available only when CRL partitioning is enabled.
      security: []
      responses:
        "200":
          description: The partition delta CRL.
          content:
            application/pkix-crl:
              schema: { type: string, format: binary }
            application/x-pem-file:
              schema: { type: string }

  /api/ca/{id}/chain:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: getChain
      tags: [Revocation]
      summary: Download a CA's combined issuer chain (AIA/bundle)
      description: >
        Returns the combined issuer bundle for a CA as a single PEM: the active
        intermediate, any overlapping superseded siblings still within their
        key-rotation overlap window, and the parent chain up to the root. During
        an intermediate-key rollover this bundle lets relying parties validate
        leaves signed by either the old or the new key. For an externally-signed
        subordinate the bundle continues past the local hierarchy with the
        imported external chain, up to the external trust anchor.
      security: []
      responses:
        "200":
          description: PEM bundle of the CA's issuer chain.
          content:
            application/x-pem-file:
              schema: { type: string }

  # ---------------------------------------------------------------------------
  # SPIFFE X.509-SVID workload identity
  # ---------------------------------------------------------------------------
  /api/ca/{id}/svid:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: issueSVID
      tags: [Certificate Lifecycle]
      summary: Mint a SPIFFE X.509-SVID
      description: >
        Issues a short-lived SPIFFE X.509-SVID whose sole identity is a spiffe://
        URI SAN (no CN reliance, no DNS/IP SAN by default), CA:false, key usage
        digitalSignature. The workload supplies a CSR for its freshly generated
        key; only the public key is used. The requested trust domain must be
        permitted by the SVID trust-domain allowlist (on top of the CA's issue
        capability). Available only when SPIFFE issuance is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SVIDRequest" }
      responses:
        "201":
          description: The issued SVID, its chain, and the trust bundle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SVIDResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ca/{id}/svid/bundle:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: getSVIDBundle
      tags: [Certificate Lifecycle]
      summary: Download a CA's SPIFFE trust bundle (JWKS)
      description: >
        Returns the trust domain's X.509 authorities (the CA's combined overlap
        chain) as a JWKS-style SPIFFE trust bundle, consumable directly by SPIRE
        and go-spiffe clients. Public, like the CRL/OCSP/chain endpoints.
      security: []
      responses:
        "200":
          description: The SPIFFE trust bundle.
          content:
            application/json:
              schema: { type: object }

  /api/ca/{id}/ocsp:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: postOCSP
      tags: [Revocation]
      summary: OCSP responder (POST, DER request body)
      security: []
      requestBody:
        required: true
        content:
          application/ocsp-request:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: DER OCSP response.
          content:
            application/ocsp-response:
              schema: { type: string, format: binary }

  /api/ca/{id}/ocsp/{ocspRequest}:
    parameters:
      - $ref: "#/components/parameters/CAId"
      - name: ocspRequest
        in: path
        required: true
        description: base64url-encoded DER OCSP request.
        schema: { type: string }
    get:
      operationId: getOCSP
      tags: [Revocation]
      summary: OCSP responder (GET, base64 request in path)
      security: []
      responses:
        "200":
          description: DER OCSP response.
          content:
            application/ocsp-response:
              schema: { type: string, format: binary }

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  /api/monitor/expiring:
    get:
      operationId: listExpiringCertificates
      tags: [Monitoring]
      summary: Report certificates by remaining validity
      parameters:
        - name: ca
          in: query
          description: Restrict to one CA id.
          schema: { type: string }
        - name: days
          in: query
          description: Only certificates expiring within n days (and already expired).
          schema: { type: integer, minimum: 0 }
        - name: severity
          in: query
          schema: { type: string, enum: [warning, critical, expired] }
        - name: include_superseded
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Expiry report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpiryReport" }

  /api/monitor/scan:
    post:
      operationId: runExpiryScan
      tags: [Monitoring]
      summary: Run an on-demand expiry scan (optionally auto-renew)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "200":
          description: Scan report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanReport" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------
  # Discovery
  # ---------------------------------------------------------------------------
  /api/discovery:
    get:
      operationId: listDiscoveredCertificates
      tags: [Discovery]
      summary: List external certificates recorded by the discovery scanner
      description: >-
        Returns one keyset page of the certificates observed on external TLS
        endpoints, newest first, including their security flags (expiring, weak
        key, SHA-1, self-signed, hostname mismatch, and rogue/not-issued-by-this-
        PKI). Pass the returned next_cursor back in ?cursor to fetch the following
        page. The legacy "certificates" key aliases "items" for older clients.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CertSearch"
        - $ref: "#/components/parameters/CertSerialPrefix"
        - $ref: "#/components/parameters/CertExpiresBefore"
      responses:
        "200":
          description: One page of the discovered-certificate inventory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredCertificateList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/scan:
    post:
      operationId: runDiscoveryScan
      tags: [Discovery]
      summary: Run an on-demand external certificate discovery scan
      description: >-
        Probes the given TLS endpoints (or the configured discovery targets when
        none are supplied), analyzes each served leaf, and optionally records the
        findings to the inventory and dispatches flagged findings through the
        monitor notification sinks. Requires the issue capability because it
        actively probes endpoints and may write to the inventory and fire alerts.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryScanRequest" }
      responses:
        "200":
          description: Discovery scan report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryScanReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------
  # SSH certificate authority (Task 57)
  # ---------------------------------------------------------------------------
  /api/ssh/cas:
    get:
      operationId: listSSHCAs
      tags: [SSH CA]
      summary: List SSH certificate authorities
      description: >-
        Returns the CA records that exist as SSH signing keys (no X.509
        certificate). Visibility follows the X.509 CA list — platform
        principals see every tenant, tenant-scoped principals only their own.
      responses:
        "200":
          description: SSH CAs visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CA" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createSSHCA
      tags: [SSH CA]
      summary: Initialize an HSM-backed SSH certificate authority
      description: >-
        Generates an SSH CA signing key inside the configured key provider and
        persists the CA record. The returned public key is the trust anchor
        relying hosts pin via TrustedUserCAKeys (user certificates) or a
        @cert-authority known_hosts entry (host certificates). Requires the
        ca:manage capability in the target tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSSHCARequest" }
      responses:
        "201":
          description: The created SSH CA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ssh/profiles:
    get:
      operationId: listSSHProfiles
      tags: [SSH CA]
      summary: List the effective SSH signing profiles
      description: >-
        Returns the built-in profiles (user-default, host-default) overlaid with
        any operator-defined profiles from configuration.
      responses:
        "200":
          description: SSH signing profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SSHProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ssh/cas/{id}/sign:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: signSSHCert
      tags: [SSH CA]
      summary: Sign an OpenSSH user or host certificate
      description: >-
        Validates the request against its signing profile (principals,
        validity bounds, extensions, critical options), allocates the next
        serial from the CA's monotonic counter, and signs the certificate with
        the CA's HSM-held key. Requires the CA's issue capability, exactly like
        X.509 issuance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHSignRequest" }
      responses:
        "201":
          description: The signed certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHSignResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ssh/cas/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      operationId: revokeSSHCert
      tags: [SSH CA]
      summary: Revoke an SSH certificate by serial or key ID
      description: >-
        Records a revocation for one certificate serial, or for every
        certificate bearing a key ID. The change is published to relying hosts
        through the CA's KRL. Idempotent; re-revoking updates the reason/time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHRevokeRequest" }
      responses:
        "200":
          description: Revocation outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHRevokeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ssh/cas/{id}/certificates:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: listSSHCertificates
      tags: [SSH CA]
      summary: List SSH certificates signed by a CA
      responses:
        "200":
          description: SSH certificate inventory, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SSHCertificate" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ssh/cas/{id}/revocations:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: listSSHRevocations
      tags: [SSH CA]
      summary: List a CA's SSH revocation records
      responses:
        "200":
          description: Revocation records (the entries the KRL publishes).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SSHRevocation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ssh/cas/{id}/public:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: getSSHCAPublicKey
      tags: [SSH CA]
      summary: Fetch a CA's public key (authorized_keys line)
      description: >-
        Public, unauthenticated trust-anchor distribution — the line to install
        as TrustedUserCAKeys or a @cert-authority known_hosts entry.
      security: []
      responses:
        "200":
          description: The CA public key.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ssh/cas/{id}/krl:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      operationId: getSSHKRL
      tags: [SSH CA]
      summary: Fetch a CA's OpenSSH Key Revocation List (KRL)
      description: >-
        Public, unauthenticated revocation distribution, generated fresh from
        the revocation store — point sshd's RevokedKeys option at this
        artifact, exactly like TLS relying parties fetch the CRL.
      security: []
      responses:
        "200":
          description: The binary KRL.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Artifact signing (Task 60)
  # ---------------------------------------------------------------------------
  /api/sign:
    post:
      operationId: signArtifact
      tags: [Artifact Signing]
      summary: Produce a CMS detached signature over a release artifact
      description: >-
        Signs the submitted artifact (base64) — or its precomputed digest
        (hex), for artifacts too large to ship — with a configured code-signing
        key held by the key provider, returning a detached CMS/PKCS#7
        SignedData. When timestamping applies (the signer's default, or the
        request's explicit choice), an RFC 3161 timestamp token over the
        signature value from the in-process TSA is embedded as the
        id-aa-timeStampToken unsigned attribute, so the signature stays
        verifiable after the signing certificate expires. Requires the
        artifact:sign capability (signer role) within the signer's tenant;
        audited as artifact.sign; rate-limited and HSM-concurrency-guarded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactSignRequest" }
      responses:
        "200":
          description: The detached signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactSignResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Artifact signing is not enabled on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sign/verify:
    post:
      operationId: verifyArtifactSignature
      tags: [Artifact Signing]
      summary: Verify a CMS detached signature
      description: >-
        Checks a detached signature against the artifact (or its digest) and
        the PKI's CA certificates as trust anchors, confined to CAs of tenants
        the caller belongs to (or one CA named by ca_id). A valid embedded
        RFC 3161 countersignature moves chain validation to the token's
        genTime, so countersigned artifacts keep verifying after signer-
        certificate expiry. An invalid signature is a successful request:
        HTTP 200 with valid=false and a reason. Audited as artifact.verify.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactVerifyRequest" }
      responses:
        "200":
          description: The verification verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactVerifyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sign/signers:
    get:
      operationId: listArtifactSigners
      tags: [Artifact Signing]
      summary: List the configured signing identities
      description: >-
        The signing identities available on this server, confined to tenants
        the caller belongs to. Empty when artifact signing is disabled.
      responses:
        "200":
          description: The configured signers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArtifactSignerInfo" }
        "403": { $ref: "#/components/responses/Forbidden" }

