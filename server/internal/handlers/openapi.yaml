    get:
      operationId: getACMEDirectory
      tags: [ACME]
      summary: ACME directory (RFC 8555 §7.1.1)
      security: []
      responses:
        "200":
          description: The ACME directory resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ACMEDirectory" }

  /acme/new-nonce:
    get:
      operationId: getACMENonce
      tags: [ACME]
      summary: Fetch a fresh ACME replay-nonce
      security: []
      responses:
        "204":
          description: Empty body; the nonce is returned in the Replay-Nonce header.
          headers:
            Replay-Nonce:
              schema: { type: string }

  # ---------------------------------------------------------------------------
  # Operations
  # ---------------------------------------------------------------------------
  /metrics:
    get:
      operationId: getMetrics
      tags: [Operations]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }

  /healthz:
    get:
      operationId: getLiveness
      tags: [Operations]
      summary: Liveness probe (always 200)
      description: >-
        Reports that the process is alive, plus a build block identifying the
        binary: release version, Go runtime, and the FIPS 140-3 posture
        (whether the Go Cryptographic Module is active and whether the
        fail-closed security.fips algorithm policy is enforced).
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liveness" }

  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Readiness probe (checks DB and HSM)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      tags: [Operations]
      summary: This OpenAPI document (JSON)
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 specification as JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags: [Operations]
      summary: This OpenAPI document (YAML)
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 specification as YAML.
          content:
            application/yaml:
              schema: { type: string }

  /api/approvals:
    get:
      operationId: listApprovals
      tags: [Approvals]
      summary: List four-eyes approval requests
      description: >-
        Lists maker-checker approval requests, newest first. Requires the
        approval:read capability (held by the approver and auditor roles). A
        platform-scoped reader sees all tenants (optionally narrowed by
        `tenant`); a tenant-scoped approver sees only their own tenant(s).
      parameters:
        - name: status
          in: query
          description: Filter by status.
          schema: { type: string, enum: [pending, approved, rejected, executed, expired] }
        - name: class
          in: query
          description: Filter by operation class (e.g. ca.rotate, revocation.bulk).
          schema: { type: string }
        - name: tenant
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The approval queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        "403":
          description: The caller lacks the approval:read capability.

  /api/approvals/{id}:
    get:
      operationId: getApproval
      tags: [Approvals]
      summary: Get one approval request with its decision log
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: The request and its decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingApproval" }
        "403":
          description: The caller lacks the approval:read capability.
        "404":
          description: No such request (or the workflow is disabled).

  /api/approvals/{id}/approve:
    post:
      operationId: approveApproval
      tags: [Approvals]
      summary: Approve a pending request
      description: >-
        Records the caller's sign-off. Self-approval (approver == requester) is
        refused (403), as is a repeat vote by the same approver (409). When the
        distinct-approver threshold is met the request becomes `approved` and the
        guarded operation may then execute. Requires the approval:approve
        capability in the request's tenant.
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: The updated request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingApproval" }
        "403":
          description: The caller lacks approval:approve, or attempted self-approval.
        "404":
          description: No such request.
        "409":
          description: The approver already decided, or the request is no longer pending.

  /api/approvals/{id}/reject:
    post:
      operationId: rejectApproval
      tags: [Approvals]
      summary: Reject a pending request
      description: >-
        Vetoes a request (terminal). A single rejection blocks the operation.
        The requester may also reject to withdraw their own request. Requires the
        approval:approve capability in the request's tenant (or being the
        requester).
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: The updated (rejected) request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingApproval" }
        "403":
          description: The caller lacks approval:approve.
        "404":
          description: No such request.
        "409":
          description: The request is no longer pending.

  /api/approvals/{id}/certificate:
    get:
      operationId: getApprovalCertificate
      tags: [Approvals]
      summary: Fetch (and complete) the certificate for an approved issuance request
      description: >-
        Delivers the certificate for a per-profile issuance-approval request
        (Task 84). While the request is still pending it returns 202; once the
        approver threshold is met it performs the held issuance on the HSM exactly
        once and returns the certificate; after rejection or expiry it returns 409
        and never issues. Requires the SIGN_CERTIFICATE capability on the target
        CA (the same capability needed to request it).
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: The issued certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueCertResponse" }
        "202":
          description: The request still awaits approval; no certificate yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingIssuanceResponse" }
        "400":
          description: The request is not a certificate-issuance approval.
        "403":
          description: The caller lacks SIGN_CERTIFICATE on the target CA.
        "404":
          description: No such request (or the approval workflow is disabled).
        "409":
          description: The request was rejected or expired; no certificate will be issued.

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Built-in root user (username/password).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token.

  parameters:
    CAId:
      name: id
      in: path
      required: true
      description: CA / signing-key id.
      schema: { type: string }
    CertSerial:
      name: serial
      in: path
      required: true
      description: Certificate serial (decimal string).
      schema: { type: string }
    TenantHeader:
      name: X-Secsy-Tenant
      in: header
      required: false
      description: >-
        Selects the tenant (id or slug) whose secret KEK seals/opens the
        envelope. Omit to use the default tenant and the deployment-wide KEK.
      schema: { type: string }
    GroupId:
      name: id
      in: path
      required: true
      description: Group id.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size (1–500).
      schema: { type: integer, minimum: 1, maximum: 500 }
    Offset:
      name: offset
      in: query
      description: Row offset.
      schema: { type: integer, minimum: 0 }
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque keyset continuation token from a prior page's next_cursor. Omit
        for the first page. Do not construct or interpret this value.
      schema: { type: string }
    CertStatusFilter:
      name: status
      in: query
      description: Filter by certificate lifecycle status.
      schema: { type: string, enum: [valid, revoked, held, expired] }
    CertProfileFilter:
      name: profile
      in: query
      description: Filter by issuing profile name (exact match).
      schema: { type: string }
    CertSearch:
      name: q
      in: query
      description: Case-insensitive substring matched against subject, common name, and SANs (and issuer, for discovery).
      schema: { type: string }
    CertSerialPrefix:
      name: serial_prefix
      in: query
      description: Restrict to serials beginning with this decimal prefix.
      schema: { type: string }
    CertExpiresBefore:
      name: expires_before
      in: query
      description: Restrict to certificates whose notAfter is before this instant (RFC 3339 or YYYY-MM-DD).
      schema: { type: string }
    ApprovalId:
      name: id
      in: path
      required: true
      description: Approval request id.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication is required or failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller lacks the required permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    StatusResponse:
      type: object
      properties:
        status: { type: string }
    Liveness:
      type: object
      properties:
        status: { type: string }
        build:
          type: object
          description: >-
            Identity of the running binary. fips140 is "on" when the process
            runs on the Go FIPS 140-3 Cryptographic Module (GOFIPS140 build or
            GODEBUG=fips140=on); fips140_module is the GOFIPS140 module
            selection the binary was built with ("" for non-FIPS builds);
            fips140_policy is "enforced" when security.fips is active.
          properties:
            version: { type: string }
            go: { type: string }
            fips140: { type: string, enum: ["on", "off"] }
            fips140_module: { type: string }
            fips140_policy: { type: string, enum: [enforced, "off"] }
    StatusMessage:
      type: object
      properties:
        status: { type: string }
        output: { type: string }

    AuthConfig:
      type: object
      properties:
        oidc_enabled: { type: boolean, description: "Bearer-token OIDC verification is configured." }
        oidc_login_enabled: { type: boolean, description: "Server-side interactive OIDC login (/auth/login) is available." }
        password_login: { type: boolean, description: "Session-establishing password login (/auth/login/password) is available." }
        webauthn_enabled: { type: boolean, description: "WebAuthn/passkey step-up is configured for high-risk operations." }
        issuer_url: { type: string }
        client_id: { type: string }

    UserInfo:
      type: object
      properties:
        sub: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        name: { type: string }
        is_root: { type: boolean }
        roles:
          type: array
          items: { type: string }

    CASubject:
      type: object
      required: [cn]
      properties:
        cn: { type: string, description: Common name (required) }
        o: { type: string }
        ou: { type: string }
        c: { type: string }
        st: { type: string }
        l: { type: string }

    NameConstraintsSubtrees:
      type: object
      description: One polarity (permitted or excluded) of RFC 5280 name-constraint subtrees.
      properties:
        dns: { type: array, items: { type: string }, description: "DNS subtrees, e.g. internal.example.com (matches subdomains)." }
        ip: { type: array, items: { type: string }, description: "IP subtrees in CIDR, e.g. 10.0.0.0/8." }
        email: { type: array, items: { type: string }, description: "rfc822 subtrees: a host, a .domain, or a full mailbox." }
        uri: { type: array, items: { type: string }, description: "URI host subtrees (domain rules as DNS)." }
        dir_names: { type: array, items: { type: string }, description: "directoryName subtrees as RFC 4514 DNs, e.g. O=Acme,C=US." }

    NameConstraintsConfig:
      type: object
      description: >
        RFC 5280 Name Constraints (2.5.29.30) applied to a CA certificate,
        bounding the identities certificates below it may assert. Enforced as a
        fail-closed pre-issuance gate and by conforming path validators.
      properties:
        permitted: { $ref: "#/components/schemas/NameConstraintsSubtrees" }
        excluded: { $ref: "#/components/schemas/NameConstraintsSubtrees" }
        critical: { type: boolean, description: "Extension criticality (default true, as RFC 5280 requires)." }

    CertPolicyConfig:
      type: object
      description: RFC 5280 certificate-policy family (2.5.29.32/.33/.36) for a CA certificate.
      properties:
        oids: { type: array, items: { type: string }, description: "Policy OIDs (dotted, or 'anyPolicy')." }
        cps: { type: string, description: "CPS URI qualifier applied to every listed policy." }
        critical: { type: boolean, description: "Mark certificatePolicies critical (rarely needed)." }
        mappings: { type: array, items: { type: string }, description: "Policy mappings as issuerOID:subjectOID." }
        require_explicit_policy: { type: integer, description: "policyConstraints requireExplicitPolicy skipCerts." }
        inhibit_policy_mapping: { type: integer, description: "policyConstraints inhibitPolicyMapping skipCerts." }

    CA:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, description: Owning tenant (isolation boundary). }
        parent_id: { type: string }
        label: { type: string }
        pkcs11_uri: { type: string }
        key_type: { type: string }
        public_key: { type: string }
        default_ssh_restriction_set_id: { type: string }
        default_x509_restriction_set_id: { type: string }
        created_at: { type: string, format: date-time }
        certificate: { type: string, description: PEM X.509 CA certificate }
        subject: { type: string }
        serial: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        max_path_len: { type: integer }
        status:
          type: string
          enum: [active, superseded, retired, pending]
          description: >-
            Lifecycle state. "pending" marks an externally-signed CA whose key
            and CSR exist but whose certificate has not been imported yet.
        csr:
          type: string
          description: >-
            Stored PKCS#10 CSR (PEM) of a CA created for external signing;
            empty for locally signed CAs.
        external_chain:
          type: string
          description: >-
            Imported external issuing chain (PEM bundle up to the external
            root) served after the CA's own certificate in its chain.

    CreateCARequest:
      type: object
      required: [label, key_type]
      properties:
        label: { type: string }
        tenant_id: { type: string, description: "Owning tenant (default: the built-in default tenant). Ignored when parent_id is set, which inherits the parent's tenant." }
        parent_id: { type: string }
        pkcs11_uri: { type: string }
        key_type: { type: string }
        public_key: { type: string }

    CAInitRootRequest:
      type: object
      required: [label, key_type, subject]
      properties:
        label: { type: string }
        tenant_id: { type: string, description: "Owning tenant for the root and its entire subtree (default: the built-in default tenant)." }
        key_type: { type: string, description: "e.g. ecdsa-p256, rsa-3072, ed25519" }
        subject: { $ref: "#/components/schemas/CASubject" }
        validity_days: { type: integer }
        max_path_len: { type: integer }
        name_constraints: { $ref: "#/components/schemas/NameConstraintsConfig" }
        policies: { $ref: "#/components/schemas/CertPolicyConfig" }

    Tenant:
      type: object
      properties:
        id: { type: string }
        slug: { type: string, description: URL/CLI-friendly unique identifier. }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        kek_label: { type: string, description: Optional per-tenant secret KEK. }
        created_at: { type: string, format: date-time }
        quotas: { $ref: "#/components/schemas/TenantQuotas" }

    TenantQuotas:
      type: object
      description: >-
        Per-tenant consumption ceilings. Zero (or omitted) means unlimited for
        that dimension. Daily quotas meter per UTC day and reset at UTC
        midnight; exhaustion is reported as HTTP 429 with code quota_exceeded
        and, for daily windows, a Retry-After header.
      properties:
        max_certs_per_day:
          type: integer
          format: int64
          description: Max certificates issued per UTC day (X.509 and SSH), across all the tenant's CAs and every enrollment protocol.
        max_active_certs:
          type: integer
          format: int64
          description: Ceiling on unexpired, unrevoked X.509 certificates; revocation or expiry frees room.
        max_secret_ops_per_day:
          type: integer
          format: int64
          description: Max envelope encrypt/decrypt operations per UTC day.
        rate_limit_per_second:
          type: number
          format: double
          description: Per-tenant request rate override for public enrollment endpoints (0 inherits rate_limit.per_tenant).
        rate_limit_burst:
          type: number
          format: double
          description: Burst capacity accompanying rate_limit_per_second.

    CreateTenantRequest:
      type: object
      required: [slug]
      properties:
        slug: { type: string, description: "URL/CLI-friendly unique identifier ([a-z0-9-])." }
        name: { type: string }
        kek_label: { type: string }

    UpdateTenantRequest:
      type: object
      description: >-
        Partial update: absent fields are left unchanged. quotas, when present,
        replaces the whole quota set.
      properties:
        name: { type: string }
        kek_label: { type: string }
        quotas: { $ref: "#/components/schemas/TenantQuotas" }

    TenantStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended] }

    APIToken:
      type: object
      description: >-
        A native scoped API token / service account. The opaque secret is never
        included here — only in the create response, once.
      properties:
        id: { type: string }
        tenant_id: { type: string, description: "Owning tenant (the scope for a tenant-scoped token)." }
        name: { type: string }
        description: { type: string }
        prefix: { type: string, description: "Non-secret leading fragment (secsy_pat_…) for recognition in listings." }
        roles:
          type: array
          items: { type: string, enum: [admin, issuer, signer, auditor, approver] }
          description: RBAC roles the token grants.
        scope: { type: string, enum: [tenant, platform], description: "tenant = roles apply within tenant_id; platform = cross-tenant." }
        created_by: { type: string }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "Absent when the token never expires." }
        last_used_at: { type: string, format: date-time }
        last_used_ip: { type: string }
        revoked_at: { type: string, format: date-time }
        revoked_by: { type: string }

    APITokenWithSecret:
      allOf:
        - { $ref: "#/components/schemas/APIToken" }
        - type: object
          properties:
            secret:
              type: string
              description: >-
                The opaque bearer secret (secsy_pat_…), returned exactly once at
                creation and never recoverable. Present it as
                "Authorization: Token <secret>".

    CreateTokenRequest:
      type: object
      required: [name, roles]
      properties:
        name: { type: string, description: Human-readable token name. }
        description: { type: string }
        roles:
          type: array
          items: { type: string, enum: [admin, issuer, signer, auditor, approver] }
          description: RBAC roles to grant (at least one).
        tenant_id: { type: string, description: "Owning tenant id or slug for a tenant-scoped token (default: the default tenant)." }
        scope: { type: string, enum: [tenant, platform], default: tenant }
        expires_in_days:
          type: integer
          description: >-
            Days until expiry. Omit for the policy default; 0 means never
            (only permitted when no maximum lifetime is configured).

    TenantUsageDay:
      type: object
      description: One UTC day's accounted consumption.
      properties:
        day: { type: string, description: "UTC date, YYYY-MM-DD." }
        certs_issued: { type: integer, format: int64 }
        certs_revoked: { type: integer, format: int64 }
        secret_ops: { type: integer, format: int64 }

    TenantUsageReport:
      type: object
      description: >-
        Point-in-time inventory counts plus a rolling window of daily usage
        accounting for one tenant.
      properties:
        tenant_id: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended] }
        active_certs:
          type: integer
          format: int64
          description: Unexpired, unrevoked X.509 certificates across the tenant's CAs.
        total_issued: { type: integer, format: int64 }
        total_revoked: { type: integer, format: int64 }
        cas: { type: integer }
        today: { $ref: "#/components/schemas/TenantUsageDay" }
        days:
          type: array
          description: Rolling usage window, most recent day first; days without activity are zero rows.
          items: { $ref: "#/components/schemas/TenantUsageDay" }
        quotas: { $ref: "#/components/schemas/TenantQuotas" }
        generated_at: { type: string, format: date-time }

    CAIssueIntermediateRequest:
      type: object
      required: [label, key_type, subject]
      properties:
        parent_id: { type: string }
        label: { type: string }
        key_type: { type: string }
        subject: { $ref: "#/components/schemas/CASubject" }
        validity_days: { type: integer }
        max_path_len: { type: integer }
        name_constraints: { $ref: "#/components/schemas/NameConstraintsConfig" }
        policies: { $ref: "#/components/schemas/CertPolicyConfig" }

    CAExternalCSRRequest:
      type: object
      required: [label, key_type, subject]
      properties:
        label: { type: string }
        tenant_id: { type: string, description: "Owning tenant (default: the built-in default tenant)." }
        key_type: { type: string, description: "Classical key types only (e.g. ecdsa-p384, rsa-3072); the external parent signs with classical tooling." }
        subject: { $ref: "#/components/schemas/CASubject" }
        max_path_len:
          type: integer
          description: >-
            Path-length constraint requested in the CSR's basicConstraints
            attribute; the external parent may override it.

    CAExternalCSRResponse:
      type: object
      properties:
        ca: { $ref: "#/components/schemas/CA" }
        csr_pem: { type: string, description: PKCS#10 CSR (PEM) to submit to the external parent. }

    CAImportCertRequest:
      type: object
      required: [certificate_pem]
      properties:
        certificate_pem:
          type: string
          description: >-
            The externally signed CA certificate (PEM). Extra certificates in a
            bundle are treated as chain material.
        chain_pem:
          type: string
          description: >-
            External issuing chain (PEM bundle: intermediates and root) used to
            verify the certificate and then served with the CA's chain.
        replace:
          type: boolean
          description: >-
            Permit re-importing onto an already-active externally-signed CA — a
            renewed certificate for the same key, or adding the chain later.

    CAImportCertResponse:
      type: object
      properties:
        ca: { $ref: "#/components/schemas/CA" }
        warnings:
          type: array
          items: { type: string }
          description: Non-fatal validation findings the operator should review.
        chain_pem:
          type: string
          description: The combined chain now served for the CA (own certificate + external parents).

    CACrossSignRequest:
      type: object
      description: >
        A cross-sign request. Provide exactly one subject source: subject_ca_id
        (a CA in this deployment), certificate_pem (an external certificate), or
        csr_pem (an external CSR).
      properties:
        subject_ca_id:
          type: string
          description: Local CA id (or label) to cross-sign.
        certificate_pem:
          type: string
          description: PEM certificate to cross-sign (external subject).
        csr_pem:
          type: string
          description: PEM CSR to cross-sign (external subject).
        validity_days:
          type: integer
          description: >
            Cross-signed certificate validity. Omitted reuses a certificate/local
            subject's own span (required for a CSR subject). Always clamped to the
            issuer's expiry.
        max_path_len:
          type: integer
          description: Path-length override; omitted preserves the subject's constraint.

    CrossSign:
      type: object
      description: A persisted cross-signing relationship.
      properties:
        id: { type: string }
        tenant_id: { type: string }
        issuer_ca_id: { type: string }
        subject_ca_id: { type: string, nullable: true }
        subject_key_id:
          type: string
          description: Hex Subject Key Identifier grouping every certificate for this subject key.
        subject: { type: string }
        serial: { type: string }
        certificate: { type: string, description: PEM cross-signed certificate }
        not_before: { type: string }
        not_after: { type: string }
        source:
          type: string
          enum: [local-ca, certificate, csr]
        status:
          type: string
          enum: [active, revoked]
        requested_by: { type: string }
        created_at: { type: string }

    CrossSignResult:
      type: object
      properties:
        cross_sign: { $ref: "#/components/schemas/CrossSign" }
        certificate_pem: { type: string, description: PEM cross-signed certificate }
        chain_pem:
          type: string
          description: Alternate chain (cross-certificate + issuer chain to its anchor).

    AlternateChain:
      type: object
      description: One publishable trust path for a subject CA.
      properties:
        cross_sign_id:
          type: string
          description: Empty for the native (parent-lineage) chain.
        issuer_ca_id: { type: string }
        issuer_label: { type: string }
        native:
          type: boolean
          description: Whether this is the subject's own parent-lineage chain.
        pem: { type: string, description: PEM chain bundle }

    RotationStatus:
      type: object
      description: An intermediate CA's key-rollover state.
      properties:
        ca: { $ref: "#/components/schemas/CA" }
        predecessor: { $ref: "#/components/schemas/CA" }
        successor: { $ref: "#/components/schemas/CA" }
        outstanding_leaves:
          type: integer
          description: Not-yet-expired, non-revoked leaves signed by this CA's key.
        retire_after:
          type: string
          format: date-time
          description: Recorded safe-to-retire deadline for a superseded key.
        safe_to_retire:
          type: boolean
          description: Whether a superseded key can be retired now.

    RotateCARequest:
      type: object
      description: >-
        All fields optional: an empty new_label derives one from the old CA's
        label, an empty key_type reuses the old key's algorithm, and zero
        validity_days reuses the old certificate's validity span.
      properties:
        new_label: { type: string }
        key_type: { type: string }
        validity_days: { type: integer }

    RotateCAResponse:
      type: object
      properties:
        old_ca: { $ref: "#/components/schemas/CA" }
        new_ca: { $ref: "#/components/schemas/CA" }
        combined_chain_pem:
          type: string
          description: Overlap bundle covering both intermediates plus the parent chain.
        retire_after: { type: string, format: date-time }

    RetireCARequest:
      type: object
      properties:
        reason:
          type: string
          description: RFC 5280 revocation reason; empty defaults to cessationOfOperation.
        force:
          type: boolean
          description: Retire even while leaves signed by the old key are still valid.

    RetireCAResponse:
      type: object
      properties:
        retired_ca: { $ref: "#/components/schemas/CA" }
        parent_id: { type: string }
        revoked_serial: { type: string }
        crl_pem:
          type: string
          description: Freshly generated parent CRL (PEM) listing the retired intermediate.
        outstanding_leaves: { type: integer }

    LintRequest:
      type: object
      required: [certificate]
      properties:
        certificate: { type: string, description: PEM-encoded certificate to lint }
        profile:
          type: string
          description: Apply the named profile's lint policy; empty lints against the baseline rules.
        public:
          type: boolean
          description: Apply the CA/Browser-Forum public-trust rules.
        mode:
          type: string
          enum: [enforce, warn]
          description: Override the enforcement mode of every check.
        max_validity_days: { type: integer }

    LintFinding:
      type: object
      properties:
        code: { type: string }
        mode: { type: string, enum: [enforce, warn] }
        description: { type: string }

    LintResponse:
      type: object
      properties:
        subject: { type: string }
        serial: { type: string }
        not_after: { type: string }
        mode: { type: string }
        public: { type: boolean }
        pass: { type: boolean }
        errors: { type: integer }
        warnings: { type: integer }
        summary: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/LintFinding" }

    ProviderKeyEntry:
      type: object
      properties:
        label: { type: string }
        key_type: { type: string }
        extractable:
          type: boolean
          description: Whether the private key may be read off the backend (must be false for HSM keys).
        sensitive: { type: boolean }
        ca_label:
          type: string
          description: The CA bound to this key; empty for KEK/TSA/signing keys.

    KeyInventoryResponse:
      type: object
      properties:
        provider: { type: string }
        keys:
          type: array
          items: { $ref: "#/components/schemas/ProviderKeyEntry" }
        extractable_count: { type: integer }
        unbound_count: { type: integer }

    Profile:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        key_usages:
          type: array
          items: { type: string }
        ext_key_usages:
          type: array
          items: { type: string }
        default_validity_days: { type: integer }
        max_validity_days: { type: integer }
        is_ca: { type: boolean }
        max_path_len: { type: integer }
        require_approval:
          type: boolean
          description: >-
            When true, operator/API issuance under this profile is routed through
            the four-eyes manual approval gate (Task 84) instead of issuing
            immediately. Automated protocol flows (ACME/EST/SCEP/CMP) bypass it.

    IssueCertRequest:
      type: object
      required: [csr]
      properties:
        csr: { type: string, description: PEM PKCS#10 CSR }
        profile: { type: string }
        validity_days: { type: integer }

    IssueCertResponse:
      type: object
      properties:
        certificate: { type: string, description: PEM leaf certificate }
        chain: { type: string }
        serial: { type: string }
        profile: { type: string }
        not_before: { type: string }
        not_after: { type: string }
        ct:
          $ref: "#/components/schemas/CTResponse"
          description: >-
            Certificate Transparency (RFC 6962) handling for this issuance.
            Present only when the profile requested CT.

    ExportPKCS12Request:
      type: object
      required: [password]
      description: >
        Server-side key generation + PKCS#12 export. A subject keypair is
        generated, a leaf is issued under the profile, and the key + leaf + full
        chain are packed into a password-protected bundle. A common name or at
        least one SAN is required.
      properties:
        common_name: { type: string }
        organization: { type: string }
        organizational_unit: { type: string }
        country: { type: string }
        province: { type: string }
        locality: { type: string }
        dns_names: { type: array, items: { type: string } }
        ip_addresses: { type: array, items: { type: string } }
        emails: { type: array, items: { type: string }, description: e-mail SANs (S/MIME) }
        uris: { type: array, items: { type: string } }
        profile: { type: string }
        key_type: { type: string, enum: [ecdsa, rsa], description: "subject key type (default: ecdsa)" }
        key_bits: { type: integer, description: "RSA bits or ECDSA curve size (256|384|521); 0 = default" }
        validity_days: { type: integer }
        password: { type: string, description: protects the bundle (minimum 6 characters) }
        encoder: { type: string, enum: [modern, legacy, legacyrc2], description: "PKCS#12 encoder (default: modern)" }
        escrow: { type: boolean, description: escrow the subject key under the M-of-N policy }

    ExportPKCS12Response:
      type: object
      properties:
        serial: { type: string }
        profile: { type: string }
        not_after: { type: string }
        pkcs12: { type: string, description: base64-encoded DER PKCS#12 bundle }
        chain: { type: string, description: PEM certificate chain (leaf + issuers) }
        key_type: { type: string }
        encoder: { type: string }
        escrow:
          $ref: "#/components/schemas/PKCS12EscrowInfo"
          description: Present only when escrow was requested.
        ct:
          $ref: "#/components/schemas/CTResponse"
          description: Present only when the profile requested CT.

    PKCS12EscrowInfo:
      type: object
      description: Escrow of a PKCS#12 subject key, with the envelope to retain for recovery.
      properties:
        threshold: { type: integer }
        agents: { type: integer }
        context: { type: string, description: encryption context to supply at recovery time }
        envelope: { description: escrow envelope JSON to store for break-glass recovery }

    SVIDRequest:
      type: object
      required: [csr]
      description: >
        A SPIFFE X.509-SVID request. Provide the identity either as a full
        spiffe_id or as trust_domain + path. Only the CSR's public key is used;
        its subject and SANs are ignored.
      properties:
        csr: { type: string, description: PEM PKCS#10 CSR (public-key source) }
        spiffe_id: { type: string, description: "full spiffe:// URI (overrides trust_domain/path)" }
        trust_domain: { type: string, description: "SPIFFE trust domain, e.g. example.org" }
        path: { type: string, description: "workload path, e.g. /ns/prod/sa/web" }
        profile: { type: string, description: "SVID profile (default: spiffe-svid)" }
        ttl_seconds: { type: integer, description: "validity override in seconds (clamped to profile max)" }
        dns_names:
          type: array
          items: { type: string }
          description: optional additional SANs (discouraged by the SVID spec)

    SVIDResponse:
      type: object
      properties:
        spiffe_id: { type: string }
        trust_domain: { type: string }
        certificate: { type: string, description: PEM leaf SVID }
        chain: { type: string, description: leaf + issuer chain (PEM) }
        bundle: { type: string, description: SPIFFE trust bundle (JWKS JSON) }
        serial: { type: string }
        profile: { type: string }
        not_before: { type: string }
        not_after: { type: string }

    CTResponse:
      type: object
      description: Certificate Transparency outcome for an issuance.
      properties:
        enabled: { type: boolean, description: whether the profile requested CT }
        embedded: { type: boolean, description: whether an SCT list was embedded }
        sct_count: { type: integer, description: number of embedded SCTs }
        status: { type: string, enum: [none, submitted, failed_open] }
        logs:
          type: array
          items: { $ref: "#/components/schemas/CTLogOutcome" }

    CTLogOutcome:
      type: object
      description: Per-log result of a precertificate submission.
      properties:
        log: { type: string, description: configured log name }
        ok: { type: boolean }
        error: { type: string, description: failure detail when ok is false }

    RenewCertRequest:
      type: object
      required: [serial]
      properties:
        serial: { type: string }
        csr: { type: string, description: "optional: rekey with a new CSR" }
        validity_days: { type: integer }

    RevokeCertRequest:
      type: object
      required: [serial]
      properties:
        serial: { type: string }
        reason: { type: string, description: RFC 5280 reason name }

    RevokeResult:
      type: object
      properties:
        status: { type: string, enum: [revoked, already-revoked] }
        serial: { type: string }

    HoldResult:
      type: object
      description: Outcome of a certificate suspend (hold) or release.
      properties:
        status: { type: string, enum: [held, already-held, released] }
        serial: { type: string }

    BulkRevokeFilter:
      type: object
      description: >
        Selection filters for a bulk revocation; set fields AND together. A
        zero filter selects every not-yet-revoked, unexpired certificate of
        the CA (the CA-key-compromise case).
      properties:
        profile: { type: string, description: Only certificates issued under this profile. }
        pattern: { type: string, description: Case-insensitive glob matched against the CN and every SAN. }
        issued_after: { type: string, format: date-time, description: Only certificates with NotBefore at/after this time. }
        issued_before: { type: string, format: date-time, description: Only certificates with NotBefore at/before this time. }
        serials:
          type: array
          items: { type: string }
          description: >
            Restrict to these serials (decimal strings). Serials unknown to
            the inventory are still revoked, as bare CRL entries.
        include_expired: { type: boolean, description: Also revoke certificates past their NotAfter. }

    BulkRevokeRequest:
      type: object
      properties:
        dry_run: { type: boolean, description: Compute and return the plan without revoking anything. }
        reason: { type: string, description: RFC 5280 reason name applied to every certificate (default unspecified). }
        filter: { $ref: "#/components/schemas/BulkRevokeFilter" }
        confirm_count:
          type: integer
          description: >
            The dry-run total the operator confirmed. Required unless
            dry_run; must match the recomputed selection exactly (409
            otherwise).
        operation_id: { type: string, description: Correlates audit events across resumed runs (generated when empty). }
        batch_size: { type: integer, description: Certificates revoked per store transaction (bounded server-side). }

    BulkRevokeSampleEntry:
      type: object
      properties:
        serial: { type: string }
        common_name: { type: string }
        profile: { type: string }
        not_after: { type: string, format: date-time }
        known: { type: boolean, description: False for a serial-list entry with no inventory row. }

    BulkRevokePlan:
      type: object
      description: Dry-run preview of a bulk revocation.
      properties:
        operation_id: { type: string }
        ca_id: { type: string }
        ca_label: { type: string }
        reason: { type: string }
        filter: { type: string, description: Human-readable rendering of the applied filters. }
        total: { type: integer, description: Certificates the operation will revoke (the count to confirm). }
        known: { type: integer, description: Inventory-backed certificates in the selection. }
        unknown: { type: integer, description: Serial-list entries with no inventory row (revoked as bare CRL entries). }
        already_revoked: { type: integer, description: Listed serials skipped because they are already revoked. }
        filtered_out: { type: integer, description: Listed serials present in the inventory but excluded by the other filters. }
        expired_excluded: { type: integer, description: Matching certificates skipped as expired (include_expired off). }
        sample:
          type: array
          items: { $ref: "#/components/schemas/BulkRevokeSampleEntry" }

    BulkRevokeResult:
      type: object
      description: Outcome of an executed bulk revocation.
      properties:
        operation_id: { type: string }
        ca_id: { type: string }
        reason: { type: string }
        planned: { type: integer }
        revoked: { type: integer, description: Certificates newly revoked by this run. }
        already_skipped: { type: integer, description: Planned serials revoked concurrently by another path. }
        batches: { type: integer }
        crl_scopes:
          type: array
          items: { type: string }
          description: CRL scopes (full, partition:N) whose base+delta pairs were regenerated.
        ocsp_invalidated: { type: integer }
        presign_refreshed: { type: integer, description: Pre-signed OCSP responses re-signed after the revocation. }
        presign_error: { type: string, description: Non-fatal presign-refresh failure, if any. }
        duration_seconds: { type: number }

    BulkRevokeConflict:
      type: object
      description: confirm_count did not match the live selection; nothing was revoked.
      properties:
        error: { type: string }
        confirm_count: { type: integer }
        actual_count: { type: integer }

    IssuedCertificate:
      type: object
      properties:
        id: { type: string }
        ca_id: { type: string }
        serial: { type: string }
        subject: { type: string }
        common_name: { type: string }
        sans:
          type: array
          items: { type: string }
        profile: { type: string }
        certificate: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        status: { type: string, enum: [valid, revoked, held, expired] }
        revoked_at: { type: string, format: date-time }
        revocation_reason: { type: integer }
        requested_by: { type: string }
        created_at: { type: string, format: date-time }
        ct_status:
          type: string
          enum: [none, submitted, failed_open]
          description: Certificate Transparency outcome for this certificate.
        sct_count: { type: integer, description: number of embedded SCTs }
        ct_logs:
          type: array
          items: { type: string }
          description: names of CT logs that returned an embedded SCT

    RevokedCertificate:
      type: object
      properties:
        ca_id: { type: string }
        serial: { type: string }
        revoked_at: { type: string, format: date-time }
        reason: { type: integer }

    IssuedCertificatePage:
      type: object
      description: One keyset page of issued certificates (Task 83).
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IssuedCertificate" }
        next_cursor:
          type: string
          description: Continuation token for the next page; empty on the last page.
        total:
          type: integer
          description: Number of certificates matching the filter across all pages.
        has_more:
          type: boolean
          description: True when further pages remain past this one.

    RevokedCertificatePage:
      type: object
      description: One keyset page of revocation records (Task 83).
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RevokedCertificate" }
        next_cursor: { type: string }
        total: { type: integer }
        has_more: { type: boolean }

    SignRequest:
      type: object
      required: [public_key]
      properties:
        ca_id: { type: string }
        public_key: { type: string, description: OpenSSH public key }
        principals:
          type: array
          items: { type: string }
        cert_type: { type: string, enum: [user, host] }
        key_id: { type: string }
        reason: { type: string }
        valid_after: { type: string }
        valid_before: { type: string }
        extensions:
          type: object
          additionalProperties: { type: string }
        critical_options:
          type: object
          additionalProperties: { type: string }

    SignResponse:
      type: object
      properties:
        certificate: { type: string }
        key_id: { type: string }

    X509SignRequest:
      type: object
      required: [csr]
      properties:
        ca_id: { type: string }
        csr: { type: string, description: PEM PKCS#10 CSR }
        valid_before: { type: string }
        reason: { type: string }

    X509SignResponse:
      type: object
      properties:
        certificate: { type: string }
        serial: { type: string }

    ParseCSRRequest:
      type: object
      required: [csr]
      properties:
        csr: { type: string }

    ParsedCSR:
      type: object
      properties:
        subject:
          type: object
          additionalProperties: { type: string }
        sans:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        public_key_algorithm: { type: string }

    Group:
      type: object
      properties:
        id: { type: string }
        name: { type: string }

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    AddGroupMemberRequest:
      type: object
      required: [user_sub]
      properties:
        user_sub: { type: string }

    PermissionEntry:
      type: object
      properties:
        id: { type: string }
        ca_id: { type: string }
        entity_type: { type: string, enum: [user, group] }
        entity_id: { type: string }
        permission: { $ref: "#/components/schemas/Permission" }
        ssh_restriction_set_id: { type: string }
        x509_restriction_set_id: { type: string }

    PermissionGrant:
      type: object
      required: [ca_id, entity_type, entity_id, permission]
      properties:
        ca_id: { type: string }
        entity_type: { type: string, enum: [user, group] }
        entity_id: { type: string }
        permission: { $ref: "#/components/schemas/Permission" }
        ssh_restriction_set_id: { type: string }
        x509_restriction_set_id: { type: string }

    Permission:
      type: string
      enum: [SIGN_CERTIFICATE, MANAGE_PERMISSIONS, CONFIGURE_CA]

    SetDefaultRestrictionSetRequest:
      type: object
      required: [type]
      properties:
        restriction_set_id: { type: string }
        type: { type: string, enum: [ssh, x509] }

    RestrictionSet:
      type: object
      properties:
        id: { type: string }
        ca_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [ssh, x509] }
        max_validity_secs: { type: integer, format: int64 }
        deny_all: { type: boolean }
        allowed_principals:
          type: array
          items: { type: string }
        allowed_cert_types:
          type: array
          items: { type: string }
        force_key_id_email: { type: boolean }
        require_reason: { type: boolean }
        allowed_extensions:
          type: array
          items: { type: string }
        deny_extensions: { type: boolean }
        deny_critical_options: { type: boolean }
        max_valid_after_offset: { type: integer, format: int64 }
        allowed_key_usages:
          type: array
          items: { type: string }
        allowed_ext_key_usages:
          type: array
          items: { type: string }
        allowed_san_types:
          type: array
          items: { type: string }
        allowed_san_patterns:
          type: array
          items: { type: string }
        allowed_subject_fields:
          type: array
          items: { type: string }
        max_path_length: { type: integer }
        deny_ca: { type: boolean }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        user_sub: { type: string }
        user_email: { type: string }
        user_name: { type: string }
        ca_id: { type: string }
        ca_label: { type: string }
        cert_format: { type: string, enum: [ssh, x509] }
        key_id: { type: string }
        cert_type: { type: string }
        principals:
          type: array
          items: { type: string }
        valid_after: { type: string, format: date-time }
        valid_before: { type: string, format: date-time }
        extensions:
          type: object
          additionalProperties: { type: string }
        critical_options:
          type: object
          additionalProperties: { type: string }
        public_key: { type: string }
        certificate: { type: string }
        restriction_set_id: { type: string }
        serial: { type: string }

    AuditLogPage:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    AccessLogEntry:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        user_sub: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        ip: { type: string }
        request_id: { type: string }

    AccessLogPage:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AccessLogEntry" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    Event:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        id: { type: string }
        timestamp: { type: string, format: date-time }
        actor: { type: string }
        actor_name: { type: string }
        actor_roles: { type: string }
        action: { type: string }
        target: { type: string }
        target_name: { type: string }
        result: { type: string, enum: [success, denied, error] }
        detail: { type: string }
        ip: { type: string }
        request_id: { type: string }
        prev_hash: { type: string }
        hash: { type: string }

    EventPage:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    EventVerifyResult:
      type: object
      properties:
        valid: { type: boolean }
        count: { type: integer }
        broken_seq: { type: integer, format: int64 }
        detail: { type: string }

    ApprovalDecision:
      type: object
      description: One approver's vote on a request.
      properties:
        approver: { type: string }
        approver_name: { type: string }
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string }
        created_at: { type: string, format: date-time }

    PendingApproval:
      type: object
      description: >-
        A four-eyes / maker-checker approval request. The guarded operation is
        held until required_approvals DISTINCT approvers (never the requester)
        sign off, then re-running it consumes the approval (status executed).
      properties:
        id: { type: string }
        tenant_id: { type: string }
        operation_class:
          type: string
          description: The guarded operation family.
          enum: [ca.create, ca.rotate, ca.retire, profile.change, revocation.bulk, escrow.policy, secret.kek_rotate, cert.issue]
        resource_key: { type: string }
        resource_name: { type: string }
        fingerprint:
          type: string
          description: Pins the exact operation parameters an approval authorizes.
        summary: { type: string }
        details: { type: string }
        requested_by: { type: string }
        requested_by_name: { type: string }
        required_approvals: { type: integer }
        approvals_count:
          type: integer
          description: Running number of distinct approvers so far.
        status: { type: string, enum: [pending, approved, rejected, executed, expired] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        executed_at: { type: string, format: date-time }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/ApprovalDecision" }

    ApprovalList:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the approval gate is enabled in configuration.
        requests:
          type: array
          items: { $ref: "#/components/schemas/PendingApproval" }

    PendingIssuanceResponse:
      type: object
      description: >-
        Returned (202) when leaf issuance is held for four-eyes approval (Task 84).
        No certificate was issued; fetch it from certificate_url once approved.
      properties:
        status: { type: string, example: pending_approval }
        approval_id: { type: string }
        required_approvals: { type: integer }
        approvals_count: { type: integer }
        certificate_url:
          type: string
          description: Where to fetch the certificate once the request is approved.
        message: { type: string }
        approval: { $ref: "#/components/schemas/PendingApproval" }

    ApprovalDecisionRequest:
      type: object
      properties:
        comment: { type: string }

    ACMEIdentifier:
      type: object
      properties:
        type: { type: string, enum: [dns, ip] }
        value: { type: string }

    ACMEAccount:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        contacts:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    ACMEOrder:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/ACMEIdentifier" }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        expires: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ACMEDirectory:
      type: object
      properties:
        newNonce: { type: string }
        newAccount: { type: string }
        newOrder: { type: string }
        revokeCert: { type: string }
        keyChange: { type: string }
        meta:
          type: object
          properties:
            termsOfService: { type: string }
            externalAccountRequired: { type: boolean }

    CertItem:
      type: object
      properties:
        ca_id: { type: string }
        ca_label: { type: string }
        serial: { type: string }
        common_name: { type: string }
        subject: { type: string }
        profile: { type: string }
        not_after: { type: string, format: date-time }
        expires_in_seconds: { type: integer, format: int64 }
        expires_in: { type: string }
        severity: { type: string, enum: [ok, warning, critical, expired] }
        superseded: { type: boolean }
        renewed: { type: boolean }
        new_serial: { type: string }
        renew_error: { type: string }

    ExpiryReport:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        warning_days: { type: integer }
        critical_days: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }
        total: { type: integer }
        certificates:
          type: array
          items: { $ref: "#/components/schemas/CertItem" }

    ScanRequest:
      type: object
      properties:
        ca_id: { type: string }
        auto_renew: { type: boolean }

    ScanReport:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        counts:
          type: object
          additionalProperties: { type: integer }
        renewed: { type: integer }
        renew_failed: { type: integer }
        total: { type: integer }
        certificates:
          type: array
          items: { $ref: "#/components/schemas/CertItem" }

    DiscoveredCertificate:
      type: object
      description: A certificate observed on an external TLS endpoint by the discovery scanner.
      properties:
        id: { type: string }
        tenant_id: { type: string }
        endpoint: { type: string, description: "host:port scanned" }
        server_name: { type: string, description: "SNI presented" }
        subject: { type: string }
        common_name: { type: string }
        sans: { type: array, items: { type: string } }
        issuer: { type: string }
        serial: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        key_algorithm: { type: string }
        key_size: { type: integer }
        signature_algorithm: { type: string }
        chain_length: { type: integer }
        chain_complete: { type: boolean }
        fingerprint: { type: string, description: "sha256 hex of the leaf DER" }
        certificate: { type: string, description: "PEM-encoded leaf" }
        issued_by_pki: { type: boolean }
        rogue: { type: boolean, description: "served leaf NOT issued by this PKI" }
        self_signed: { type: boolean }
        weak_key: { type: boolean }
        sha1_signature: { type: boolean }
        hostname_mismatch: { type: boolean }
        expiring_soon: { type: boolean }
        severity: { type: string, enum: [ok, warning, critical] }
        flags: { type: array, items: { type: string } }
        discovered_at: { type: string, format: date-time }

    DiscoveredCertificateList:
      type: object
      description: >-
        One keyset page of the discovered-certificate inventory (Task 83). The
        "certificates" field is a backward-compatible alias of "items".
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredCertificate" }
        next_cursor: { type: string }
        has_more: { type: boolean }
        total: { type: integer }
        certificates:
          type: array
          description: Deprecated alias of items, retained for older clients.
          items: { $ref: "#/components/schemas/DiscoveredCertificate" }

    DiscoveryScanRequest:
      type: object
      properties:
        targets:
          type: array
          items: { type: string }
          description: "host[:port][#sni] endpoints; falls back to configured targets when empty."
        cidrs:
          type: array
          items: { type: string }
          description: "CIDR ranges to expand into targets on the default port."
        expiry_days: { type: integer, description: "Override the expiring-soon window (0 uses the configured/default)." }
        store: { type: boolean, description: "Record findings into the discovered-certificate inventory." }
        notify: { type: boolean, description: "Dispatch flagged findings through the monitor notification sinks." }

    DiscoveryFinding:
      allOf:
        - $ref: "#/components/schemas/DiscoveredCertificate"
        - type: object
          properties:
            reachable: { type: boolean }
            error: { type: string }
            expires_in_days: { type: integer }

    DiscoveryScanReport:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        expiry_days: { type: integer }
        stored: { type: integer, description: "Number of findings persisted to the inventory." }
        counts:
          type: object
          additionalProperties: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryFinding" }

    CreateSSHCARequest:
      type: object
      required: [label]
      properties:
        label: { type: string, description: "CA label; doubles as the provider key label." }
        tenant_id: { type: string, description: "Owning tenant (default: the default tenant)." }
        key_type:
          type: string
          description: "Key-provider key type (default: ed25519)."
          example: ed25519

    SSHProfile:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        cert_type: { type: string, enum: [user, host] }
        default_validity_secs: { type: integer, format: int64 }
        max_validity_secs: { type: integer, format: int64 }
        allowed_principals:
          type: array
          items: { type: string }
          description: Glob patterns; empty permits any principal.
        allow_empty_principals: { type: boolean }
        max_principals: { type: integer }
        default_extensions:
          type: object
          additionalProperties: { type: string }
        allowed_extensions:
          type: array
          items: { type: string }
        default_critical_options:
          type: object
          additionalProperties: { type: string }
        allowed_critical_options:
          type: array
          items: { type: string }

    ArtifactSignRequest:
      type: object
      required: [signer]
      properties:
        signer:
          type: string
          description: Name of the configured signing identity.
        artifact:
          type: string
          description: The artifact bytes, base64-encoded. Mutually exclusive with digest.
        digest:
          type: string
          description: >-
            Hex digest of the artifact, computed with the signer's digest
            algorithm — signs artifacts too large to ship through the API.
            Mutually exclusive with artifact.
        timestamp:
          type: boolean
          description: >-
            Overrides the signer's timestamp-by-default setting: true embeds an
            RFC 3161 countersignature, false suppresses it. Omitted applies the
            signer's default.

    ArtifactSignResponse:
      type: object
      properties:
        signature:
          type: string
          description: DER CMS/PKCS#7 detached SignedData, base64-encoded.
        signature_pem:
          type: string
          description: The same signature as a PKCS7 PEM block, for file use.
        signer: { type: string }
        signer_certificate:
          type: string
          description: The code-signing certificate (PEM).
        digest_algorithm: { type: string, enum: [sha256, sha384, sha512] }
        digest:
          type: string
          description: Hex digest of the artifact the signature covers.
        timestamped: { type: boolean }
        timestamp_time:
          type: string
          format: date-time
          description: RFC 3161 token genTime (when timestamped).
        timestamp_serial:
          type: string
          description: RFC 3161 token serial (when timestamped).

    ArtifactVerifyRequest:
      type: object
      required: [signature]
      properties:
        signature:
          type: string
          description: The detached signature — base64 DER, or a PKCS7 PEM block.
        artifact:
          type: string
          description: The artifact bytes, base64-encoded. Mutually exclusive with digest.
        digest:
          type: string
          description: >-
            Hex digest of the artifact in the signature's digest algorithm.
            Mutually exclusive with artifact.
        ca_id:
          type: string
          description: >-
            Restrict trust anchors to this CA. Empty trusts every CA of the
            caller's tenants.
        require_timestamp:
          type: boolean
          description: Fail verification when no RFC 3161 countersignature is embedded.

    ArtifactVerifyResponse:
      type: object
      properties:
        valid: { type: boolean }
        reason:
          type: string
          description: Why verification failed (valid=false only).
        signer_subject: { type: string }
        signer_serial: { type: string }
        signer_certificate:
          type: string
          description: The signer certificate (PEM), on a valid signature.
        digest_algorithm: { type: string }
        digest: { type: string }
        timestamped: { type: boolean }
        timestamp_time: { type: string, format: date-time }
        timestamp_serial: { type: string }
        verified_at:
          type: string
          format: date-time
          description: >-
            The instant chain validity was evaluated at — the timestamp genTime
            when countersigned, else the wall clock.

    ArtifactSignerInfo:
      type: object
      properties:
        name: { type: string }
        subject: { type: string }
        serial: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        digest_algorithm: { type: string }
        timestamp_default: { type: boolean }
        tenant: { type: string }

    SSHSignRequest:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: authorized_keys line of the key to certify.
        cert_type: { type: string, enum: [user, host], default: user }
        profile:
          type: string
          description: "Signing profile (default: user-default / host-default by type)."
        key_id:
          type: string
          description: "Certificate key ID (default: the caller's subject)."
        principals:
          type: array
          items: { type: string }
          description: User names (user certs) or host names (host certs).
        validity_seconds:
          type: integer
          format: int64
          description: >-
            Requested lifetime; zero applies the profile default, values beyond
            the profile maximum are clamped.
        extensions:
          type: object
          additionalProperties: { type: string }
          description: Replaces the profile defaults; keys must be permitted.
        critical_options:
          type: object
          additionalProperties: { type: string }
          description: Replaces the profile defaults; keys must be permitted.

    SSHSignResponse:
      type: object
      properties:
        certificate:
          type: string
          description: authorized_keys line of the signed certificate (-cert.pub content).
        serial: { type: string }
        cert_type: { type: string, enum: [user, host] }
        key_id: { type: string }
        principals:
          type: array
          items: { type: string }
        profile: { type: string }
        valid_after: { type: string, format: date-time }
        valid_before: { type: string, format: date-time }
        ca_public_key:
          type: string
          description: The CA's authorized_keys line (the trust anchor).

    SSHRevokeRequest:
      type: object
      properties:
        serial:
          type: string
          description: Certificate serial to revoke (exactly one of serial/key_id).
        key_id:
          type: string
          description: Revoke every certificate bearing this key ID instead.
        reason: { type: string }

    SSHRevokeResponse:
      type: object
      properties:
        revoked: { type: boolean }
        newly_revoked:
          type: boolean
          description: False when the target was already revoked (reason/time updated).
        serial: { type: string }
        key_id: { type: string }
        revoked_at: { type: string, format: date-time }

    SSHCertificate:
      type: object
      properties:
        ca_id: { type: string }
        tenant_id: { type: string }
        serial: { type: string }
        cert_type: { type: string, enum: [user, host] }
        key_id: { type: string }
        principals:
          type: array
          items: { type: string }
        profile: { type: string }
        public_key_fingerprint: { type: string, description: "SHA256:… fingerprint of the certified key." }
        certificate: { type: string }
        valid_after: { type: string, format: date-time }
        valid_before: { type: string, format: date-time }
        status: { type: string, enum: [valid, revoked, expired] }
        issued_by: { type: string }
        created_at: { type: string, format: date-time }

    SSHRevocation:
      type: object
      properties:
        ca_id: { type: string }
        serial: { type: string, description: "Empty for key-ID revocations." }
        key_id: { type: string, description: "Empty for serial revocations." }
        reason: { type: string }
        revoked_by: { type: string }
        revoked_at: { type: string, format: date-time }

    SecretInfo:
      type: object
      properties:
        kek_label: { type: string }
        provider: { type: string }
        key_bits: { type: integer }
        wrap_alg: { type: string }
        data_alg: { type: string }
        version: { type: string }
        escrow_available:
          type: boolean
          description: Whether encrypt requests may ask for M-of-N key escrow.
        escrow_threshold:
          type: integer
          description: Recovery-agent quorum required to recover an escrowed key.
        escrow_agents:
          type: integer
          description: Number of configured recovery agents.

    EncryptRequest:
      type: object
      required: [plaintext]
      properties:
        plaintext: { type: string, description: base64-encoded plaintext }
        context: { type: string, description: base64-encoded optional AAD }
        escrow:
          type: boolean
          description: >-
            Additionally escrow the data key to the configured M-of-N recovery
            agents so it can be recovered under dual control. Requires
            secret.escrow to be configured; recovery itself is a CLI-only
            ceremony (secsy-secret recover).

    EncryptResponse:
      type: object
      properties:
        envelope:
          type: object
          additionalProperties: true
          description: Opaque versioned envelope document.

    DecryptRequest:
      type: object
      required: [envelope]
      properties:
        envelope:
          type: object
          additionalProperties: true
        context: { type: string, description: base64-encoded optional AAD }

    DecryptResponse:
      type: object
      properties:
        plaintext: { type: string, description: base64-encoded plaintext }

    HSMInfo:
      type: object
      properties:
        available: { type: boolean }
        version: { type: string }
        serial: { type: string }
        part_number: { type: string }
        log_used: { type: integer }
        force_audit: { type: boolean }
        audit_provisioned: { type: boolean }
        suppress_audit_warning: { type: boolean }
        error: { type: string }

    HSMAuditEntry:
      type: object
      properties:
        number: { type: integer }
        command: { type: integer }
        length: { type: integer }
        session_key: { type: integer }
        target_key: { type: integer }
        second_key: { type: integer }
        result: { type: integer }
        tick: { type: integer }
        hash: { type: string }
        sign_audit_id: { type: string }

    HSMAuditLog:
      type: object
      properties:
        device_serial: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/HSMAuditEntry" }

    CombinedAuditExport:
      type: object
      properties:
        device_serial: { type: string }
        hsm_entries:
          type: array
          items: { $ref: "#/components/schemas/HSMAuditEntry" }
        sign_operations:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        key_attestations:
          type: object
          additionalProperties: { type: string }

    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ready, not_ready] }
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              # up/down/skipped for dependency probes (database, hsm);
              # leader/follower for the informational "leadership" component,
              # which reports whether this replica runs the singleton
              # background jobs and never fails readiness.
              status: { type: string, enum: [up, down, skipped, leader, follower] }
              error: { type: string }
              detail: { type: string }
