openapi: "3.0.3"
info:
  title: Secsy PKI
  description: HSM-backed SSH Certificate Authority with OIDC authentication and publicly auditable signing logs.
  version: "1.0.0"
  license:
    name: MIT

servers:
  - url: /api

security:
  - basicAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CASubject:
      type: object
      required: [cn]
      description: Distinguished-name fields for a CA certificate
      properties:
        cn:
          type: string
          description: Common name (required)
        o:
          type: string
          description: Organization
        ou:
          type: string
          description: Organizational unit
        c:
          type: string
          description: Country
        st:
          type: string
          description: State / province
        l:
          type: string
          description: Locality

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK

  /auth/config:
    get:
      summary: OIDC discovery config
      security: []
      responses:
        "200":
          description: OIDC configuration

  /me:
    get:
      summary: Current user info
      responses:
        "200":
          description: User info with subject, email, name, is_root

  /cas:
    get:
      summary: List certificate authorities
      responses:
        "200":
          description: Array of CAs
    post:
      summary: Create a CA (omit pkcs11_uri to generate key on HSM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, key_type]
              properties:
                label:
                  type: string
                parent_id:
                  type: string
                pkcs11_uri:
                  type: string
                  description: Leave empty to generate key on HSM
                key_type:
                  type: string
                  enum: [ed25519, ecdsa-sha2-nistp256, ecdsa-sha2-nistp384, ecdsa-sha2-nistp521]
                public_key:
                  type: string
      responses:
        "201":
          description: CA created

  /ca/init-root:
    post:
      summary: Initialize a self-signed root CA (root only)
      description: >
        Generates a CA private key inside the configured key provider (HSM via
        PKCS#11, or the software keystore) and creates a self-signed root CA
        certificate whose signing operation is performed by the provider. The
        certificate and metadata (serial, subject, validity) are persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, key_type, subject]
              properties:
                label:
                  type: string
                  description: Key label / CA name (must be unique)
                key_type:
                  type: string
                  enum: [ed25519, ecdsa-sha2-nistp256, ecdsa-sha2-nistp384, ecdsa-sha2-nistp521, rsa-2048, rsa-4096]
                subject:
                  $ref: "#/components/schemas/CASubject"
                validity_days:
                  type: integer
                  description: Certificate lifetime in days (default 3650)
                max_path_len:
                  type: integer
                  description: Max intermediate CAs below this one (omit for unconstrained, 0 = leaf-only)
      responses:
        "201":
          description: Root CA created
        "400":
          description: Invalid request or duplicate label

  /ca/{id}/issue-intermediate:
    post:
      summary: Issue an intermediate CA under an existing CA (root only)
      description: >
        Generates an intermediate CA key inside the key provider and issues an
        intermediate certificate signed by the parent CA on the device. The
        intermediate's validity is clamped to the parent's expiry.
      parameters:
        - name: id
          in: path
          required: true
          description: Parent CA id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, key_type, subject]
              properties:
                label:
                  type: string
                key_type:
                  type: string
                  enum: [ed25519, ecdsa-sha2-nistp256, ecdsa-sha2-nistp384, ecdsa-sha2-nistp521, rsa-2048, rsa-4096]
                subject:
                  $ref: "#/components/schemas/CASubject"
                validity_days:
                  type: integer
                  description: Certificate lifetime in days (default 1825)
                max_path_len:
                  type: integer
      responses:
        "201":
          description: Intermediate CA created
        "400":
          description: Invalid request, unknown parent, or path-length violation

  /profiles:
    get:
      summary: List certificate profiles
      description: >
        Returns the built-in certificate profiles (server, client,
        server-client, code-signing, email). Each profile defines the key
        usages, extended key usages, and default/maximum validity applied when
        issuing an end-entity certificate.
      responses:
        "200":
          description: Array of profiles

  /ca/{id}/issue:
    post:
      summary: Issue an end-entity certificate from a CSR (requires SIGN_CERTIFICATE)
      description: >
        Signs a PKCS#10 CSR into an end-entity certificate under the named
        profile, using the CA's HSM-held key. The subject, public key, and SANs
        are taken from the CSR; key usage, extended key usage, and validity
        bounds come from the profile. The serial number is allocated atomically
        and the certificate is recorded for renewal/revocation.
      parameters:
        - name: id
          in: path
          required: true
          description: Issuing CA id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr]
              properties:
                csr:
                  type: string
                  description: PEM-encoded PKCS#10 certificate signing request
                profile:
                  type: string
                  description: Profile name (default "server")
                validity_days:
                  type: integer
                  description: Override validity in days (clamped to the profile max and CA expiry)
      responses:
        "201":
          description: Certificate issued (PEM leaf + chain + serial)
        "400":
          description: Invalid CSR, unknown profile, or non-CA target
        "403":
          description: Missing SIGN_CERTIFICATE permission

  /ca/{id}/renew:
    post:
      summary: Renew a previously issued certificate (requires SIGN_CERTIFICATE)
      description: >
        Reissues a certificate identified by serial with a fresh serial and
        validity window, reusing the original subject/SANs/profile (and public
        key, unless a new CSR is supplied). The original certificate is left
        intact and may be revoked separately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serial]
              properties:
                serial:
                  type: string
                  description: Serial of the certificate to renew (decimal)
                csr:
                  type: string
                  description: Optional PEM CSR to rekey the certificate
                validity_days:
                  type: integer
      responses:
        "201":
          description: Certificate renewed
        "400":
          description: Unknown serial or invalid request

  /ca/{id}/revoke:
    post:
      summary: Revoke a certificate by serial (requires SIGN_CERTIFICATE)
      description: >
        Records a revocation in the CA's revocation store. Revocation is
        idempotent; re-revoking a serial updates its reason. The revocation is
        published via the CRL and OCSP endpoints.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serial]
              properties:
                serial:
                  type: string
                  description: Serial to revoke (decimal)
                reason:
                  type: string
                  description: >
                    RFC 5280 reason name (unspecified, keyCompromise,
                    cACompromise, affiliationChanged, superseded,
                    cessationOfOperation, certificateHold, privilegeWithdrawn,
                    aACompromise). Default "unspecified".
      responses:
        "200":
          description: Revoked (or already-revoked)

  /ca/{id}/certificates:
    get:
      summary: List certificates issued by a CA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of issued certificate records

  /ca/{id}/revoked:
    get:
      summary: List a CA's revocation records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of revocation records

  /ca/{id}/crl:
    get:
      summary: Fetch a freshly generated CRL (public)
      description: >
        Generates and returns a signed X.509 v2 CRL covering all recorded
        revocations for the CA. Public — no authentication required. Returns DER
        (application/pkix-crl) by default, or PEM with ?format=pem.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [der, pem]
      responses:
        "200":
          description: DER or PEM CRL

  /ca/{id}/ocsp:
    post:
      summary: OCSP responder (public, RFC 6960)
      description: >
        Answers an OCSP request about a certificate issued by the CA. The
        request body is the DER-encoded OCSP request; the response is a signed
        DER OCSP response (application/ocsp-response). Public — no auth. A GET
        form with a base64-encoded request in the path is also supported.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/ocsp-request:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: DER-encoded OCSP response

  /cas/{id}:
    get:
      summary: Get a CA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CA details
    delete:
      summary: Delete a CA (root only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /cas/{id}/sign:
    post:
      summary: Sign an SSH certificate
      description: Returns existing certificate if the same public key was already signed by this CA.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key:
                  type: string
                cert_type:
                  type: string
                  enum: [user, host]
                  default: user
                key_id:
                  type: string
                reason:
                  type: string
                principals:
                  type: array
                  items:
                    type: string
                valid_after:
                  type: string
                valid_before:
                  type: string
                extensions:
                  type: object
                  additionalProperties:
                    type: string
                critical_options:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Signed certificate

  /cas/{id}/my-restrictions:
    get:
      summary: Get effective restriction set for current user on a CA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restriction set or null

  /groups:
    get:
      summary: List groups
      responses:
        "200":
          description: Array of groups
    post:
      summary: Create a group (root only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Group created

  /groups/{id}:
    delete:
      summary: Delete a group (root only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /groups/{id}/members:
    get:
      summary: List group members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of user subjects
    post:
      summary: Add group member (root only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_sub]
              properties:
                user_sub:
                  type: string
      responses:
        "200":
          description: Member added

  /groups/{id}/members/{sub}:
    delete:
      summary: Remove group member (root only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sub
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member removed

  /cas/{id}/permissions:
    get:
      summary: List permissions on a CA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of permission entries
    post:
      summary: Grant permission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id, permission]
              properties:
                entity_type:
                  type: string
                  enum: [user, group]
                entity_id:
                  type: string
                permission:
                  type: string
                  enum: [SIGN_CERTIFICATE, MANAGE_PERMISSIONS, CONFIGURE_CA]
                restriction_set_id:
                  type: string
      responses:
        "200":
          description: Permission granted
    delete:
      summary: Revoke permission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Permission revoked

  /cas/{id}/restriction-sets:
    get:
      summary: List restriction sets for a CA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of restriction sets
    post:
      summary: Create restriction set (requires CONFIGURE_CA)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                max_validity_secs:
                  type: integer
                allowed_principals:
                  type: array
                  items:
                    type: string
                allowed_cert_types:
                  type: array
                  items:
                    type: string
                force_key_id_email:
                  type: boolean
                  description: Force key ID to user email
                require_reason:
                  type: boolean
                  description: Require a reason (appended to key ID in parentheses)
                deny_extensions:
                  type: boolean
                allowed_extensions:
                  type: array
                  items:
                    type: string
                deny_critical_options:
                  type: boolean
                max_valid_after_offset:
                  type: integer
      responses:
        "201":
          description: Restriction set created

  /restriction-sets/{id}:
    put:
      summary: Update restriction set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete restriction set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /cas/{id}/default-restriction-set:
    put:
      summary: Set CA default restriction set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restriction_set_id:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated

  /audit-log:
    get:
      summary: Sign operations audit log
      parameters:
        - name: ca_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: export
          in: query
          schema:
            type: string
            enum: [json]
      responses:
        "200":
          description: Paginated audit log entries

  /access-log:
    get:
      summary: API access log
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: export
          in: query
          schema:
            type: string
            enum: [json]
      responses:
        "200":
          description: Paginated access log entries

  /hsm/info:
    get:
      summary: HSM device info and audit status
      description: Only available when YubiHSM is configured.
      responses:
        "200":
          description: Device info

  /hsm/attestation:
    get:
      summary: Export device attestation certificate (PEM)
      responses:
        "200":
          description: PEM certificate

  /hsm/audit-log:
    get:
      summary: HSM audit log entries from database
      responses:
        "200":
          description: HSM audit entries with hash chain verification

  /hsm/signed-audit-log:
    get:
      summary: Signed HSM audit log
      description: Signature over the last hash in the HSM's internal hash chain.
      responses:
        "200":
          description: Signed audit log JSON

  /hsm/combined-audit-log:
    get:
      summary: Combined log with sign operations and key attestations
      responses:
        "200":
          description: Combined audit log JSON

  /hsm/provision-audit:
    post:
      summary: Enable forced audit logging (irreversible)
      description: Requires factory reset first (device init entry at position 1).
      responses:
        "200":
          description: Provisioned
        "412":
          description: Device not factory reset

  /hsm/factory-reset:
    post:
      summary: Factory reset the YubiHSM
      description: Erases all keys and logs.
      responses:
        "200":
          description: Reset complete

  /secret/info:
    get:
      summary: KEK metadata for envelope encryption
      description: >
        Returns metadata about the configured key-encryption key (label,
        provider, key size, and algorithms). Only present when a KEK is
        configured (secret.kek_label).
      responses:
        "200":
          description: KEK metadata

  /secret/encrypt:
    post:
      summary: Encrypt a secret with HSM-backed envelope encryption
      description: >
        Generates a fresh AES-256 data key, seals the plaintext with
        AES-256-GCM, and wraps the data key with the HSM-held RSA KEK
        (RSA-OAEP). Returns a versioned, self-describing ciphertext envelope.
        Plaintext is capped at 64 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plaintext]
              properties:
                plaintext:
                  type: string
                  description: Base64-encoded plaintext secret
                context:
                  type: string
                  description: >
                    Optional base64-encoded encryption context bound into the
                    ciphertext; must be supplied verbatim to decrypt.
      responses:
        "200":
          description: Ciphertext envelope
        "400":
          description: Invalid request
        "413":
          description: Plaintext too large

  /secret/decrypt:
    post:
      summary: Decrypt an envelope back to plaintext
      description: >
        Unwraps the data key on the HSM (RSA-OAEP C_Decrypt) and opens the
        AES-256-GCM ciphertext. Returns a single generic error on any failure
        so the endpoint does not act as a padding/decryption oracle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope:
                  type: object
                  description: A version-1 ciphertext envelope
                context:
                  type: string
                  description: Base64-encoded encryption context, if one was bound at encryption time
      responses:
        "200":
          description: Base64-encoded plaintext
        "400":
          description: Decryption failed or invalid request
