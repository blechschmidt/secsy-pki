server:
  host: "0.0.0.0"
  port: 8443
  tls_cert: "certs/server.crt"
  tls_key: "certs/server.key"
  # ocsp_cache_ttl_seconds bounds how long a signed OCSP response is reused from
  # the in-memory cache before being re-signed on the HSM. 0 uses the server
  # default (1h); a negative value disables caching. Revocations invalidate the
  # affected entry immediately. See docs/benchmarks.md.
  ocsp_cache_ttl_seconds: 3600
  # OCSP responder hardening (RFC 6960 / RFC 8954). All fields are optional.
  ocsp:
    # Echo the request nonce in the signed response (bypasses the cache for
    # nonce-bearing requests). Defaults to true when omitted.
    nonce_enabled: true
    # Validity window for a nonce-bearing (freshly signed) response, in seconds.
    nonce_max_age_seconds: 60
    # Sign responses with a short-lived HSM-backed delegated OCSP-signing
    # certificate (id-kp-OCSPSigning + ocsp-nocheck) instead of the CA key.
    delegated: false
    delegated_validity_hours: 168          # 7 days
    delegated_key_type: "ecdsa-sha2-nistp256"
    # CA that issued this server's own TLS certificate; when set, the server
    # staples a fresh OCSP response to its TLS handshake (RFC 6066).
    staple_ca_id: ""

database:
  # driver: "sqlite" is the embedded, single-node "file" store (default).
  # For multi-replica high availability, point every replica at a shared
  # PostgreSQL instance:
  #   driver: "postgres"
  #   dsn: "postgres://secsy:secsy@db.internal:5432/secsy_pki?sslmode=require"
  # The connection-pool knobs below apply to PostgreSQL only; SQLite is pinned
  # to a single connection. Zero/omitted values select conservative defaults.
  driver: "sqlite"
  dsn: "secsy-pki.db"
  # max_open_conns: 10
  # max_idle_conns: 5
  # conn_max_lifetime_seconds: 1800
  # conn_max_idle_time_seconds: 300

oidc:
  issuer_url: "http://localhost:8080/realms/secsy-pki"
  client_id: "secsy-pki"

# auth configures strong operator authentication for the console/API (Task 50).
# Each sub-block is inert unless its `enabled` is set; the stateless basic-auth
# root and Bearer-token paths keep working regardless. See docs/authentication.md.
auth:
  session:
    # cookie_name overrides the session cookie name (default "secsy_session").
    # ttl_minutes bounds a session's absolute lifetime (default 60).
    ttl_minutes: 60
    # insecure drops the Secure cookie attribute — ONLY for local plaintext
    # testing; leave false in production so cookies are HTTPS-only.
    insecure: false
  oidc:
    # Interactive Authorization-Code login for the console. Inherits issuer_url /
    # client_id from the top-level oidc block when omitted here.
    enabled: false
    # client_secret authenticates a confidential client; omit for a public (PKCE)
    # client. redirect_url is this server's callback registered at the IdP.
    client_secret: ""
    redirect_url: "https://pki.example.com/auth/callback"
    scopes: ["openid", "profile", "email"]
    # groups_claim names the token claim carrying group memberships (default
    # "groups"); its values feed both the rbac group assignments and the mappings.
    groups_claim: "groups"
    # role_mappings map IdP claim values to RBAC roles, optionally per-tenant.
    role_mappings:
      - { claim: "groups", value: "pki-admins", roles: ["admin"] }
      - { claim: "groups", value: "pki-issuers", roles: ["issuer"] }
      # - { value: "acme-issuers", tenant: "acme-corp", roles: ["issuer"] }
    # allow_zero_role: false denies login to an operator that resolves to no role.
    allow_zero_role: false
  mtls:
    # Mutual-TLS client-certificate auth for machine/API callers. When enabled,
    # a client cert is requested and verified against ca_file; a presented cert
    # is bound to a principal by the bindings below.
    enabled: false
    ca_file: "certs/client-ca.pem"
    bindings:
      - { subject_cn: "build-robot", subject: "svc:build-robot", roles: ["issuer"] }
      # - { san_uri: "spiffe://example.org/ns/ops/sa/deployer", roles: ["admin"] }
  webauthn:
    # Passkey step-up for high-risk operations (revocation, CA ceremony,
    # cross-signing, factory reset). rp_id is the console's registrable domain.
    enabled: false
    rp_id: "pki.example.com"
    rp_name: "Secsy PKI"
    origins: ["https://pki.example.com"]
    step_up_ttl_minutes: 5
    # step_up_operations defaults to a safe set when omitted.
    step_up_operations: ["cert.revoke", "ca.init_root", "ca.issue_intermediate", "ca.cross_sign", "ca.manage", "hsm.factory_reset"]

root_user:
  username: "root"
  password: "change-me-in-production"

# key_provider selects the backend used to generate and sign with CA keys.
#   type: "pkcs11"  -> keys live on an HSM / PKCS#11 token (see the pkcs11 block)
#   type: "software" -> keys live in an on-disk keystore (see software.keystore_dir)
#   type: "kms"     -> keys live in a cloud KMS (AWS KMS / Azure Key Vault; see
#                      the kms block and docs/cloud-kms.md)
# If omitted, the type defaults to "pkcs11" when pkcs11.module_path is set, to
# "kms" when kms.backend is set, otherwise "software". These may be overridden by
# the SECSY_* environment variables emitted by scripts/setup-softhsm.sh --export-env.
key_provider:
  type: "pkcs11"
  software:
    keystore_dir: "keystore"
  # Cloud KMS backend. Credentials are never taken from config — they come from
  # the cloud SDK's default chain (AWS: env/instance role/IRSA; Azure: env/
  # workload/managed identity). See docs/cloud-kms.md for IAM/RBAC requirements.
  kms:
    backend: ""            # "aws" | "azure" | "fake" (empty disables the kms backend)
    region: ""             # AWS region, e.g. "eu-central-1" (AWS backend)
    key_prefix: "secsy/"   # namespaces this deployment's keys (AWS alias / Azure key name)
    vault_url: ""          # https://<vault>.vault.azure.net/ (Azure backend)
  # Optional per-role backend selection. Each role, when set, must name a
  # configured backend type ("pkcs11" | "software" | "kms"); unset falls back to
  # key_provider.type. OCSP follows the "ca" role (the CA manager owns its keys).
  roles:
    ca: ""                 # CA signing key + OCSP responder keys
    tsa: ""                # RFC 3161 TSA signing key

pkcs11:
  module_path: "/usr/lib/pkcs11/yubihsm_pkcs11.so"
  pin: "0001password"
  token_label: "YubiHSM"
  # session_pool_size bounds concurrent PKCS#11 sessions (and thus concurrent
  # on-device operations); requests beyond it queue. 0/omitted uses the default
  # (8). Size it toward the HSM's supported concurrent-session limit. See
  # docs/benchmarks.md for tuning guidance.
  session_pool_size: 8

  # High availability: multiple tokens with health-tracked failover (Task 44).
  # When `tokens` is set the pkcs11 backend spans them, each holding a replica of
  # the signing key(s) under the SAME CKA_LABEL. Signing is routed to a healthy
  # token and fails over on error; a token is marked unhealthy after
  # `failure_threshold` consecutive failures (or failed probes) and is returned to
  # rotation by the background prober once it recovers. Per-token health and
  # failover metrics are exported (secsy_hsm_token_up / _failovers_total /
  # _errors_total). Replicating the (non-extractable) key onto each token is an
  # operator key-ceremony step; see docs/hsm-ha.md. Leave `tokens` empty for the
  # ordinary single-token setup above.
  #
  # selection_policy: "primary-backup"   # or "round-robin"; default primary-backup
  # failure_threshold: 3                 # consecutive failures before out of rotation
  # probe_interval_seconds: 15           # background recovery-probe cadence
  # tokens:
  #   - name: "hsm-a"                    # stable name used in metrics/logs
  #     token_label: "secsy-ca-a"
  #     # pin: "..."                     # optional; falls back to pkcs11.pin
  #   - name: "hsm-b"
  #     token_label: "secsy-ca-b"

yubihsm:
  connector_url: "yhusb://"
  auth_key_id: 1
  password: "password"

# ---------------------------------------------------------------------------
# Enterprise: RBAC, policy, and custom certificate profiles (Task 8)
# ---------------------------------------------------------------------------

# rbac assigns organization-wide roles to OIDC subjects and to group IDs.
# Recognized roles:
#   admin   - full control (equivalent to the built-in root user)
#   issuer  - may issue/renew/revoke certs on any CA (restriction sets still
#             apply) and encrypt/decrypt secrets; may read logs
#   auditor - read-only access to the audit, access, and event logs
# Subject keys may be the OIDC "sub" claim or the user's email. Group keys are
# the group IDs from the /api/groups store. A user's effective roles are the
# union of its subject and group assignments. Unknown role names are rejected
# at startup.
rbac:
  subjects: {}
  #   "1a2b3c-oidc-subject": [admin]
  #   "auditor@example.com": [auditor]
  groups: {}
  #   "group-uuid-for-pki-ops": [issuer]

# tenants declares the isolated organizations this deployment serves. The
# built-in "default" tenant always exists; declaring tenants here provisions
# additional ones (idempotently) and their per-tenant RBAC assignments. A tenant
# owns its own CAs, restriction sets, revocation/CRL state, secret envelopes, and
# audit trail; a principal may only reach a tenant it is a member of. The
# top-level rbac block above grants PLATFORM-wide roles (spanning all tenants,
# for platform operators); a tenant's rbac block grants roles ONLY within it.
tenants: []
#   - id: acme-corp                 # stable, immutable internal id
#     slug: acme                    # URL/CLI-friendly unique identifier
#     name: "ACME Corporation"
#     kek_label: "kek-acme"         # optional per-tenant secret KEK
#     rbac:
#       subjects:
#         "oidc-subject-of-acme-admin": [admin]
#         "issuer@acme.example.com": [issuer]

# policy holds system-wide issuance guardrails, enforced centrally regardless
# of per-CA restriction sets.
policy:
  # Cap the validity of any issued end-entity certificate (0 = no global cap;
  # per-profile and per-CA limits still apply).
  max_cert_validity_days: 0
  # Require a non-empty reason on sign requests that carry a reason field.
  require_reason: false
  # Accept the built-in root basic-auth user. Set to false in production once
  # OIDC admins are configured to remove the shared-credential superuser.
  allow_root_basic_auth: true

# profiles defines custom certificate profiles layered over the built-ins
# (server, client, server-client, code-signing, email). A custom profile with
# the same name as a built-in overrides it.
profiles: []
#   - name: short-lived-client
#     description: "Ephemeral mTLS client certificate"
#     key_usages: [digitalSignature]
#     ext_key_usages: [clientAuth]
#     default_validity_days: 7
#     max_validity_days: 30
#   - name: server-ct
#     description: "TLS server certificate with Certificate Transparency"
#     key_usages: [digitalSignature, keyEncipherment]
#     ext_key_usages: [serverAuth]
#     default_validity_days: 90
#     # ct enables RFC 6962 precertificate submission + SCT embedding for this
#     # profile. Referenced logs must be registered under certificate_transparency.
#     ct:
#       enabled: true
#       logs: [test-log]      # empty = submit to every registered log
#       min_scts: 1           # minimum SCTs the policy requires (default 1)
#       fail_open: false      # false = reject issuance if the policy is not met;
#                             # true = issue anyway with whatever SCTs were obtained
#       timeout_seconds: 5    # per-log attempt timeout
#       retries: 2            # extra attempts per log after the first
#   - name: public-tls
#     description: "Publicly-trusted TLS server certificate (CA/B BR enforced)"
#     key_usages: [digitalSignature, keyEncipherment]
#     ext_key_usages: [serverAuth]
#     default_validity_days: 90
#     max_validity_days: 397
#     # lint configures the pre-issuance lint gate (CA/Browser Forum Baseline
#     # Requirements). It runs on every to-be-signed certificate BEFORE the HSM
#     # signs it and is fail-closed by default: an enforce-mode violation aborts
#     # issuance. Linting is on for every profile; the block below is optional.
#     lint:
#       disabled: false        # true turns the gate off for this profile (discouraged)
#       mode: enforce          # default mode for all checks: enforce | warn
#       public: true           # apply public-trust rules: SAN required, CN in SAN,
#                              # no internal names / reserved IPs, 398-day TLS cap
#       overrides:             # per-check mode overrides, keyed by check code
#         cn_in_san: warn
#     # caa configures the DNS Certification Authority Authorization gate (RFC
#     # 8659). It resolves the CAA RRset for every DNS-name SAN before the HSM
#     # signs and, under enforce mode, blocks issuance when the RRset does not
#     # authorize this CA (fail-closed). IP-only certificates skip the check.
#     caa:
#       mode: enforce          # off (default) | permissive (audit only) | enforce
#       identifier: pki.example.com  # overrides the top-level caa.identifier
#       timeout_seconds: 5     # bounds all DNS lookups for one certificate
#     # attestation configures the hardware key-attestation gate on the
#     # device-enrollment paths (EST/SCEP/ACME). Under "require" an enrollment
#     # under this profile must present a valid hardware attestation (YubiKey PIV,
#     # TPM EK/AK, or Apple) bound to the enrolled key, chaining to a trusted
#     # manufacturer root (see the top-level `attestation` block); otherwise the
#     # enrollment is rejected fail-closed. "permissive" audits but never blocks.
#     attestation:
#       mode: require          # off (default) | permissive (audit only) | require

# caa holds the deployment-wide CAA settings. Enforcement is opt-in per profile
# (see a profile's `caa` block above); this section supplies the CA identifier a
# profile inherits when it does not set its own, plus the DNS-answer cache TTL.
caa:
  # identifier is this CA's CAA domain identifier — the value a domain owner
  # publishes in `issue "pki.example.com"` to authorize this CA. Required for any
  # profile running caa.mode: enforce.
  identifier: ""
  cache_ttl_seconds: 300   # how long resolved CAA/CNAME answers are reused (0 = 300)

# attestation configures hardware key-attestation verification on the device
# enrollment paths (EST/SCEP/ACME, Task 49). Enforcement is opt-in per profile
# (see a profile's `attestation` block above) or via default_mode below. This
# section supplies the trusted manufacturer roots every attestation certificate
# chain must terminate at (YubiKey PIV roots, TPM manufacturer roots, Apple
# attestation roots). Inert unless a profile (or default_mode) is non-"off".
attestation:
  default_mode: "off"        # off (default) | permissive | require
  # trusted_root_files lists PEM files of trusted manufacturer roots (and any
  # intermediates). Self-signed certificates are treated as roots; the rest as
  # chain-building intermediates.
  trusted_root_files: []
  #   - /etc/secsy-pki/attestation/yubico-piv-root.pem
  #   - /etc/secsy-pki/attestation/tpm-manufacturer-roots.pem
  #   - /etc/secsy-pki/attestation/apple-attestation-root.pem
  trusted_roots_pem: ""      # inline PEM alternative/supplement to the files above

# crl configures delta CRLs and CRL partitioning/sharding (RFC 5280). Defaults
# keep the pre-existing behavior: a single complete CRL, no stamped CDP URLs.
# See docs/certificate-authority.md.
crl:
  shards: 0                    # 0/1 = single complete CRL; N>=2 = N partitions
  base_url: ""                 # origin for CDP/IDP/Freshest-CRL URLs; falls back
                               # to acme.base_url when empty. No CDP is stamped
                               # into leaves if neither is set.
  delta_interval_minutes: 60   # how long a delta CRL is served before re-signing
  base_validity_hours: 168     # base CRL validity window (default 7 days)

# spiffe enables SPIFFE X.509-SVID workload-identity issuance. When enabled, the
# POST /api/ca/{id}/svid endpoint mints short-lived SVIDs (a single spiffe:// URI
# SAN as the sole identity, CA:false, digitalSignature) restricted to the
# trust-domain allowlist below, and GET /api/ca/{id}/svid/bundle serves the CA's
# X.509 authorities as a JWKS-style SPIFFE trust bundle. See docs/spiffe.md.
# spiffe:
#   enabled: true
#   trust_domains:               # global allowlist (fail-closed: empty = none)
#     - example.org
#     - prod.example.org
#   # subject_trust_domains:     # optional per-subject grants (RBAC-keyed)
#   #   "oidc-subject-or-verified-email": [team.example.net]
#   profile: spiffe-svid         # SVID issuance profile (built-in default)
#   default_ca_id: ""            # CA used when a request omits one
#   refresh_hint_seconds: 300    # advertised in the trust bundle (spiffe_refresh_hint)
#   renew_fraction: 0.5          # monitor auto-renews an SVID at 50% of its lifetime

# certificate_transparency registers the RFC 6962 CT logs available to issuance
# profiles (referenced by name from a profile's `ct.logs`). Supplying a log's
# public_key (PEM SubjectPublicKeyInfo) enables cryptographic verification of the
# SCT signatures it returns; without it, SCTs are accepted on count alone.
certificate_transparency:
  logs: []
#     - name: test-log
#       url: "https://ct.example.com/testlog"
#       public_key: |
#         -----BEGIN PUBLIC KEY-----
#         ...
#         -----END PUBLIC KEY-----
#     - name: prod-log
#       url: "https://ct.googleapis.com/logs/xenon2025"
#       public_key_file: /etc/secsy-pki/ct/xenon2025.pem

# acme configures the RFC 8555 automated-issuance server (certbot / lego /
# acme.sh). Disabled by default; see docs/acme.md. When enabled, point it at an
# existing X.509 issuing CA and a certificate profile.
acme:
  enabled: false
  # base_url: "https://pki.example.com"   # else derived from the request Host
  # ca_label: "Secsy Issuing CA"          # or ca_id; the CA that signs ACME certs
  profile: "server"                       # the ACME-enabled profile
  challenge_types: ["http-01", "dns-01"]  # wildcards require dns-01
  # require_eab: true                     # restrict who may register (RBAC-like)
  # eab_hmac_keys:
  #   team-web: "base64url-or-base64-hmac-key"
  # ACME Renewal Information (ARI, draft-ietf-acme-ari): advertised automatically.
  # renewal_window_days: 30               # when the suggested window opens (0 = derive)
  # renewal_window_width_hours: 360       # window width (0 = half the renew-before span)
  # renewal_poll_hours: 6                 # advertised Retry-After cadence
  # renewal_explanation_url: "https://pki.example.com/notices/mass-renewal"

# tsa exposes an RFC 3161 Time-Stamp Authority at /tsa (application/timestamp-
# query). Disabled by default; see docs/timestamping.md. Provision the signing
# key + certificate first with `secsy-ca tsa-key` — the key MUST be RSA.
tsa:
  enabled: false
  # path: /tsa                              # URL the endpoint mounts under
  # key_label: tsa-signer                   # provider label of the (RSA) TSA key
  # certificate_file: /etc/secsy/tsa.pem    # written by `secsy-ca tsa-key`
  # ca_label: "Secsy Issuing CA"            # or ca_id; issuer chain source
  # policy_oid: 1.3.6.1.4.1.99999.1.1       # your owned TSA policy OID
  # accuracy_seconds: 1                     # genTime accuracy bound (0/omit = none)
  # ordering: false                         # assert strict time ordering
  # signature_digest: sha256                # sha256 | sha384 | sha512
  # accepted_hashes: [sha256, sha384, sha512]  # message-imprint algs (sha1 opt-in)
  # include_tsa_name: false                 # embed signer subject as tsa GeneralName

# cmp enables the Lightweight CMP (RFC 9483) certificate-management endpoint for
# enterprise clients that speak CMP rather than ACME/EST. It handles the ir/cr/
# kur/rr PKIMessage flows with shared-secret (PasswordBasedMac) or signature-based
# message protection; every leaf is signed through the shared HSM-backed CA.
# Disabled by default; see docs/enrollment.md.
cmp:
  enabled: false
  # path: /cmp                              # URL the endpoint mounts under
  # ca_label: "Secsy Issuing CA"            # or ca_id; the issuing CA
  # profile: client                         # default certificate profile
  # allow_signature_protection: true        # enable kur & signature-based rr
  # secrets:                                # shared secrets for MAC-protected ir/cr
  #   - reference: device-fleet-1           # the senderKID a client presents
  #     secret: "change-me-shared-secret"   # the PBM shared secret
  #     profile: client                     # optional per-secret profile override

# audit.export streams the tamper-evident event log to external SIEM systems.
# Disabled by default; see docs/audit-siem-export.md. Each sink has its own
# durable cursor, so delivery is at-least-once and lossless across restarts.
audit:
  export:
    enabled: false
    # poll_interval_seconds: 5   # how often a caught-up worker checks for events
    # batch_size: 256            # max events per delivery (backpressure knob)
    # retry_backoff_seconds: 1   # initial retry delay after a failed delivery
    # max_backoff_seconds: 30    # cap on the (doubling) retry delay
    sinks: []
    #   - name: soc-syslog                 # unique; keys the cursor & metrics
    #     type: syslog                      # syslog | webhook
    #     format: rfc5424                   # rfc5424 | cef  (json for webhook)
    #     network: tls                      # tcp | tls
    #     address: siem.example.com:6514
    #     framing: octet-counting           # octet-counting | lf
    #     tls:
    #       ca_file: /etc/secsy/siem-ca.pem
    #       # client_cert_file / client_key_file: mutual TLS
    #   - name: soc-webhook
    #     type: webhook
    #     format: json                      # newline-delimited JSON
    #     url: https://collector.example.com/ingest
    #     headers:
    #       Authorization: "Bearer <token>"

# rate_limit protects the public-facing endpoints (ACME newOrder/newAccount,
# OCSP, CRL, and SCEP/EST enrollment) from issuance abuse and HSM overload.
# Disabled by default; see docs/rate-limiting.md. When enabled, a token-bucket
# limiter meters requests across three independent tiers and a bounded in-flight
# guard caps how many signing/enrollment requests hit the HSM at once. Rejected
# requests get a 429 (or 503 when the HSM is saturated) with a Retry-After hint,
# so compliant ACME clients back off and recover gracefully.
rate_limit:
  enabled: false
  # Each tier is a token bucket: rate = sustained requests/second, burst = the
  # bucket capacity (short spikes allowed). A tier with rate/burst <= 0 is off.
  global:                        # aggregate cap across all clients
    rate: 200
    burst: 400
  per_ip:                        # per source IP (honors X-Forwarded-For)
    rate: 20
    burst: 40
  per_account:                   # per ACME account / EST user
    rate: 50
    burst: 100
  # max_keys: 100000             # bound on distinct per-IP/per-account buckets
  # idle_ttl_seconds: 600        # idle bucket eviction window
  concurrency:                   # in-flight guard in front of the HSM session pool
    # enabled: true              # defaults on when rate_limit.enabled is true
    # max_in_flight: 0           # 0 => derived from pkcs11.session_pool_size
    max_queue: 64                # requests allowed to wait before shedding (503)
    acquire_timeout_ms: 5000     # max wait for a slot before shedding

# --- OpenTelemetry distributed tracing (OTLP) --------------------------------
# Emit end-to-end spans across the request middleware and the CA/HSM/store hot
# paths (issuance, HSM sign/session-pool wait, failover events, CRL/OCSP,
# pre-issuance lint/CAA/name-constraint gates, store writes), correlated with the
# structured request log via trace/span IDs. Complements the Prometheus metrics.
# Disabled by default: a no-op tracer, no exporter. See docs/tracing.md and the
# collector snippet in deploy/observability/tracing/. W3C traceparent is honored.
tracing:
  enabled: false
  endpoint: "otel-collector:4317"  # OTLP receiver host:port (grpc :4317 / http :4318)
  protocol: grpc                   # grpc | http
  insecure: true                   # disable transport TLS (in-cluster/trusted network)
  sample_ratio: 0.1                # head-based [0,1]; parent-sampled traces always kept
  service_name: secsy-pki          # service.name resource attribute
  # service_version: "1.0.0"
  timeout_seconds: 10              # per-export attempt timeout
  # headers:                       # optional static export headers (auth token, etc.)
  #   authorization: "Bearer ..."

# --- External certificate discovery/scanner (Task 54) -------------------------
# Periodically probes a list of TLS endpoints, records the served leaf
# certificates into the discovered-certificate inventory, and flags expiring,
# weak-key, SHA-1, self-signed, hostname-mismatched, and rogue (not-issued-by-
# this-PKI) certs. Flagged findings are dispatched through the same notification
# sinks as the expiry monitor. Inert unless enabled; the `secsy-ca discover` CLI
# and the /api/discovery endpoints work regardless of this block.
discovery:
  enabled: false
  interval_hours: 24            # background scan cadence (default 24)
  expiry_days: 30               # "expiring soon" window (default 30)
  # targets are literal host[:port][#sni] endpoints; #sni overrides the SNI.
  targets: []
  #   - "example.com"                 # :443, SNI=example.com
  #   - "10.0.0.5:8443#internal.svc"  # explicit port + SNI
  # hosts_file: "discovery-hosts.txt" # one endpoint per line ('#' comments)
  # cidrs: ["10.0.0.0/28"]            # expand each host address on default_port
  default_port: 443
  dial_timeout_seconds: 8
  concurrency: 16
  store: true                   # persist findings to the inventory
  notify: false                 # dispatch flagged findings via monitor.notifications

# --- HSM-backed secret encryption (envelope encryption) -----------------------
# Encrypt passwords and small secrets under a KEK held in the HSM. See
# docs/password-encryption.md. When secret.kek_label is unset, the /api/secret/*
# endpoints are disabled.
# secret:
#   kek_label: "secsy-kek"       # RSA KEK label (create with `secsy-secret init-kek`)
#   # Optional M-of-N key escrow: recover a data key under dual control if the
#   # original requester loses access. The DEK is Shamir-split across the
#   # recovery agents; any `threshold` of them can reconstruct it, fewer cannot.
#   escrow:
#     enabled: true
#     threshold: 2               # quorum M (>= 2 for dual control, <= number of agents)
#     agents:                    # N recovery agents
#       - id: "alice"
#         key_label: "agent-alice"        # RSA key in the provider/HSM
#       - id: "bob"
#         key_label: "agent-bob"
#       - id: "carol"
#         # public_key_file: "carol.pub"  # or an externally-held public key (wrap-only)
#         key_label: "agent-carol"
