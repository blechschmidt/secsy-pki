server:
  host: "0.0.0.0"
  port: 8443
  tls_cert: "certs/server.crt"
  tls_key: "certs/server.key"
  # ocsp_cache_ttl_seconds bounds how long a signed OCSP response is reused from
  # the in-memory cache before being re-signed on the HSM. 0 uses the server
  # default (1h); a negative value disables caching. Revocations invalidate the
  # affected entry immediately. See docs/benchmarks.md.
  ocsp_cache_ttl_seconds: 3600

database:
  driver: "sqlite"
  dsn: "secsy-pki.db"

oidc:
  issuer_url: "http://localhost:8080/realms/secsy-pki"
  client_id: "secsy-pki"

root_user:
  username: "root"
  password: "change-me-in-production"

# key_provider selects the backend used to generate and sign with CA keys.
#   type: "pkcs11"  -> keys live on an HSM / PKCS#11 token (see the pkcs11 block)
#   type: "software" -> keys live in an on-disk keystore (see software.keystore_dir)
# If omitted, the type defaults to "pkcs11" when pkcs11.module_path is set,
# otherwise "software". These may be overridden by the SECSY_* environment
# variables emitted by scripts/setup-softhsm.sh --export-env.
key_provider:
  type: "pkcs11"
  software:
    keystore_dir: "keystore"

pkcs11:
  module_path: "/usr/lib/pkcs11/yubihsm_pkcs11.so"
  pin: "0001password"
  token_label: "YubiHSM"
  # session_pool_size bounds concurrent PKCS#11 sessions (and thus concurrent
  # on-device operations); requests beyond it queue. 0/omitted uses the default
  # (8). Size it toward the HSM's supported concurrent-session limit. See
  # docs/benchmarks.md for tuning guidance.
  session_pool_size: 8

yubihsm:
  connector_url: "yhusb://"
  auth_key_id: 1
  password: "password"

# ---------------------------------------------------------------------------
# Enterprise: RBAC, policy, and custom certificate profiles (Task 8)
# ---------------------------------------------------------------------------

# rbac assigns organization-wide roles to OIDC subjects and to group IDs.
# Recognized roles:
#   admin   - full control (equivalent to the built-in root user)
#   issuer  - may issue/renew/revoke certs on any CA (restriction sets still
#             apply) and encrypt/decrypt secrets; may read logs
#   auditor - read-only access to the audit, access, and event logs
# Subject keys may be the OIDC "sub" claim or the user's email. Group keys are
# the group IDs from the /api/groups store. A user's effective roles are the
# union of its subject and group assignments. Unknown role names are rejected
# at startup.
rbac:
  subjects: {}
  #   "1a2b3c-oidc-subject": [admin]
  #   "auditor@example.com": [auditor]
  groups: {}
  #   "group-uuid-for-pki-ops": [issuer]

# policy holds system-wide issuance guardrails, enforced centrally regardless
# of per-CA restriction sets.
policy:
  # Cap the validity of any issued end-entity certificate (0 = no global cap;
  # per-profile and per-CA limits still apply).
  max_cert_validity_days: 0
  # Require a non-empty reason on sign requests that carry a reason field.
  require_reason: false
  # Accept the built-in root basic-auth user. Set to false in production once
  # OIDC admins are configured to remove the shared-credential superuser.
  allow_root_basic_auth: true

# profiles defines custom certificate profiles layered over the built-ins
# (server, client, server-client, code-signing, email). A custom profile with
# the same name as a built-in overrides it.
profiles: []
#   - name: short-lived-client
#     description: "Ephemeral mTLS client certificate"
#     key_usages: [digitalSignature]
#     ext_key_usages: [clientAuth]
#     default_validity_days: 7
#     max_validity_days: 30

# acme configures the RFC 8555 automated-issuance server (certbot / lego /
# acme.sh). Disabled by default; see docs/acme.md. When enabled, point it at an
# existing X.509 issuing CA and a certificate profile.
acme:
  enabled: false
  # base_url: "https://pki.example.com"   # else derived from the request Host
  # ca_label: "Secsy Issuing CA"          # or ca_id; the CA that signs ACME certs
  profile: "server"                       # the ACME-enabled profile
  challenge_types: ["http-01", "dns-01"]  # wildcards require dns-01
  # require_eab: true                     # restrict who may register (RBAC-like)
  # eab_hmac_keys:
  #   team-web: "base64url-or-base64-hmac-key"

# audit.export streams the tamper-evident event log to external SIEM systems.
# Disabled by default; see docs/audit-siem-export.md. Each sink has its own
# durable cursor, so delivery is at-least-once and lossless across restarts.
audit:
  export:
    enabled: false
    # poll_interval_seconds: 5   # how often a caught-up worker checks for events
    # batch_size: 256            # max events per delivery (backpressure knob)
    # retry_backoff_seconds: 1   # initial retry delay after a failed delivery
    # max_backoff_seconds: 30    # cap on the (doubling) retry delay
    sinks: []
    #   - name: soc-syslog                 # unique; keys the cursor & metrics
    #     type: syslog                      # syslog | webhook
    #     format: rfc5424                   # rfc5424 | cef  (json for webhook)
    #     network: tls                      # tcp | tls
    #     address: siem.example.com:6514
    #     framing: octet-counting           # octet-counting | lf
    #     tls:
    #       ca_file: /etc/secsy/siem-ca.pem
    #       # client_cert_file / client_key_file: mutual TLS
    #   - name: soc-webhook
    #     type: webhook
    #     format: json                      # newline-delimited JSON
    #     url: https://collector.example.com/ingest
    #     headers:
    #       Authorization: "Bearer <token>"

# rate_limit protects the public-facing endpoints (ACME newOrder/newAccount,
# OCSP, CRL, and SCEP/EST enrollment) from issuance abuse and HSM overload.
# Disabled by default; see docs/rate-limiting.md. When enabled, a token-bucket
# limiter meters requests across three independent tiers and a bounded in-flight
# guard caps how many signing/enrollment requests hit the HSM at once. Rejected
# requests get a 429 (or 503 when the HSM is saturated) with a Retry-After hint,
# so compliant ACME clients back off and recover gracefully.
rate_limit:
  enabled: false
  # Each tier is a token bucket: rate = sustained requests/second, burst = the
  # bucket capacity (short spikes allowed). A tier with rate/burst <= 0 is off.
  global:                        # aggregate cap across all clients
    rate: 200
    burst: 400
  per_ip:                        # per source IP (honors X-Forwarded-For)
    rate: 20
    burst: 40
  per_account:                   # per ACME account / EST user
    rate: 50
    burst: 100
  # max_keys: 100000             # bound on distinct per-IP/per-account buckets
  # idle_ttl_seconds: 600        # idle bucket eviction window
  concurrency:                   # in-flight guard in front of the HSM session pool
    # enabled: true              # defaults on when rate_limit.enabled is true
    # max_in_flight: 0           # 0 => derived from pkcs11.session_pool_size
    max_queue: 64                # requests allowed to wait before shedding (503)
    acquire_timeout_ms: 5000     # max wait for a slot before shedding
