server:
  host: "0.0.0.0"
  port: 8443
  tls_cert: "certs/server.crt"
  tls_key: "certs/server.key"
  # ocsp_cache_ttl_seconds bounds how long a signed OCSP response is reused from
  # the in-memory cache before being re-signed on the HSM. 0 uses the server
  # default (1h); a negative value disables caching. Revocations invalidate the
  # affected entry immediately. See docs/benchmarks.md.
  ocsp_cache_ttl_seconds: 3600
  # OCSP responder hardening (RFC 6960 / RFC 8954). All fields are optional.
  ocsp:
    # Echo the request nonce in the signed response (bypasses the cache for
    # nonce-bearing requests). Defaults to true when omitted.
    nonce_enabled: true
    # Validity window for a nonce-bearing (freshly signed) response, in seconds.
    nonce_max_age_seconds: 60
    # Sign responses with a short-lived HSM-backed delegated OCSP-signing
    # certificate (id-kp-OCSPSigning + ocsp-nocheck) instead of the CA key.
    delegated: false
    delegated_validity_hours: 168          # 7 days
    delegated_key_type: "ecdsa-sha2-nistp256"
    # CA that issued this server's own TLS certificate; when set, the server
    # staples a fresh OCSP response to its TLS handshake (RFC 6066).
    staple_ca_id: ""
  # Opt-in net/http/pprof runtime profiling (CPU/heap/goroutine/mutex/block).
  # OFF by default and never exposed unauthenticated — see docs/RUNBOOK.md
  # "Performance profiling (pprof)". A profile is a raw dump of process memory
  # and stacks and can contain in-flight secrets, so access is controlled by
  # mode below.
  pprof:
    enabled: false
    # "loopback" (default): a dedicated listener on a loopback address, reachable
    #   only from the host (SSH tunnel / kubectl port-forward). A non-loopback
    #   address is refused at startup.
    # "authenticated": mount /debug/pprof/ on the API listener behind operator
    #   auth PLUS the admin-only server:profile capability.
    mode: "loopback"
    address: "127.0.0.1:6060"     # loopback mode only; host must be a loopback IP
    # Off (0) by default because they add runtime overhead; set >0 to diagnose
    # PKCS#11 session-pool lock contention / goroutines blocked on an HSM session.
    mutex_profile_fraction: 0     # 1 = sample every mutex contention event
    block_profile_rate: 0         # nanoseconds; a block >= this is sampled
  # Serving-TLS options beyond the static tls_cert/tls_key pair above.
  tls:
    # Self-managed serving certificate (Task 118): dogfood the HTTPS listener
    # certificate from an internal CA instead of loading a static cert/key from
    # disk. The private key is generated in and used through the configured key
    # provider (HSM/software) — it never touches disk — and a background loop
    # auto-rotates the certificate before expiry, swapping it hitlessly. When
    # enabled this supersedes tls_cert/tls_key. OFF by default.
    self_issue:
      enabled: false
      ca_id: ""                    # internal CA that issues the serving cert (required)
      profile: "server"            # serverAuth TLS-leaf profile (default: server)
      common_name: ""              # default: first dnsname, then a stable fallback
      dnsnames: ["localhost"]      # subject alternative names
      ips: []                      # e.g. ["127.0.0.1"]
      key_label: ""                # provider key label (default: serving-tls-<ca_id>)
      key_type: "ecdsa-sha2-nistp256"
      # Re-issue this long before NotAfter. Empty falls back to a third of the
      # certificate's lifetime remaining (fraction-based, like the monitor).
      renew_before: "720h"         # 30 days
      validity_seconds: 0          # 0 = profile default (serverAuth: 397 days)

database:
  # driver: "sqlite" is the embedded, single-node "file" store (default).
  # For multi-replica high availability, point every replica at a shared
  # PostgreSQL instance:
  #   driver: "postgres"
  #   dsn: "postgres://secsy:secsy@db.internal:5432/secsy_pki?sslmode=require"
  # The connection-pool knobs below apply to PostgreSQL only; SQLite is pinned
  # to a single connection. Zero/omitted values select conservative defaults.
  driver: "sqlite"
  dsn: "secsy-pki.db"
  # max_open_conns: 10
  # max_idle_conns: 5
  # conn_max_lifetime_seconds: 1800
  # conn_max_idle_time_seconds: 300

# --- Multi-replica coordination (Task 68) -------------------------------------
# With replicas > 1 on a shared PostgreSQL, the servers elect a background-job
# leader (PostgreSQL advisory lock with lease renewal): the singleton jobs —
# expiry monitor/auto-renewal, CA auto-rotation, OCSP pre-signing, CRL
# regeneration/publishing, audit anchoring, SIEM export, discovery scans, the
# issuance canary — run on exactly one replica at a time, with automatic
# failover. All replicas keep
# serving API traffic; /readyz reports each replica's role ("leadership") and
# secsy_leader_is_leader / secsy_leader_transitions_total meter the election.
# The defaults are correct for both single-node and multi-replica deployments:
# mode "auto" elects via PostgreSQL when database.driver is postgres, and holds
# leadership statically on single-node SQLite. See docs/high-availability.md.
# coordination:
#   mode: "auto"                            # auto | postgres | static
#   lock_name: "secsy-pki/background-jobs"  # keep stable; namespaces the lock
#   renew_interval_seconds: 5               # leader lease confirmation cadence
#   retry_interval_seconds: 5               # follower acquisition retry (failover bound)

oidc:
  issuer_url: "http://localhost:8080/realms/secsy-pki"
  client_id: "secsy-pki"

# auth configures strong operator authentication for the console/API (Task 50).
# Each sub-block is inert unless its `enabled` is set; the stateless basic-auth
# root and Bearer-token paths keep working regardless. See docs/authentication.md.
auth:
  session:
    # cookie_name overrides the session cookie name (default "secsy_session").
    # ttl_minutes bounds a session's absolute lifetime (default 60).
    ttl_minutes: 60
    # insecure drops the Secure cookie attribute — ONLY for local plaintext
    # testing; leave false in production so cookies are HTTPS-only.
    insecure: false
  oidc:
    # Interactive Authorization-Code login for the console. Inherits issuer_url /
    # client_id from the top-level oidc block when omitted here.
    enabled: false
    # client_secret authenticates a confidential client; omit for a public (PKCE)
    # client. redirect_url is this server's callback registered at the IdP.
    client_secret: ""
    redirect_url: "https://pki.example.com/auth/callback"
    scopes: ["openid", "profile", "email"]
    # groups_claim names the token claim carrying group memberships (default
    # "groups"); its values feed both the rbac group assignments and the mappings.
    groups_claim: "groups"
    # role_mappings map IdP claim values to RBAC roles, optionally per-tenant.
    role_mappings:
      - { claim: "groups", value: "pki-admins", roles: ["admin"] }
      - { claim: "groups", value: "pki-issuers", roles: ["issuer"] }
      # - { value: "acme-issuers", tenant: "acme-corp", roles: ["issuer"] }
    # allow_zero_role: false denies login to an operator that resolves to no role.
    allow_zero_role: false
  ldap:
    # LDAP / Active Directory login (console session + HTTP/RPC Basic for machine
    # callers), mapping directory groups to RBAC roles like oidc.role_mappings.
    enabled: false
    # url: ldaps:// (implicit TLS) or ldap:// (then set start_tls). A bind is
    # never sent over an unencrypted connection.
    url: "ldaps://ad.example.com:636"
    # start_tls: true   # required for an ldap:// URL
    # search-then-bind: bind as a service account, look up the user's DN, then
    # bind as the user. Leave bind_dn empty to use simple-bind + user_dn_template.
    bind_dn: "CN=svc-pki,OU=Service,DC=example,DC=com"
    bind_password: ""   # or bind_password_source (env/file/vault/aws/azure)
    # bind_password_source:
    #   type: file
    #   file: { path: /etc/secsy/ldap-bind.pass }
    user_base_dn: "OU=Users,DC=example,DC=com"
    user_filter: "(&(objectClass=user)(sAMAccountName=%s))"   # %s = login name
    # user_dn_template: "%s@example.com"   # simple-bind only (bind_dn empty)
    # Groups: read from the user entry's memberOf, OR search a group subtree.
    group_attribute: "memberOf"
    # group_base_dn: "OU=Groups,DC=example,DC=com"
    # group_filter: "(&(objectClass=group)(member=%s))"   # %s = user DN, %u = username
    email_attribute: "mail"
    name_attribute: "displayName"
    groups_claim: "groups"
    role_mappings:
      - { value: "CN=PKI-Admins,OU=Groups,DC=example,DC=com", roles: ["admin"] }
      # - { value: "CN=ACME-Issuers,OU=Groups,DC=example,DC=com", tenant: "acme-corp", roles: ["issuer"] }
    allow_zero_role: false
    tls:
      # ca_file trusts the directory server certificate (empty = system store).
      ca_file: ""
      # server_name overrides the expected cert name (needed for IP dials).
      server_name: ""
      # insecure_skip_verify disables verification — tests only.
      insecure_skip_verify: false
      min_version: "1.2"
    timeout_seconds: 10
  mtls:
    # Mutual-TLS client-certificate auth for machine/API callers. When enabled,
    # a client cert is requested and verified against ca_file; a presented cert
    # is bound to a principal by the bindings below.
    enabled: false
    ca_file: "certs/client-ca.pem"
    bindings:
      - { subject_cn: "build-robot", subject: "svc:build-robot", roles: ["issuer"] }
      # - { san_uri: "spiffe://example.org/ns/ops/sa/deployer", roles: ["admin"] }
  webauthn:
    # Passkey step-up for high-risk operations (revocation, CA ceremony,
    # cross-signing, factory reset). rp_id is the console's registrable domain.
    enabled: false
    rp_id: "pki.example.com"
    rp_name: "Secsy PKI"
    origins: ["https://pki.example.com"]
    step_up_ttl_minutes: 5
    # step_up_operations defaults to a safe set when omitted.
    step_up_operations: ["cert.revoke", "ca.init_root", "ca.issue_intermediate", "ca.cross_sign", "ca.manage", "hsm.factory_reset"]
  api_tokens:
    # Native scoped API tokens / service accounts are always available (create
    # them via `secsy-ca token create`, POST /api/tokens, or the console). This
    # block only tunes lifetime policy.
    # max_lifetime_days caps how far in the future a token's expiry may be set;
    # 0 (the default) imposes no cap and permits non-expiring tokens. When
    # positive, a create request must specify an expiry within the cap (and an
    # unspecified expiry defaults to it), so a deployment can forbid immortal
    # credentials by policy.
    max_lifetime_days: 0

root_user:
  username: "root"
  password: "change-me-in-production"

# key_provider selects the backend used to generate and sign with CA keys.
#   type: "pkcs11"  -> keys live on an HSM / PKCS#11 token (see the pkcs11 block)
#   type: "software" -> keys live in an on-disk keystore (see software.keystore_dir)
#   type: "kms"     -> keys live in a cloud KMS or HashiCorp Vault Transit (see
#                      the kms block, docs/cloud-kms.md and docs/vault-transit.md)
# If omitted, the type defaults to "pkcs11" when pkcs11.module_path is set, to
# "kms" when kms.backend is set, otherwise "software". These may be overridden by
# the SECSY_* environment variables emitted by scripts/setup-softhsm.sh --export-env.
key_provider:
  type: "pkcs11"
  software:
    keystore_dir: "keystore"
  # Cloud KMS / Vault backend. Cloud credentials are never taken from config —
  # AWS/Azure use the SDK default chain (env/instance role/IRSA; env/workload/
  # managed identity). Vault credentials come from vault.token/VAULT_TOKEN or the
  # AppRole pair. See docs/cloud-kms.md and docs/vault-transit.md.
  kms:
    backend: ""            # "aws" | "azure" | "vault" | "fake" (empty disables kms)
    region: ""             # AWS region, e.g. "eu-central-1" (AWS backend)
    key_prefix: "secsy/"   # namespaces keys (AWS alias / Azure key name / Vault key name)
    vault_url: ""          # https://<vault>.vault.azure.net/ (Azure backend; NOT HashiCorp Vault)
    # HashiCorp Vault Transit backend (backend: vault). Signing keys and KEKs live
    # inside Vault's Transit engine and never leave the server, mirroring the HSM
    # non-extractability invariant. See docs/vault-transit.md.
    vault:
      address: ""          # https://vault.example.com:8200 (or VAULT_ADDR)
      mount: "transit"     # Transit secrets-engine mount path
      namespace: ""        # Vault Enterprise namespace (X-Vault-Namespace); empty for OSS
      auth_method: "token" # "token" | "approle"
      token: ""            # token auth; prefer VAULT_TOKEN from a Secret over config
      role_id: ""          # approle auth
      secret_id: ""        # approle auth; prefer SECSY_VAULT_SECRET_ID from a Secret
      approle_path: "approle"
      ca_cert_file: ""     # PEM bundle to verify Vault's TLS cert (private CA)
      insecure: false      # disable Vault TLS verification (development only)
      timeout_seconds: 30
  # Optional per-role backend selection. Each role, when set, must name a
  # configured backend type ("pkcs11" | "software" | "kms"); unset falls back to
  # key_provider.type. OCSP follows the "ca" role (the CA manager owns its keys).
  roles:
    ca: ""                 # CA signing key + OCSP responder keys
    tsa: ""                # RFC 3161 TSA signing key
    signing: ""            # artifact code-signing keys (signing: service)

pkcs11:
  module_path: "/usr/lib/pkcs11/yubihsm_pkcs11.so"
  pin: "0001password"
  token_label: "YubiHSM"
  # session_pool_size bounds concurrent PKCS#11 sessions (and thus concurrent
  # on-device operations); requests beyond it queue. 0/omitted uses the default
  # (8). Size it toward the HSM's supported concurrent-session limit. See
  # docs/benchmarks.md for tuning guidance.
  session_pool_size: 8

  # High availability: multiple tokens with health-tracked failover (Task 44).
  # When `tokens` is set the pkcs11 backend spans them, each holding a replica of
  # the signing key(s) under the SAME CKA_LABEL. Signing is routed to a healthy
  # token and fails over on error; a token is marked unhealthy after
  # `failure_threshold` consecutive failures (or failed probes) and is returned to
  # rotation by the background prober once it recovers. Per-token health and
  # failover metrics are exported (secsy_hsm_token_up / _failovers_total /
  # _errors_total). Replicating the (non-extractable) key onto each token is an
  # operator key-ceremony step; see docs/hsm-ha.md. Leave `tokens` empty for the
  # ordinary single-token setup above.
  #
  # selection_policy: "primary-backup"   # or "round-robin"; default primary-backup
  # failure_threshold: 3                 # consecutive failures before out of rotation
  # probe_interval_seconds: 15           # background recovery-probe cadence
  # tokens:
  #   - name: "hsm-a"                    # stable name used in metrics/logs
  #     token_label: "secsy-ca-a"
  #     # pin: "..."                     # optional; falls back to pkcs11.pin
  #   - name: "hsm-b"
  #     token_label: "secsy-ca-b"

yubihsm:
  connector_url: "yhusb://"
  auth_key_id: 1
  password: "password"

# ---------------------------------------------------------------------------
# Enterprise: RBAC, policy, and custom certificate profiles (Task 8)
# ---------------------------------------------------------------------------

# rbac assigns organization-wide roles to OIDC subjects and to group IDs.
# Recognized roles:
#   admin   - full control (equivalent to the built-in root user)
#   issuer  - may issue/renew/revoke certs on any CA (restriction sets still
#             apply) and encrypt/decrypt secrets; may read logs
#   signer  - may sign release artifacts with the configured code-signing keys
#             (signing: service, /api/sign); may read logs. Separate from
#             issuer so a build credential cannot mint certificates.
#   auditor - read-only access to the audit, access, and event logs
# Subject keys may be the OIDC "sub" claim or the user's email. Group keys are
# the group IDs from the /api/groups store. A user's effective roles are the
# union of its subject and group assignments. Unknown role names are rejected
# at startup.
rbac:
  subjects: {}
  #   "1a2b3c-oidc-subject": [admin]
  #   "auditor@example.com": [auditor]
  groups: {}
  #   "group-uuid-for-pki-ops": [issuer]

# tenants declares the isolated organizations this deployment serves. The
# built-in "default" tenant always exists; declaring tenants here provisions
# additional ones (idempotently) and their per-tenant RBAC assignments. A tenant
# owns its own CAs, restriction sets, revocation/CRL state, secret envelopes, and
# audit trail; a principal may only reach a tenant it is a member of. The
# top-level rbac block above grants PLATFORM-wide roles (spanning all tenants,
# for platform operators); a tenant's rbac block grants roles ONLY within it.
#
# Lifecycle & quotas (Task 61): tenants can be suspended (blocks all
# certificate issuance across every enrollment protocol plus secret operations,
# while OCSP/CRL for existing certificates keeps serving) and carry per-tenant
# quotas — certs/day, active-cert ceiling, secret-ops/day, and a rate-limit
# override — managed at runtime via `secsy-ca tenant quota|suspend|activate|
# usage`, PUT /api/tenants/{id}, and the console's Tenants page. Enforcement is
# fail-closed with 429/quota_exceeded semantics; see docs/multi-tenancy.md.
tenants: []
#   - id: acme-corp                 # stable, immutable internal id
#     slug: acme                    # URL/CLI-friendly unique identifier
#     name: "ACME Corporation"
#     kek_label: "kek-acme"         # optional per-tenant secret KEK
#     rbac:
#       subjects:
#         "oidc-subject-of-acme-admin": [admin]
#         "issuer@acme.example.com": [issuer]

# policy holds system-wide issuance guardrails, enforced centrally regardless
# of per-CA restriction sets.
policy:
  # Cap the validity of any issued end-entity certificate (0 = no global cap;
  # per-profile and per-CA limits still apply).
  max_cert_validity_days: 0
  # Require a non-empty reason on sign requests that carry a reason field.
  require_reason: false
  # Accept the built-in root basic-auth user. Set to false in production once
  # OIDC admins are configured to remove the shared-credential superuser.
  allow_root_basic_auth: true

# profiles defines custom certificate profiles layered over the built-ins
# (server, client, server-client, code-signing, email). A custom profile with
# the same name as a built-in overrides it.
profiles: []
#   - name: short-lived-client
#     description: "Ephemeral mTLS client certificate"
#     key_usages: [digitalSignature]
#     ext_key_usages: [clientAuth]
#     default_validity_days: 7
#     max_validity_days: 30
#   - name: server-ct
#     description: "TLS server certificate with Certificate Transparency"
#     key_usages: [digitalSignature, keyEncipherment]
#     ext_key_usages: [serverAuth]
#     default_validity_days: 90
#     # ct enables RFC 6962 precertificate submission + SCT embedding for this
#     # profile. Referenced logs must be registered under certificate_transparency.
#     ct:
#       enabled: true
#       logs: [test-log]      # empty = submit to every registered log
#       min_scts: 1           # minimum SCTs the policy requires (default 1)
#       min_distinct_operators: 0  # minimum DISTINCT log operators (0 = off).
#                             # Modern CT policy (Chrome/Apple) wants >=2 independent
#                             # operators; requires each candidate log to have an
#                             # `operator` (see certificate_transparency below).
#       require_operators: []      # e.g. [Google, Apple]: each must contribute an SCT
#       fail_open: false      # false = reject issuance if the policy is not met;
#                             # true = issue anyway with whatever SCTs were obtained
#       timeout_seconds: 5    # per-log attempt timeout
#       retries: 2            # extra attempts per log after the first
#   - name: wildcard-tls
#     description: "Wildcard TLS certificate — held for manual approval"
#     key_usages: [digitalSignature, keyEncipherment]
#     ext_key_usages: [serverAuth]
#     default_validity_days: 90
#     max_validity_days: 397
#     # require_approval routes operator/API issuance under this profile through
#     # the four-eyes / maker-checker gate (Task 84) instead of issuing at once:
#     # the request is parked until the required number of DISTINCT approvers sign
#     # off (see the `approvals` block, cert.issue class). Use it for wildcard,
#     # high-assurance, or otherwise sensitive profiles. It gates ONLY operator/API
#     # issuance (REST + gRPC); automated protocol flows (ACME/EST/SCEP/CMP), which
#     # enroll machines, always bypass the manual gate. It is inert unless
#     # approvals.enabled and the cert.issue class is guarded.
#     require_approval: true
#   - name: public-tls
#     description: "Publicly-trusted TLS server certificate (CA/B BR enforced)"
#     key_usages: [digitalSignature, keyEncipherment]
#     ext_key_usages: [serverAuth]
#     default_validity_days: 90
#     max_validity_days: 397
#     # lint configures the pre-issuance lint gate (CA/Browser Forum Baseline
#     # Requirements). It runs on every to-be-signed certificate BEFORE the HSM
#     # signs it and is fail-closed by default: an enforce-mode violation aborts
#     # issuance. Linting is on for every profile; the block below is optional.
#     lint:
#       disabled: false        # true turns the gate off for this profile (discouraged)
#       mode: enforce          # default mode for all checks: enforce | warn
#       public: true           # apply public-trust rules: SAN required, CN in SAN,
#                              # no internal names / reserved IPs, 398-day TLS cap
#       overrides:             # per-check mode overrides, keyed by check code
#         cn_in_san: warn
#     # caa configures the DNS Certification Authority Authorization gate (RFC
#     # 8659). It resolves the CAA RRset for every DNS-name SAN before the HSM
#     # signs and, under enforce mode, blocks issuance when the RRset does not
#     # authorize this CA (fail-closed). IP-only certificates skip the check.
#     caa:
#       mode: enforce          # off (default) | permissive (audit only) | enforce
#       identifier: pki.example.com  # overrides the top-level caa.identifier
#       timeout_seconds: 5     # bounds all DNS lookups for one certificate
#     # attestation configures the hardware key-attestation gate on the
#     # device-enrollment paths (EST/SCEP/ACME). Under "require" an enrollment
#     # under this profile must present a valid hardware attestation (YubiKey PIV,
#     # TPM EK/AK, or Apple) bound to the enrolled key, chaining to a trusted
#     # manufacturer root (see the top-level `attestation` block); otherwise the
#     # enrollment is rejected fail-closed. "permissive" audits but never blocks.
#     attestation:
#       mode: require          # off (default) | permissive (audit only) | require
#     # key_checks configures the pre-issuance key-quality gate (CA/Browser Forum
#     # BR §6.1.1.3). It rejects weak (ROCA/CVE-2017-15361, weak RSA exponent,
#     # small/even modulus, Debian-weak) and known-compromised (operator-blocklisted,
#     # reused-subject) subject public keys BEFORE the HSM signs. The gate is ON for
#     # every profile by default in enforce mode; the block below is optional.
#     key_checks:
#       disabled: false        # true turns the gate off for this profile (discouraged)
#       mode: enforce          # enforce (default, blocks) | warn (audit only)
#       detect_duplicates: true  # flag a subject key already certified for another subject
#       min_rsa_bits: 2048     # minimum RSA modulus bit length (0 = 2048 default)
#   - name: server-muststaple
#     description: "TLS server certificate with OCSP Must-Staple (RFC 7633)"
#     key_usages: [digitalSignature, keyEncipherment]
#     ext_key_usages: [serverAuth]
#     default_validity_days: 90
#     max_validity_days: 397
#     # must_staple stamps the RFC 7633 TLS Feature / OCSP Must-Staple extension
#     # (id-pe-tlsfeature: status_request, a non-critical SEQUENCE OF INTEGER) on
#     # every leaf. A relying party that honors it aborts a TLS handshake in which
#     # the server does not staple a valid OCSP response, so the certificate cannot
#     # be used soft-fail. (A built-in "server-muststaple" profile is also provided.)
#     must_staple: true
#     # allow_must_staple_override lets a REST/gRPC issue request set must_staple
#     # per certificate (on or off); without it the profile default is fixed.
#     allow_must_staple_override: true
#     # lint.require_must_staple additionally flags (warn by default) any serverAuth
#     # leaf under this profile that ends up WITHOUT Must-Staple — a compliance
#     # safety net that catches a profile which forgot to set must_staple.
#     lint:
#       require_must_staple: true

# caa holds the deployment-wide CAA settings. Enforcement is opt-in per profile
# (see a profile's `caa` block above); this section supplies the CA identifier a
# profile inherits when it does not set its own, plus the DNS-answer cache TTL.
caa:
  # identifier is this CA's CAA domain identifier — the value a domain owner
  # publishes in `issue "pki.example.com"` to authorize this CA. Required for any
  # profile running caa.mode: enforce.
  identifier: ""
  cache_ttl_seconds: 300   # how long resolved CAA/CNAME answers are reused (0 = 300)

# keychecks holds the deployment-wide inputs to the pre-issuance key-quality gate
# (BR §6.1.1.3). Per-profile enforce/warn is set in each profile's `key_checks`
# block above; this section supplies the optional Debian OpenSSL / operator
# weak-key blocklist. The structural checks (ROCA, RSA exponent/modulus) and the
# operator compromised-key blocklist (secsy-ca blocked-keys) always run.
keychecks:
  # weak_key_blocklist_paths are files or directories of known-weak public-key
  # fingerprints (primarily the Debian predictable-key set, CVE-2008-0166). No
  # blob is vendored; supply the well-known lists yourself. Each line is a hex
  # SHA-256/SHA-1 of the DER SubjectPublicKeyInfo, or a "SHA256:<base64>"
  # fingerprint; '#' comments and blank lines are ignored. A configured path that
  # does not exist is a FATAL startup error (fail-closed).
  weak_key_blocklist_paths: []
  #  - /etc/secsy-pki/weak-keys/

# attestation configures hardware key-attestation verification on the device
# enrollment paths (EST/SCEP/ACME, Task 49). Enforcement is opt-in per profile
# (see a profile's `attestation` block above) or via default_mode below. This
# section supplies the trusted manufacturer roots every attestation certificate
# chain must terminate at (YubiKey PIV roots, TPM manufacturer roots, Apple
# attestation roots). Inert unless a profile (or default_mode) is non-"off".
attestation:
  default_mode: "off"        # off (default) | permissive | require
  # trusted_root_files lists PEM files of trusted manufacturer roots (and any
  # intermediates). Self-signed certificates are treated as roots; the rest as
  # chain-building intermediates.
  trusted_root_files: []
  #   - /etc/secsy-pki/attestation/yubico-piv-root.pem
  #   - /etc/secsy-pki/attestation/tpm-manufacturer-roots.pem
  #   - /etc/secsy-pki/attestation/apple-attestation-root.pem
  trusted_roots_pem: ""      # inline PEM alternative/supplement to the files above

# crl configures delta CRLs and CRL partitioning/sharding (RFC 5280). Defaults
# keep the pre-existing behavior: a single complete CRL, no stamped CDP URLs.
# See docs/certificate-authority.md.
crl:
  shards: 0                    # 0/1 = single complete CRL; N>=2 = N partitions
  base_url: ""                 # origin for CDP/IDP/Freshest-CRL URLs; falls back
                               # to acme.base_url when empty. No CDP is stamped
                               # into leaves if neither is set.
  delta_interval_minutes: 60   # how long a delta CRL is served before re-signing
  base_validity_hours: 168     # base CRL validity window (default 7 days)

# spiffe enables SPIFFE SVID workload-identity issuance. When enabled, the
# POST /api/ca/{id}/svid endpoint mints short-lived X.509-SVIDs (a single
# spiffe:// URI SAN as the sole identity, CA:false, digitalSignature), the
# POST /api/ca/{id}/svid/jwt endpoint mints HSM-signed JWT-SVIDs (bearer tokens
# with the SPIFFE ID in `sub` and a required `aud`), both restricted to the
# trust-domain allowlist below, and GET /api/ca/{id}/svid/bundle serves the CA's
# authorities as a JWKS-style SPIFFE trust bundle carrying both the x509-svid and
# jwt-svid verification keys. See docs/spiffe.md.
# spiffe:
#   enabled: true
#   trust_domains:               # global allowlist (fail-closed: empty = none)
#     - example.org
#     - prod.example.org
#   # subject_trust_domains:     # optional per-subject grants (RBAC-keyed)
#   #   "oidc-subject-or-verified-email": [team.example.net]
#   profile: spiffe-svid         # X.509-SVID issuance profile (built-in default)
#   default_ca_id: ""            # CA used when a request omits one
#   refresh_hint_seconds: 300    # advertised in the trust bundle (spiffe_refresh_hint)
#   renew_fraction: 0.5          # monitor auto-renews an SVID at 50% of its lifetime
#   # --- JWT-SVID ---
#   jwt_default_audience: []     # applied when a request omits aud (empty = aud required)
#   jwt_default_ttl_seconds: 3600  # JWT-SVID lifetime when a request omits one (default 1h)
#   jwt_max_ttl_seconds: 86400   # hard ceiling on a JWT-SVID lifetime (default 24h)

# certificate_transparency registers the RFC 6962 CT logs available to issuance
# profiles (referenced by name from a profile's `ct.logs`). Supplying a log's
# public_key (PEM SubjectPublicKeyInfo) enables cryptographic verification of the
# SCT signatures it returns; without it, SCTs are accepted on count alone.
#
# `operator` names the organization that runs each log; CT operator-diversity
# policies (a profile's min_distinct_operators / require_operators) count distinct
# operators, so it is required for any log a diversity policy submits to. Set it
# per log, or populate it in bulk from a Google/Chrome CT log-list v3 JSON via
# known_logs_file (explicit per-log operators win). See docs/certificate-transparency.md.
certificate_transparency:
  logs: []
# known_logs_file: /etc/secsy-pki/ct/log_list.json  # fill missing operators from a CT log list
#     - name: test-log
#       url: "https://ct.example.com/testlog"
#       operator: "Example Labs"
#       public_key: |
#         -----BEGIN PUBLIC KEY-----
#         ...
#         -----END PUBLIC KEY-----
#     - name: prod-log
#       url: "https://ct.googleapis.com/logs/xenon2025"
#       operator: "Google"
#       public_key_file: /etc/secsy-pki/ct/xenon2025.pem

# acme configures the RFC 8555 automated-issuance server (certbot / lego /
# acme.sh). Disabled by default; see docs/acme.md. When enabled, point it at an
# existing X.509 issuing CA and a certificate profile.
acme:
  enabled: false
  # base_url: "https://pki.example.com"   # else derived from the request Host
  # ca_label: "Secsy Issuing CA"          # or ca_id; the CA that signs ACME certs
  profile: "server"                       # the ACME-enabled profile
  # Challenge types offered per authorization (default: all three).
  # http-01 (port 80), tls-alpn-01 (port 443, RFC 8737), dns-01 (wildcards require dns-01).
  challenge_types: ["http-01", "dns-01", "tls-alpn-01"]
  # dns_resolver pins ALL challenge validation (dns-01 TXT lookups plus the
  # http-01 / tls-alpn-01 name resolution) to a specific host:port DNS server
  # instead of the system resolver. Empty (the default) uses the system resolver.
  # Useful for split-horizon deployments that must validate against a specific
  # DNS view; also used by scripts/interop-test.sh to make validation hermetic.
  # dns_resolver: "10.0.0.53:53"
  # require_eab: true                     # restrict who may register (RBAC-like)
  # eab_hmac_keys:
  #   team-web: "base64url-or-base64-hmac-key"
  # pre_authorization enables the optional ACME pre-authorization flow (RFC 8555
  # §7.4.1): the directory advertises a newAuthz resource that lets clients
  # authorize identifiers ahead of any order, and newOrder reuses a still-valid
  # pre-authorization for a matching identifier. Off by default.
  # pre_authorization: true
  # ACME Renewal Information (ARI, draft-ietf-acme-ari): advertised automatically.
  # renewal_window_days: 30               # when the suggested window opens (0 = derive)
  # renewal_window_width_hours: 360       # window width (0 = half the renew-before span)
  # renewal_poll_hours: 6                 # advertised Retry-After cadence
  # renewal_explanation_url: "https://pki.example.com/notices/mass-renewal"
  # Shared anti-replay nonce signing key (base64, >=16 bytes). Leave unset to have
  # the server generate one and persist it in the store so every replica agrees;
  # set it identically on every replica only to pin/rotate the key. Multi-replica
  # correctness does NOT require it.
  # nonce_hmac_key: "base64-encoded-32-byte-secret"
  # star enables RFC 8739 STAR short-term auto-renewed certificates: the directory
  # advertises meta.auto-renewal, newOrder accepts an "auto-renewal" object bounded
  # by the limits below, and a leader-elected renewer re-issues each certificate
  # ahead of expiry until its end-date. The client fetches the current certificate
  # from a stable star-certificate URL. Off by default. See docs/acme.md.
  # star:
  #   enabled: true
  #   min_lifetime_hours: 1        # floor on each certificate's lifetime (min-lifetime)
  #   max_lifetime_hours: 168      # ceiling on each certificate's lifetime (7 days)
  #   max_duration_days: 365       # longest total recurrence (max-duration)

# tsa exposes an RFC 3161 Time-Stamp Authority at /tsa (application/timestamp-
# query). Disabled by default; see docs/timestamping.md. Provision the signing
# key + certificate first with `secsy-ca tsa-key` — the key MUST be RSA.
tsa:
  enabled: false
  # path: /tsa                              # URL the endpoint mounts under
  # key_label: tsa-signer                   # provider label of the (RSA) TSA key
  # certificate_file: /etc/secsy/tsa.pem    # written by `secsy-ca tsa-key`
  # ca_label: "Secsy Issuing CA"            # or ca_id; issuer chain source
  # policy_oid: 1.3.6.1.4.1.99999.1.1       # your owned TSA policy OID
  # accuracy_seconds: 1                     # genTime accuracy bound (0/omit = none)
  # ordering: false                         # assert strict time ordering
  # signature_digest: sha256                # sha256 | sha384 | sha512
  # accepted_hashes: [sha256, sha384, sha512]  # message-imprint algs (sha1 opt-in)
  # include_tsa_name: false                 # embed signer subject as tsa GeneralName

# signing enables the artifact code-signing service (Task 60): CMS/PKCS#7
# detached signatures over release artifacts at POST /api/sign (RBAC role
# "signer") and via `secsy-ca sign`, with optional RFC 3161 countersignatures
# from the tsa service above. Provision each signer's key + certificate first
# with `secsy-ca signing-key` (lint-gated code-signing profile). See
# docs/artifact-signing.md.
signing:
  enabled: false
  # signers:
  #   - name: release                              # callers reference this name
  #     key_label: codesign-release                # provider label from signing-key
  #     certificate_file: /etc/secsy/codesign.pem  # written by signing-key
  #     ca_label: "Secsy Issuing CA"               # or ca_id; completes the chain
  #     digest: sha256                             # sha256 | sha384 | sha512
  #     timestamp: true                            # countersign by default (needs tsa.enabled)
  #     tenant: ""                                 # owning tenant ("" = default)

# cmp enables the Lightweight CMP (RFC 9483) certificate-management endpoint for
# enterprise clients that speak CMP rather than ACME/EST. It handles the ir/cr/
# kur/rr PKIMessage flows with shared-secret (PasswordBasedMac) or signature-based
# message protection; every leaf is signed through the shared HSM-backed CA.
# Disabled by default; see docs/enrollment.md.
cmp:
  enabled: false
  # path: /cmp                              # URL the endpoint mounts under
  # ca_label: "Secsy Issuing CA"            # or ca_id; the issuing CA
  # profile: client                         # default certificate profile
  # allow_signature_protection: true        # enable kur & signature-based rr
  # secrets:                                # shared secrets for MAC-protected ir/cr
  #   - reference: device-fleet-1           # the senderKID a client presents
  #     secret: "change-me-shared-secret"   # the PBM shared secret
  #     profile: client                     # optional per-secret profile override

# brski enables the RFC 8995 (BRSKI) registrar for zero-touch onboarding of
# IoT/network devices: validate the pledge's manufacturer IDevID against the
# trusted manufacturer roots (reused from `attestation`), obtain a signed voucher
# from a MASA, and hand the pledge off to EST for the HSM-backed LDevID. Requires
# est.enabled. Disabled by default; see docs/brski.md.
brski:
  enabled: false
  # base_path: /.well-known/brski           # registrar endpoints prefix
  # ca_label: "Secsy Issuing CA"            # or ca_id; the domain CA (defaults to the EST CA)
  # profile: client                         # issuance profile a pledge enrolls under
  # registrar_key_label: brski-registrar    # HSM key that signs voucher-requests
  # registrar_cert_file: /etc/secsy/brski/registrar.pem   # its certificate (+chain)
  # domain_cert_file: /etc/secsy/tls/server.pem           # cert the pledge pins (defaults to registrar cert)
  # trust_anchor_files:                     # extra IDevID manufacturer roots (supplements attestation roots)
  #   - /etc/secsy/brski/manufacturer-roots.pem
  # require_proximity: true                 # enforce the pledge pinned THIS registrar (recommended)
  # pledge_ttl_minutes: 10                  # post-voucher EST enrollment window
  masa:
    # url: https://masa.example.com/.well-known/brski   # external MASA, OR:
    builtin: false                          # run the minimal in-process MASA
    # key_label: brski-masa                 # HSM key that signs vouchers (built-in)
    # cert_file: /etc/secsy/brski/masa.pem  # MASA cert the pledge trusts (built-in)
    # voucher_validity_hours: 24            # bounds nonceless vouchers

# audit.export streams the tamper-evident event log to external SIEM systems.
# Disabled by default; see docs/audit-siem-export.md. Each sink has its own
# durable cursor, so delivery is at-least-once and lossless across restarts.
audit:
  export:
    enabled: false
    # poll_interval_seconds: 5   # how often a caught-up worker checks for events
    # batch_size: 256            # max events per delivery (backpressure knob)
    # retry_backoff_seconds: 1   # initial retry delay after a failed delivery
    # max_backoff_seconds: 30    # cap on the (doubling) retry delay
    sinks: []
    #   - name: soc-syslog                 # unique; keys the cursor & metrics
    #     type: syslog                      # syslog | webhook
    #     format: rfc5424                   # rfc5424 | cef  (json for webhook)
    #     network: tls                      # tcp | tls
    #     address: siem.example.com:6514
    #     framing: octet-counting           # octet-counting | lf
    #     tls:
    #       ca_file: /etc/secsy/siem-ca.pem
    #       # client_cert_file / client_key_file: mutual TLS
    #   - name: soc-webhook
    #     type: webhook
    #     format: json                      # newline-delimited JSON
    #     url: https://collector.example.com/ingest
    #     headers:
    #       Authorization: "Bearer <token>"

  # Audit-chain anchoring (RFC 3161): periodically bind the event log's head
  # hash into a timestamp token so whole-chain truncation/rewrite is detectable
  # by `secsy-ca audit verify`. Needs the internal TSA (tsa.enabled) or an
  # external tsa_url. See docs/RUNBOOK.md "Audit-chain anchoring".
  anchor:
    enabled: false
    # interval_hours: 24         # anchor cadence; bounds the truncation window
    # tsa_url: ""                # external RFC 3161 TSA; empty = internal TSA
    # timeout_seconds: 30        # external TSA request timeout

# rate_limit protects the public-facing endpoints (ACME newOrder/newAccount,
# OCSP, CRL, and SCEP/EST enrollment) from issuance abuse and HSM overload.
# Disabled by default; see docs/rate-limiting.md. When enabled, a token-bucket
# limiter meters requests across three independent tiers and a bounded in-flight
# guard caps how many signing/enrollment requests hit the HSM at once. Rejected
# requests get a 429 (or 503 when the HSM is saturated) with a Retry-After hint,
# so compliant ACME clients back off and recover gracefully.
rate_limit:
  enabled: false
  # Each tier is a token bucket: rate = sustained requests/second, burst = the
  # bucket capacity (short spikes allowed). A tier with rate/burst <= 0 is off.
  global:                        # aggregate cap across all clients
    rate: 200
    burst: 400
  per_ip:                        # per source IP (honors X-Forwarded-For)
    rate: 20
    burst: 40
  per_account:                   # per ACME account / EST user
    rate: 50
    burst: 100
  # per_tenant caps one tenant's aggregate rate across its public enrollment
  # endpoints (ACME/EST/SCEP/CMP, resolved from the protocol's bound CA). This
  # is the deployment-wide default; a tenant's own rate_limit_per_second /
  # rate_limit_burst quota fields (secsy-ca tenant quota, PUT /api/tenants/{id})
  # override it per tenant, applied live. OCSP/CRL are never metered per tenant,
  # so relying parties can always check revocation status.
  # per_tenant:
  #   rate: 50
  #   burst: 100
  # max_keys: 100000             # bound on distinct per-IP/per-account buckets
  # idle_ttl_seconds: 600        # idle bucket eviction window
  concurrency:                   # in-flight guard in front of the HSM session pool
    # enabled: true              # defaults on when rate_limit.enabled is true
    # max_in_flight: 0           # 0 => derived from pkcs11.session_pool_size
    max_queue: 64                # requests allowed to wait before shedding (503)
    acquire_timeout_ms: 5000     # max wait for a slot before shedding

# --- OpenTelemetry distributed tracing (OTLP) --------------------------------
# Emit end-to-end spans across the request middleware and the CA/HSM/store hot
# paths (issuance, HSM sign/session-pool wait, failover events, CRL/OCSP,
# pre-issuance lint/CAA/name-constraint gates, store writes), correlated with the
# structured request log via trace/span IDs. Complements the Prometheus metrics.
# Disabled by default: a no-op tracer, no exporter. See docs/tracing.md and the
# collector snippet in deploy/observability/tracing/. W3C traceparent is honored.
tracing:
  enabled: false
  endpoint: "otel-collector:4317"  # OTLP receiver host:port (grpc :4317 / http :4318)
  protocol: grpc                   # grpc | http
  insecure: true                   # disable transport TLS (in-cluster/trusted network)
  sample_ratio: 0.1                # head-based [0,1]; parent-sampled traces always kept
  service_name: secsy-pki          # service.name resource attribute
  # service_version: "1.0.0"
  timeout_seconds: 10              # per-export attempt timeout
  # headers:                       # optional static export headers (auth token, etc.)
  #   authorization: "Bearer ..."

# --- External certificate discovery/scanner (Task 54) -------------------------
# Periodically probes a list of TLS endpoints, records the served leaf
# certificates into the discovered-certificate inventory, and flags expiring,
# weak-key, SHA-1, self-signed, hostname-mismatched, and rogue (not-issued-by-
# this-PKI) certs. Flagged findings are dispatched through the same notification
# sinks as the expiry monitor. Inert unless enabled; the `secsy-ca discover` CLI
# and the /api/discovery endpoints work regardless of this block.
discovery:
  enabled: false
  interval_hours: 24            # background scan cadence (default 24)
  expiry_days: 30               # "expiring soon" window (default 30)
  # targets are literal host[:port][#sni] endpoints; #sni overrides the SNI.
  targets: []
  #   - "example.com"                 # :443, SNI=example.com
  #   - "10.0.0.5:8443#internal.svc"  # explicit port + SNI
  # hosts_file: "discovery-hosts.txt" # one endpoint per line ('#' comments)
  # cidrs: ["10.0.0.0/28"]            # expand each host address on default_port
  default_port: 443
  dial_timeout_seconds: 8
  concurrency: 16
  store: true                   # persist findings to the inventory
  notify: false                 # dispatch flagged findings via monitor.notifications

# --- Synthetic issuance canary (Task 71) --------------------------------------
# An end-to-end self-test loop that continuously proves the issuance path
# works: per listed CA it periodically issues a short-lived certificate from
# the dedicated (non-public, lint-enforced) "canary" profile, verifies the
# full chain, checks the OCSP responder answers "good" and the CRL is fresh,
# revokes the certificate, and confirms "revoked" propagates — timing every
# stage (secsy_canary_* metrics). Failures alert through the expiry monitor's
# notification sinks; `secsy-ca doctor` surfaces the last probe outcome.
# Probe certs carry the "canary" marker, keeping them out of expiry
# monitoring and inventory reports. Leader-gated with replicas > 1.
# Note: probes consume the probed CA's tenant issuance quota (one cert per
# probe) and a few HSM signatures per run. See docs/canary.md.
canary:
  enabled: false
  interval_minutes: 15          # probe cadence per CA (default 15)
  timeout_seconds: 60           # per-CA probe budget; must be < interval
  cas: []                       # REQUIRED when enabled: CA ids or labels
  #   - "Secsy Issuing CA"
  profile: "canary"             # issuance profile for probe certs

# --- HSM-backed secret encryption (envelope encryption) -----------------------
# Encrypt passwords and small secrets under a KEK held in the HSM. See
# docs/password-encryption.md. When secret.kek_label is unset, the /api/secret/*
# endpoints are disabled.
# secret:
#   kek_label: "secsy-kek"       # RSA KEK label (create with `secsy-secret init-kek`)
#   # Optional M-of-N key escrow: recover a data key under dual control if the
#   # original requester loses access. The DEK is Shamir-split across the
#   # recovery agents; any `threshold` of them can reconstruct it, fewer cannot.
#   escrow:
#     enabled: true
#     threshold: 2               # quorum M (>= 2 for dual control, <= number of agents)
#     agents:                    # N recovery agents
#       - id: "alice"
#         key_label: "agent-alice"        # RSA key in the provider/HSM
#       - id: "bob"
#         key_label: "agent-bob"
#       - id: "carol"
#         # public_key_file: "carol.pub"  # or an externally-held public key (wrap-only)
#         key_label: "agent-carol"
#   # Format-preserving encryption / tokenization templates (NIST SP 800-38G FF1).
#   # Each enciphers structured data into a value of the SAME length over the SAME
#   # alphabet; a deterministic template yields stable ciphertext for equal input
#   # (equality search / de-duplication). Keys are HKDF-derived per template from a
#   # seed sealed under kek_label. See docs/password-encryption.md.
#   transforms:
#     - name: pan                # referenced by callers; bound into the derived key
#       alphabet: digits         # named set, or an inline "chars:<symbols>" literal
#       min_length: 12           # >= FF1 domain minimum for the radix (radix^len >= 1e6)
#       max_length: 19
#       deterministic: true      # convergent: equal PAN -> equal token
#       preserve_other: true     # copy separators (dashes/spaces) through verbatim
#     - name: account
#       alphabet: alphanumeric   # radix 62
#       deterministic: false     # context mode: a per-request tweak varies the token
#       tweak_source: request    # re-supply the same tweak to decode
#       # roles: [issuer]        # optional per-template role allowlist

# --- Four-eyes / maker-checker approval gate ----------------------------------
# Hold high-risk operations until a configurable number of DISTINCT approvers
# (never the requester) sign off. Approving requires the `approver` role
# (approval:approve), deliberately separate from the roles that REQUEST the
# operations. The gate is disabled unless approvals.enabled is set, so existing
# deployments are unaffected until they opt in. See docs/approvals.md.
approvals:
  enabled: false
  # default_threshold is the distinct-approver count for any guarded class without
  # its own threshold. A bare `enabled: true` defaults it to 2 (classic four-eyes);
  # if only per-class thresholds are given, unlisted classes stay ungated.
  default_threshold: 2
  # request_ttl_hours bounds how long a pending request stays actionable (default 72).
  request_ttl_hours: 72
  # thresholds overrides the approver count per operation class. A value of 0
  # leaves that class ungated even while approvals are enabled. Classes:
  #   ca.create, ca.rotate, ca.retire, revocation.bulk, secret.kek_rotate,
  #   profile.change, escrow.policy, cert.issue (Task 84), and token.create
  #   (Task 86: minting an API token with a privileged role or platform scope).
  #
  # cert.issue guards operator/API leaf issuance, but ONLY for profiles whose
  # require_approval flag is set (see the profiles block). Automated protocol
  # flows (ACME/EST/SCEP/CMP) enroll machines and always bypass the manual gate.
  # Approve with `secsy-ca approvals approve <id>` (or the console Approvals page),
  # then fetch the certificate with `secsy-ca approvals certificate <id>` or
  # GET /api/approvals/<id>/certificate.
  thresholds: {}
  #   cert.issue: 2
  #   ca.create: 2
  #   token.create: 2
  #   revocation.bulk: 3

# Scheduled encrypted backups (Task 89): a leader-elected background job that
# periodically produces the disaster-recovery backup artifact — a logical
# database dump (SQLite VACUUM INTO snapshot, or pg_dump for PostgreSQL), the
# running config, the public CA material, and the audit-chain head fingerprint —
# envelope-encrypts it under the HSM-backed secret KEK, and writes it to a local
# directory or S3-compatible store with an atomic swap, a manifest, and keep-N /
# max-age retention. It never blocks issuance and is a no-op on non-leader
# replicas. Disabled unless backup.enabled is set. See docs/backup.md.
backup:
  enabled: false
  schedule:
    interval_hours: 24          # how often a backup runs (default 24); one runs
                                # immediately on leadership gain, then per interval
  # kek_label is the secret-layer KEK the artifact is encrypted under. Empty
  # inherits secret.kek_label; at least one must be set when enabled.
  kek_label: ""
  # include_config bundles this config file into the (encrypted) artifact so a
  # restore has the exact configuration. Default true.
  include_config: true
  retention:
    keep: 7                     # keep the N most-recent backups (default 7)
    max_age_days: 30            # also delete backups older than this (0 = no age
                                # limit); the current backup is always kept
  # Destination — reuses the publish backends. Setting s3.bucket selects S3,
  # otherwise the local directory is used.
  dir:
    path: "/var/lib/secsy-pki/backups"
    # keep_snapshots is derived from retention.keep.
  s3:
    bucket: ""                  # set to enable the S3 backend
    region: "us-east-1"
    endpoint: ""                # e.g. http://minio:9000 for S3-compatible stores
    prefix: "secsy-backups"
    access_key_id: ""           # empty uses the default AWS credential chain
    secret_access_key: ""
    # NOTE: an S3 destination keeps only the latest backup (fixed keys); use
    # bucket versioning + lifecycle rules for keep-N / max-age history.

# Certificate-inventory retention/archival (Task 157). A leader-elected loop
# that safely ages out long-expired, terminal issued-certificate rows so a
# high-volume CA (short-lived STAR/ACME issuance) does not grow
# issued_certificates unbounded. The policy is fail-safe by construction:
# eligibility is driven by not_after, so a still-valid or revoked-but-not-yet-
# expired certificate (not_after in the future) is NEVER eligible. Held
# (suspended) certificates and certificates pinned by an open approval are
# additionally excluded. The job never touches the authoritative
# revoked_certificates table, so OCSP/CRL for every retained serial is
# unaffected. The `secsy-ca inventory retention` CLI (run/dry-run/status) works
# regardless of this block. See docs/retention.md.
retention:
  enabled: false
  # mode: "archive" MOVES eligible rows into issued_certificates_archive (nothing
  # is lost; the hot table shrinks). "prune" archives, then hard-deletes archive
  # rows past prune_after_days — "delete after successful archive". Default archive.
  mode: "archive"
  # min_age_days is the grace window: a terminal certificate becomes eligible only
  # once its not_after passed more than this many days ago. Default 90 — retention
  # must never be aggressive by accident.
  min_age_days: 90
  # prune_after_days (prune mode) hard-deletes archive rows whose not_after passed
  # more than this many days ago. 0 defaults to min_age_days (archived rows are
  # pruned as soon as they are archived). Values below min_age_days are clamped up.
  prune_after_days: 0
  schedule:
    interval_hours: 24          # how often retention runs (default 24); one runs
                                # immediately on leadership gain, then per interval
  batch_size: 500               # rows per transaction (default 500); keeps the job
                                # online-safe on a large inventory
