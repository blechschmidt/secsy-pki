server:
  host: "0.0.0.0"
  port: 8443
  tls_cert: "certs/server.crt"
  tls_key: "certs/server.key"

database:
  driver: "sqlite"
  dsn: "ssh-pki.db"

oidc:
  issuer_url: "http://localhost:8080/realms/ssh-pki"
