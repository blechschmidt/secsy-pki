server:
  host: "0.0.0.0"
  port: 8443
  tls_cert: "certs/server.crt"
  tls_key: "certs/server.key"
  # ocsp_cache_ttl_seconds bounds how long a signed OCSP response is reused from
  # the in-memory cache before being re-signed on the HSM. 0 uses the server
  # default (1h); a negative value disables caching. Revocations invalidate the
  # affected entry immediately. See docs/benchmarks.md.
  ocsp_cache_ttl_seconds: 3600
  # OCSP responder hardening (RFC 6960 / RFC 8954). All fields are optional.
  ocsp:
    # Echo the request nonce in the signed response (bypasses the cache for
    # nonce-bearing requests). Defaults to true when omitted.
    nonce_enabled: true
    # Validity window for a nonce-bearing (freshly signed) response, in seconds.
    nonce_max_age_seconds: 60
    # Sign responses with a short-lived HSM-backed delegated OCSP-signing
    # certificate (id-kp-OCSPSigning + ocsp-nocheck) instead of the CA key.
    delegated: false
    delegated_validity_hours: 168          # 7 days
    delegated_key_type: "ecdsa-sha2-nistp256"
    # CA that issued this server's own TLS certificate; when set, the server
    # staples a fresh OCSP response to its TLS handshake (RFC 6066).
    staple_ca_id: ""

database:
  driver: "sqlite"
  dsn: "secsy-pki.db"

oidc:
  issuer_url: "http://localhost:8080/realms/secsy-pki"
  client_id: "secsy-pki"

root_user:
  username: "root"
  password: "change-me-in-production"

# key_provider selects the backend used to generate and sign with CA keys.
#   type: "pkcs11"  -> keys live on an HSM / PKCS#11 token (see the pkcs11 block)
#   type: "software" -> keys live in an on-disk keystore (see software.keystore_dir)
# If omitted, the type defaults to "pkcs11" when pkcs11.module_path is set,
# otherwise "software". These may be overridden by the SECSY_* environment
# variables emitted by scripts/setup-softhsm.sh --export-env.
key_provider:
  type: "pkcs11"
  software:
    keystore_dir: "keystore"

pkcs11:
  module_path: "/usr/lib/pkcs11/yubihsm_pkcs11.so"
  pin: "0001password"
  token_label: "YubiHSM"
  # session_pool_size bounds concurrent PKCS#11 sessions (and thus concurrent
  # on-device operations); requests beyond it queue. 0/omitted uses the default
  # (8). Size it toward the HSM's supported concurrent-session limit. See
  # docs/benchmarks.md for tuning guidance.
  session_pool_size: 8

yubihsm:
  connector_url: "yhusb://"
  auth_key_id: 1
  password: "password"

# ---------------------------------------------------------------------------
# Enterprise: RBAC, policy, and custom certificate profiles (Task 8)
# ---------------------------------------------------------------------------

# rbac assigns organization-wide roles to OIDC subjects and to group IDs.
# Recognized roles:
#   admin   - full control (equivalent to the built-in root user)
#   issuer  - may issue/renew/revoke certs on any CA (restriction sets still
#             apply) and encrypt/decrypt secrets; may read logs
#   auditor - read-only access to the audit, access, and event logs
# Subject keys may be the OIDC "sub" claim or the user's email. Group keys are
# the group IDs from the /api/groups store. A user's effective roles are the
# union of its subject and group assignments. Unknown role names are rejected
# at startup.
rbac:
  subjects: {}
  #   "1a2b3c-oidc-subject": [admin]
  #   "auditor@example.com": [auditor]
  groups: {}
  #   "group-uuid-for-pki-ops": [issuer]

# policy holds system-wide issuance guardrails, enforced centrally regardless
# of per-CA restriction sets.
policy:
  # Cap the validity of any issued end-entity certificate (0 = no global cap;
  # per-profile and per-CA limits still apply).
  max_cert_validity_days: 0
  # Require a non-empty reason on sign requests that carry a reason field.
  require_reason: false
  # Accept the built-in root basic-auth user. Set to false in production once
  # OIDC admins are configured to remove the shared-credential superuser.
  allow_root_basic_auth: true

# profiles defines custom certificate profiles layered over the built-ins
# (server, client, server-client, code-signing, email). A custom profile with
# the same name as a built-in overrides it.
profiles: []
#   - name: short-lived-client
#     description: "Ephemeral mTLS client certificate"
#     key_usages: [digitalSignature]
#     ext_key_usages: [clientAuth]
#     default_validity_days: 7
#     max_validity_days: 30
#   - name: server-ct
#     description: "TLS server certificate with Certificate Transparency"
#     key_usages: [digitalSignature, keyEncipherment]
#     ext_key_usages: [serverAuth]
#     default_validity_days: 90
#     # ct enables RFC 6962 precertificate submission + SCT embedding for this
#     # profile. Referenced logs must be registered under certificate_transparency.
#     ct:
#       enabled: true
#       logs: [test-log]      # empty = submit to every registered log
#       min_scts: 1           # minimum SCTs the policy requires (default 1)
#       fail_open: false      # false = reject issuance if the policy is not met;
#                             # true = issue anyway with whatever SCTs were obtained
#       timeout_seconds: 5    # per-log attempt timeout
#       retries: 2            # extra attempts per log after the first
#   - name: public-tls
#     description: "Publicly-trusted TLS server certificate (CA/B BR enforced)"
#     key_usages: [digitalSignature, keyEncipherment]
#     ext_key_usages: [serverAuth]
#     default_validity_days: 90
#     max_validity_days: 397
#     # lint configures the pre-issuance lint gate (CA/Browser Forum Baseline
#     # Requirements). It runs on every to-be-signed certificate BEFORE the HSM
#     # signs it and is fail-closed by default: an enforce-mode violation aborts
#     # issuance. Linting is on for every profile; the block below is optional.
#     lint:
#       disabled: false        # true turns the gate off for this profile (discouraged)
#       mode: enforce          # default mode for all checks: enforce | warn
#       public: true           # apply public-trust rules: SAN required, CN in SAN,
#                              # no internal names / reserved IPs, 398-day TLS cap
#       overrides:             # per-check mode overrides, keyed by check code
#         cn_in_san: warn
#     # caa configures the DNS Certification Authority Authorization gate (RFC
#     # 8659). It resolves the CAA RRset for every DNS-name SAN before the HSM
#     # signs and, under enforce mode, blocks issuance when the RRset does not
#     # authorize this CA (fail-closed). IP-only certificates skip the check.
#     caa:
#       mode: enforce          # off (default) | permissive (audit only) | enforce
#       identifier: pki.example.com  # overrides the top-level caa.identifier
#       timeout_seconds: 5     # bounds all DNS lookups for one certificate

# caa holds the deployment-wide CAA settings. Enforcement is opt-in per profile
# (see a profile's `caa` block above); this section supplies the CA identifier a
# profile inherits when it does not set its own, plus the DNS-answer cache TTL.
caa:
  # identifier is this CA's CAA domain identifier — the value a domain owner
  # publishes in `issue "pki.example.com"` to authorize this CA. Required for any
  # profile running caa.mode: enforce.
  identifier: ""
  cache_ttl_seconds: 300   # how long resolved CAA/CNAME answers are reused (0 = 300)

# certificate_transparency registers the RFC 6962 CT logs available to issuance
# profiles (referenced by name from a profile's `ct.logs`). Supplying a log's
# public_key (PEM SubjectPublicKeyInfo) enables cryptographic verification of the
# SCT signatures it returns; without it, SCTs are accepted on count alone.
certificate_transparency:
  logs: []
#     - name: test-log
#       url: "https://ct.example.com/testlog"
#       public_key: |
#         -----BEGIN PUBLIC KEY-----
#         ...
#         -----END PUBLIC KEY-----
#     - name: prod-log
#       url: "https://ct.googleapis.com/logs/xenon2025"
#       public_key_file: /etc/secsy-pki/ct/xenon2025.pem

# acme configures the RFC 8555 automated-issuance server (certbot / lego /
# acme.sh). Disabled by default; see docs/acme.md. When enabled, point it at an
# existing X.509 issuing CA and a certificate profile.
acme:
  enabled: false
  # base_url: "https://pki.example.com"   # else derived from the request Host
  # ca_label: "Secsy Issuing CA"          # or ca_id; the CA that signs ACME certs
  profile: "server"                       # the ACME-enabled profile
  challenge_types: ["http-01", "dns-01"]  # wildcards require dns-01
  # require_eab: true                     # restrict who may register (RBAC-like)
  # eab_hmac_keys:
  #   team-web: "base64url-or-base64-hmac-key"
  # ACME Renewal Information (ARI, draft-ietf-acme-ari): advertised automatically.
  # renewal_window_days: 30               # when the suggested window opens (0 = derive)
  # renewal_window_width_hours: 360       # window width (0 = half the renew-before span)
  # renewal_poll_hours: 6                 # advertised Retry-After cadence
  # renewal_explanation_url: "https://pki.example.com/notices/mass-renewal"

# tsa exposes an RFC 3161 Time-Stamp Authority at /tsa (application/timestamp-
# query). Disabled by default; see docs/timestamping.md. Provision the signing
# key + certificate first with `secsy-ca tsa-key` — the key MUST be RSA.
tsa:
  enabled: false
  # path: /tsa                              # URL the endpoint mounts under
  # key_label: tsa-signer                   # provider label of the (RSA) TSA key
  # certificate_file: /etc/secsy/tsa.pem    # written by `secsy-ca tsa-key`
  # ca_label: "Secsy Issuing CA"            # or ca_id; issuer chain source
  # policy_oid: 1.3.6.1.4.1.99999.1.1       # your owned TSA policy OID
  # accuracy_seconds: 1                     # genTime accuracy bound (0/omit = none)
  # ordering: false                         # assert strict time ordering
  # signature_digest: sha256                # sha256 | sha384 | sha512
  # accepted_hashes: [sha256, sha384, sha512]  # message-imprint algs (sha1 opt-in)
  # include_tsa_name: false                 # embed signer subject as tsa GeneralName

# cmp enables the Lightweight CMP (RFC 9483) certificate-management endpoint for
# enterprise clients that speak CMP rather than ACME/EST. It handles the ir/cr/
# kur/rr PKIMessage flows with shared-secret (PasswordBasedMac) or signature-based
# message protection; every leaf is signed through the shared HSM-backed CA.
# Disabled by default; see docs/enrollment.md.
cmp:
  enabled: false
  # path: /cmp                              # URL the endpoint mounts under
  # ca_label: "Secsy Issuing CA"            # or ca_id; the issuing CA
  # profile: client                         # default certificate profile
  # allow_signature_protection: true        # enable kur & signature-based rr
  # secrets:                                # shared secrets for MAC-protected ir/cr
  #   - reference: device-fleet-1           # the senderKID a client presents
  #     secret: "change-me-shared-secret"   # the PBM shared secret
  #     profile: client                     # optional per-secret profile override

# audit.export streams the tamper-evident event log to external SIEM systems.
# Disabled by default; see docs/audit-siem-export.md. Each sink has its own
# durable cursor, so delivery is at-least-once and lossless across restarts.
audit:
  export:
    enabled: false
    # poll_interval_seconds: 5   # how often a caught-up worker checks for events
    # batch_size: 256            # max events per delivery (backpressure knob)
    # retry_backoff_seconds: 1   # initial retry delay after a failed delivery
    # max_backoff_seconds: 30    # cap on the (doubling) retry delay
    sinks: []
    #   - name: soc-syslog                 # unique; keys the cursor & metrics
    #     type: syslog                      # syslog | webhook
    #     format: rfc5424                   # rfc5424 | cef  (json for webhook)
    #     network: tls                      # tcp | tls
    #     address: siem.example.com:6514
    #     framing: octet-counting           # octet-counting | lf
    #     tls:
    #       ca_file: /etc/secsy/siem-ca.pem
    #       # client_cert_file / client_key_file: mutual TLS
    #   - name: soc-webhook
    #     type: webhook
    #     format: json                      # newline-delimited JSON
    #     url: https://collector.example.com/ingest
    #     headers:
    #       Authorization: "Bearer <token>"

# rate_limit protects the public-facing endpoints (ACME newOrder/newAccount,
# OCSP, CRL, and SCEP/EST enrollment) from issuance abuse and HSM overload.
# Disabled by default; see docs/rate-limiting.md. When enabled, a token-bucket
# limiter meters requests across three independent tiers and a bounded in-flight
# guard caps how many signing/enrollment requests hit the HSM at once. Rejected
# requests get a 429 (or 503 when the HSM is saturated) with a Retry-After hint,
# so compliant ACME clients back off and recover gracefully.
rate_limit:
  enabled: false
  # Each tier is a token bucket: rate = sustained requests/second, burst = the
  # bucket capacity (short spikes allowed). A tier with rate/burst <= 0 is off.
  global:                        # aggregate cap across all clients
    rate: 200
    burst: 400
  per_ip:                        # per source IP (honors X-Forwarded-For)
    rate: 20
    burst: 40
  per_account:                   # per ACME account / EST user
    rate: 50
    burst: 100
  # max_keys: 100000             # bound on distinct per-IP/per-account buckets
  # idle_ttl_seconds: 600        # idle bucket eviction window
  concurrency:                   # in-flight guard in front of the HSM session pool
    # enabled: true              # defaults on when rate_limit.enabled is true
    # max_in_flight: 0           # 0 => derived from pkcs11.session_pool_size
    max_queue: 64                # requests allowed to wait before shedding (503)
    acquire_timeout_ms: 5000     # max wait for a slot before shedding

# --- HSM-backed secret encryption (envelope encryption) -----------------------
# Encrypt passwords and small secrets under a KEK held in the HSM. See
# docs/password-encryption.md. When secret.kek_label is unset, the /api/secret/*
# endpoints are disabled.
# secret:
#   kek_label: "secsy-kek"       # RSA KEK label (create with `secsy-secret init-kek`)
#   # Optional M-of-N key escrow: recover a data key under dual control if the
#   # original requester loses access. The DEK is Shamir-split across the
#   # recovery agents; any `threshold` of them can reconstruct it, fewer cannot.
#   escrow:
#     enabled: true
#     threshold: 2               # quorum M (>= 2 for dual control, <= number of agents)
#     agents:                    # N recovery agents
#       - id: "alice"
#         key_label: "agent-alice"        # RSA key in the provider/HSM
#       - id: "bob"
#         key_label: "agent-bob"
#       - id: "carol"
#         # public_key_file: "carol.pub"  # or an externally-held public key (wrap-only)
#         key_label: "agent-carol"
